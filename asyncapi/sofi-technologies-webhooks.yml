    its markdown twin at <url>.md. Event CODES (four-letter, e.g. DAUT, BNSF, NACT, IPIN, PUMP, BNPD,
    STPN) are on the individual pages; only the codes actually read during this pass are asserted, in
    errors/sofi-technologies-decline-codes.yml.
