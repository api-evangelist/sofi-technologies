specification: API Commons Webhooks
specificationVersion: '0.1'
provider: SoFi Technologies
providerId: sofi-technologies
generated: '2026-09-06'
method: searched
source: https://docs.tech.sofi.com/pro/reference/api-reference-events-api-about-events-api
asyncapi:
  published: false
  note: SoFi Tech Solutions publishes NO AsyncAPI document. Its event surface is described with OpenAPI
    documents that model the CLIENT side of the webhook - the client hosts the endpoint and the platform
    POSTs to it - which is why every webhook definition has a placeholder server (https://client.domain.com,
    https://example.client.domain.com) rather than a SoFi host. Nothing has been fabricated to fill the
    AsyncAPI slot.
description: 'SoFi Tech Solutions runs a substantial event surface: four webhook categories carrying at
  least 124 documented event types, plus two decisioning webhooks the client answers synchronously. The
  distinction matters - the Events API is a notification firehose the client consumes, while the Auth
  API and External Trans API hand the client the authorization or ACH/billpay decision itself and read
  the verdict out of the HTTP response body.'
surfaces:
- name: Events API
  kind: notification
  version: 1.0.0
  spec: openapi/sofi-technologies-events-api-openapi.json
  also_known_as: Alerts API
  endpoints:
  - path: /AccountEvent
    operationId: webhook_account_event_post
    category: Account Events
  - path: /Authorization
    operationId: webhook_authorization_event_post
    category: Authorization Events
  - path: /Settlement
    operationId: webhook_settlement_event_post
    category: Settlement Events
  - path: /Transaction
    operationId: webhook_transaction_event_post
    category: Transaction Events
  hosted_by: the client - the client provides the URLs; the platform POSTs to them
  event_identifier: the type field in the payload
  docs: https://docs.tech.sofi.com/pro/reference/api-reference-events-api-about-events-api
  security_docs: https://docs.tech.sofi.com/pro/reference/api-reference-events-api-about-events-api-security
  retry_docs: https://docs.tech.sofi.com/pro/reference/api-reference-events-api-about-events-api-retry
  field_selection: Each event has default fields included in the default webhook template plus optional
    fields the client can enable, so two clients subscribed to the same event can receive different payloads.
  setup_docs: https://docs.tech.sofi.com/pro/docs/event-setup-and-configuration
- name: Auth API
  kind: decisioning
  version: 2.0.0
  spec: openapi/sofi-technologies-auth-api-openapi.json
  endpoints:
  - path: /basepath/Authorization
    operationId: webhook_authorization_post_2
  - path: /base_path/Authorization
    operationId: webhook_authorization_post_3
  purpose: Lets the client participate in the authorization decision. The payload carries the network's
    proposed response_code; the client overrides it in the HTTP response body to approve or deny.
  wire_format: payload populated from the ISO 8583 authorization request the card network sends
  security_scheme: bearerAuth (http bearer, JWT)
  timeout_event: auth_api_timeout - the platform emits an event when the client does not answer in time
  docs: https://docs.tech.sofi.com/pro/reference/api-reference-auth-api-about-auth-api
- name: External Trans API
  kind: decisioning
  version: 1.0.0
  spec: openapi/sofi-technologies-external-trans-api-openapi.json
  endpoints:
  - path: /achdebit
    operationId: webhook_ach_debit_post
  - path: /billpay
    operationId: webhook_billpay_post
  purpose: Lets the client approve or deny incoming ACH debits and bill payments. "Use the response_code
    field in the response to communicate your decision to SoFi Tech Solutions."
  docs: https://docs.tech.sofi.com/pro/reference/api-reference-external-trans-api-about-external-trans-api
