description: >-
  SoFi Tech Solutions publishes no developer pricing. The platform is sold through a signed
  program agreement negotiated with the SoFi Tech Solutions team, and pricing depends on the
  program's card, deposit and payment configuration. There is no self-serve tier, no rate card,
  no per-call price and no published minimum. Sandbox access is free but is requested through a
  form and granted by SoFi, not provisioned on signup.
