description: SoFi Technologies operates a direct-to-consumer banking, lending, and investing platform.
  It does not publish a developer pricing page or a partner-facing API plan SKU on sofi.com. Member-facing
  product pricing (loans, deposits, investing) is regulated and disclosed per product, not as an API
  plan. Treat as a closed B2C provider with no public developer plan.
sources:
  - https://www.sofi.com
notes: SoFi does not publish developer-facing API pricing or plan tiers; sofi.com/api returns a 404 and
  no api.sofi.com developer portal is publicly listed. Product-level rates (APYs, loan APRs) are member
  disclosures, not API plans. Artifact trimmed to a single Contact Sales placeholder; reconciled is false.
