- aid: sofi-technologies:sofi-tech-solutions-auth-api
  name: SoFi Tech Solutions Auth API
  description: The authorization controller webhook. SoFi Tech Solutions hands the client the in-flight
    card authorization - populated from the ISO 8583 message the network sent, including CAVV and 3-D
    Secure fields - along with the response_code it intends to return to the merchant, and the client
    overrides that code in the HTTP response body to approve or deny. This is the platform surface where
    the client, not the processor, makes the decision.
