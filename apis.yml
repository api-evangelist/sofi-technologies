name: SoFi Technologies
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/sofi-technologies.png
description: 'SoFi Technologies, Inc. (NASDAQ: SOFI) is a US member-centric digital financial services
  company and federally chartered bank holding company. Alongside its consumer banking, lending and investing
  business it operates SoFi Tech Solutions - the B2B financial technology platform formed from its acquisitions
  of Galileo Financial Technologies and Technisys, and rebranded under the SoFi name in 2026. SoFi Tech
  Solutions is the API business: a card issuer-processor and banking-as-a-service platform whose public
  developer hub at docs.tech.sofi.com publishes eleven OpenAPI definitions covering 258 operations - the
  167-operation Program API for accounts, cards, authorizations, ACH and bill pay, plus Payment Hub, Dispute,
  Loan, Risk and Public Config APIs and three client-hosted webhook contracts. The platform declares ISO
  20022, ISO 8583, Nacha ACH, EMV and 3-D Secure in its own contracts, and discovery runs through a real
  RFC 9727 api-catalog linkset.'
