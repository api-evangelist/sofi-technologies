x-api-bases:
  note: 'STEP 22b: repair-api-bases.py reports `disagreement` for this record, and the disagreement is
    correct rather than a defect. SoFi Tech Solutions gives each API family its own host template - api-{corename}.{env}.gpsrv.com
    for the Program API, {corename}.payment-hub.{env}.gpsrv.com for Payment Hub, {corename}.gft-dispute-api.{env}.gpsrv.com
    for Dispute 3.0, lending-{corename}.{env}.gpsrv.com for Loan, and so on - and each baseURL above was
    taken from that API''s own servers[] block, never picked for all of them. The three webhook contracts
    (Events, Auth, External Trans) carry placeholder hosts (client.domain.com, example.client.domain.com)
    because the CLIENT hosts those endpoints and provides the URL; those are the provider''s own published
    server values and are recorded verbatim rather than replaced with a SoFi host that does not exist.
    corename is assigned per client at onboarding; env is cv (client validation) or pd (production). The
    shared Sandbox is reached at https://sandbox-api.gpsrv.com/intserv/4.0/.'
x-contract-ownership:
  note: 'The eleven OpenAPI definitions in openapi/ were fetched from the RFC 9727 api-catalog at https://docs.tech.sofi.com/pro/.well-known/api-catalog
    - SoFi Technologies own hostname - and they name their publisher in their own text: the External Trans
    API describes "the SoFi Tech Solutions backoffice system", the Auth API says "SoFi Tech Solutions
    initializes the webhook payload", and the reference pages say SoFi Tech Solutions throughout. The
    gpsrv.com server hostnames and the gft- path prefixes are the legacy Galileo Financial Technologies
    processing names, retained after SoFi Technologies acquired Galileo in 2020 and rebranded it to SoFi
    Tech Solutions in 2026 (https://tech.sofi.com/news/galileo-financial-technologies-rebranding-to-sofi-tech-solutions/).
    The sibling record all/galileo-fs documents the same platform under its pre-rebrand identity and legacy
    docs.galileo-ft.com host; this record documents the surface as SoFi publishes it today.'
