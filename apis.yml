    customer enrollment and identity verification, account and card creation, balances, authorizations,
    transaction and fee history, adjustments, ACH origination, bill pay, spend controls and card provisioning.
    Every operation is a POST with application/x-www-form-urlencoded parameters and returns a proprietary
    envelope whose outcome is in status_code, not in the HTTP status.'
