          Real RFC 9727 linkset. One anchor (https://docs.tech.sofi.com/pro) whose service-desc
          points at the per-project catalog below.
      - path: /pro/.well-known/api-catalog
        status: 200
        file: sofi-technologies-pro-api-catalog.json
        content_type: application/linkset+json
        note: >-
          Real RFC 9727 linkset, 101 service-desc entries of media type
          application/vnd.oai.openapi+json. Fetching each yielded 11 distinct parseable OpenAPI
          definitions (258 operations); the remaining 90 ids return the ReadMe HTML shell and are
          superseded or non-public spec revisions.
      - { path: /.well-known/openid-configuration, status: 404 }
      - { path: /.well-known/oauth-authorization-server, status: 404 }
      - path: /.well-known/security.txt
        status: 200
        note: >-
          NOT a document. Returns the 952 KB ReadMe single-page-app HTML shell, as every unmatched
          path on this host does. Recorded as a miss.
      - path: /.well-known/ai-plugin.json
        status: 200
