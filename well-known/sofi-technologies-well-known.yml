specification: API Commons Well-Known
specificationVersion: '0.1'
provider: SoFi Technologies
providerId: sofi-technologies
generated: '2026-09-06'
method: probed
source: >-
  Anonymous HTTPS GETs of the five canonical /.well-known/ paths against every host this record
  knows: the registrable domain and www, the API host in apis.yml, the SoFi Tech Solutions
  marketing host, the ReadMe-hosted developer hub, the legacy SoFi Business Banking docs host,
  and the Sandbox hosts named in the SoFi Tech Solutions Environments guide.
description: >-
  SoFi Technologies serves exactly one real /.well-known document across its estate: an RFC 9727
  api-catalog linkset on the SoFi Tech Solutions developer hub (docs.tech.sofi.com), which is how
  the eleven OpenAPI definitions in openapi/ were discovered. Every other canonical path 404s.
  Three paths on docs.tech.sofi.com answer HTTP 200 with the ReadMe single-page-app HTML shell
  (952 KB of markup, not a document) and are recorded as misses, not hits.
notes: >-
  The /pro/.well-known/api-catalog document is not at the RFC 9727 origin-root location - ReadMe
  serves a per-project catalog under the project basepath - but it is a real
  application/linkset+json body naming 101 service-desc entries. It is the highest-value
  discovery document in this repo.
hosts:
  - host: sofi.com
    documents:
      - { path: /.well-known/security.txt, status: 404 }
      - { path: /.well-known/openid-configuration, status: 404 }
      - { path: /.well-known/oauth-authorization-server, status: 404 }
      - { path: /.well-known/api-catalog, status: 404 }
      - { path: /.well-known/ai-plugin.json, status: 404 }
  - host: www.sofi.com
