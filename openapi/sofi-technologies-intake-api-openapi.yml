    post:
      summary: /claim/intake/bulkCreate
      description: 'Use this endpoint to bulk create one or more claims, completing the entire intake flow. This API request is a combination of all the requests for existing intake services all in one call.


        > 📘 Note

        >

        > Only `AuthChargeback` claims are supported at this time'
      operationId: postBulkCreate
      parameters: []
      responses:
        '200':
          description: Successful bulk claim creation request
          content:
            application/json:
              schema:
                type: object
                properties:
                  ClaimList:
                    type: array
                    description: List of claim ids.
                    items:
                      type: object
                      properties:
                        ClaimId:
                          type: string
                          description: ClaimId of bulk created claim
                          example: 2411210115C
                  StatusList:
                    type: array
                    items:
                      type: object
                      properties:
                        Type:
                          type: string
                          description: Status of the request
                          examples:
                          - Success
                          enum:
                          - Error
                          - Success
                        Message:
                          type: string
                          description: Message about the status
                          examples:
                          - Success
                        Code:
                          type: string
                          description: Numeric code for the status
                          examples:
                          - '200'
                  rtoken:
                    type: string
                    nullable: true
                    description: A system-generated ID used for tracking
                  StatusCode:
                    type: integer
                    nullable: true
                    description: The HTTP response status code
              examples:
                successExample:
                  value:
                    StatusList:
                    - StatusList:
                      - Type: Success
                        Message: Success
                        Code: '200'
                    - ClaimList:
                      - ClaimId: 2411210115C
                    rtoken: 984513-395483653-4483483478
                    StatusCode: '200'
                  summary: A sample Bulk Create Claim Success Response
        '400':
          description: Error bulk claim creation request
          content:
            application/json:
              schema:
                type: object
                properties:
                  StatusList:
                    type: array
                    items:
                      type: object
                      properties:
                        Type:
                          type: string
                          description: Status of the request
                          examples:
                          - Success
                          enum:
                          - Error
                          - Success
                        Message:
                          type: string
                          description: Message about the status
                          examples:
                          - Success
                        Code:
                          type: string
                          description: Numeric code for the status
                          examples:
                          - '200'
                  rtoken:
                    type: string
                    nullable: true
                    description: A system-generated ID used for tracking
                  StatusCode:
                    type: integer
                    nullable: true
                    description: The HTTP response status code
              examples:
                error5Example:
                  value:
                    StatusList:
                    - Type: Error
                      Message: 'Invalid Request: {message}'
                      Code: '5'
                    rtoken: 984513-395483653-4483483478
                    StatusCode: '400'
