    post:
      summary: /claim/intake/submit
      description: 'Use this endpoint to submit the claim to be finalized and documentation passed back to the requester.


        > 📘 Note

        >

        > When intaking a case, the final step of the process is the `/claim/intake/submit` endpoint. The only endpoint that can be called immediately after submission is the `/claim/intake/retrieveConfirmation` endpoint. The submission queues up the case for initial automation and there is a slight delay (usually seconds) between submission and when the case is available to perform interaction endpoints. If you intend to perform more activity on the case during the intake process it should be done before the `/claim/intake/submit` endpoint.


        Prerequisite API:

        - `/claim/intake/addQuestionnaire`'
      operationId: postClaimSubmit
      parameters: []
      responses:
        '200':
          description: Successful claim submission request
          content:
            application/json:
              schema:
                type: object
                properties:
                  StatusList:
                    type: array
                    items:
                      type: object
                      properties:
                        Type:
                          type: string
                          description: Status of the request
                          examples:
                          - Success
                          enum:
                          - Error
                          - Success
                        Message:
                          type: string
                          description: Message about the status
                          examples:
                          - Success
                        Code:
                          type: string
                          description: Numeric code for the status
                          examples:
                          - '200'
                  rtoken:
                    type: string
                    nullable: true
                    description: A system-generated ID used for tracking
                  StatusCode:
                    type: integer
                    nullable: true
                    description: The HTTP response status code
              examples:
