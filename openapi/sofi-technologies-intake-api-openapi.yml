  /claim/intake/retrieveTransactions:
    parameters:
    - $ref: '#/components/parameters/AuthorizationHeaderParam'
    - $ref: '#/components/parameters/ProfileTypeHeaderParam'
    post:
      summary: /claim/intake/retrieveTransactions
      description: 'Use this endpoint to retrieve transactions that can be selected to add to the claim. Using the customer ID, account number, and submitted claim reasons to retrieve valid transactions.


        A default date range is built into the dispute system, so most inputs are optional.


        This API can be called multiple times if ad-hoc searching

        is being performed.


        Prerequisite API call:

        - `/claim/intake/addClaimReasons`'
      operationId: postRetrieveTransactions
      parameters: []
      responses:
        '200':
          description: postRetrieveTransactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  TransactionList:
                    type: array
                    items:
                      type: object
                      properties:
                        Amount:
                          type: string
                          description: Amount of transaction
                          examples:
                          - 27.5
                        AmountInfo:
                          type: object
                          properties:
                            Amount:
                              type: string
                              description: Amount of currency
                              example: 27.5
                            Exponent:
                              type: string
                              description: Number of decimal places for currency
                              example: 2
                            ISOCodeAlpha:
                              type: string
                              description: 3 character alpha iso code
                              example: USD
                            ISOCodeNumeric:
                              type: string
                              description: numeric iso code
                              example: 840
                            ISOCurrencyName:
                              type: string
                              description: currency name
                              example: US Dollar
                        AuthorizationStatus:
                          type: string
                          description: Authorization status of the transaction
                          examples:
                          - Posted
                          enum:
                          - Pending
                          - Posted
                        CardNumberEndingIn:
                          type: string
                          description: Last 4 digits of card number
                          examples:
                          - 7413
                        Date:
                          type: string
                          description: Date of transaction in yyyyMMdd formatted string
                          examples:
                          - 20210626
                        DebitCredit:
                          type: string
                          description: Debit or Credit
                          examples:
                          - Debit
                          enum:
                          - Debit
                          - Credit
                        Description:
                          type: string
                          description: Transaction description/Merchant name
                          examples:
                          - 7-ELEVEN 22177 (CHIP)
                        PostingDateTime:
                          type: string
                          description: The posting timestamp  of format  yyyyMMdd'T'HHmmss.SSS z
                          examples:
                          - 20230201T225915.773 GMT
                        SelectMode:
                          type: string
