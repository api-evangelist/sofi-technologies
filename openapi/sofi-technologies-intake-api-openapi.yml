                  ConfirmationHeader:
                    type: string
                    description: Confirmation header
                    examples:
                    - 'Confirmation #: 2108240024C'
                  ConfirmationDocumentName:
                    type: string
                    description: Confirmation document name
                    examples:
                    - Confirmation.pdf
                  StatusList:
                    type: array
                    items:
                      type: object
                      properties:
                        Type:
                          type: string
                          description: Status of the request
                          examples:
                          - Success
                          enum:
