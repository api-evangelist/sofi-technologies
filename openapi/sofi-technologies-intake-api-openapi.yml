      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - transactionId
              - providerId
              properties:
                providerId:
                  type: integer
                  format: int32
                  description: 'Your unique provider identifier from SoFi Tech Solutions.

                    Pattern: Max 10 digits

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
                  maxLength: 60
                  minLength: 1
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction").

                    Pattern: Max 60 characters

                    Example: `"984513-395483653-4483483478"`'
                  example: 984513-395483653-4483483478
                ClaimList:
                  type: array
                  description: List of claim payloads.
                  items:
                    type: object
                    properties:
                      Create:
                        type: object
                        allOf:
                        - type: object
                          required:
                          - CustomerId
                          - AccountNumber
                          properties:
                            CustomerId:
                              type: string
                              description: Unique Customer ID to create the claim for
                              example: 123456789
                            AccountNumber:
                              type: string
                              description: Account number the transaction dispute(s) are to be processed against for the new claim.
                              example: 5555555555554444
                      AddClaimReasons:
                        type: object
                        allOf:
                        - type: object
                          required:
                          - Questionnaire
                          properties:
                            Questionnaire:
                              type: object
                              description: Questionnaire to submit
                              properties:
                                QuestionList:
                                  type: array
                                  description: A list of answers to submit
                                  items:
                                    type: object
                                    properties:
                                      Identifier:
                                        type: string
                                        description: Question identifier
                                        example: ClaimReason
                                      AnswerValue:
                                        type: string
                                        description: User's Answer to this question
                                        example: CardSecure
                      RetrieveTransactions:
                        type: object
                        allOf:
                        - type: object
                          properties:
                            SearchAccountNumber:
                              type: number
                              description: 'Account number for searching for transactions that are on a different account than the claim.


                                **Required** only if the user needs to add transactions to the claim that are on a different account than the claim''s disputed transactions.'
                            SearchStartDate:
                              type: string
                              description: 'Search start date for date range search.


                                **Required** only if the user is searching for transactions within a certain date range


                                Format: yyyyMMdd'
                              example: 20200601
                            SearchEndDate:
                              type: string
                              description: 'Search end date for date range search.


                                **Required** only if the user is searching for transactions within a certain date range


                                Format: yyyyMMdd'
                              example: 20210812
                            SearchAmount:
                              type: string
                              description: 'Transaction amount to search for.


                                **Required** only if the user is searching for a transaction with a specific amount.'
                              example: 2.09
                            SearchMerchantName:
                              type: string
                              description: 'Merchant name/Transaction description to search for.


                                **Required** only if the user is searching for a transaction with a specific merchant'
                              example: Amazon
                      AddTransactions:
                        type: object
                        allOf:
                        - type: object
                          required:
                          - TransactionList
                          properties:
                            TransactionList:
                              type: array
                              description: List of transactions to add to the claim.
                              items:
                                type: object
                                required:
                                - TransactionId
                                properties:
                                  TransactionId:
                                    type: string
                                    description: 'ID for the disputed transaction: `P[prog_id]|[prn]|[auth_id]|[network_code]|[trans_code]` Example: `P111|999123456789|0169|M|AUA`'
                                    examples:
                                    - 460268821703314
                      Submit:
                        type: object
                        allOf:
                        - type: object
                          properties:
                            CorrespondenceDetails:
                              type: object
                              properties:
                                SelectedChannel:
                                  type: string
                                  description: The default customer correspondence channel
                                  example: Email
                                  enum:
                                  - Email
                                  - Mail
                                  - Manual
                                  - Secure
                                EmailAddress:
                                  type: string
                                  description: Customer email address
                                  example: TestCustomer@disputeme.info
                                Address:
                                  type: object
                                  properties:
                                    Line1:
                                      type: string
                                      description: Mailing address line 1
                                      examples:
                                      - 6 Ashbridge Lane
                                    Line2:
                                      type: string
                                      description: Mailing address line 2
                                      examples:
                                      - Suite 1
                                    Line3:
                                      type: string
                                      description: Mailing address line 3
                                      examples:
                                      - Atlanta, GA. 30033
                                    City:
                                      type: string
                                      description: Mailing address City
                                      examples:
                                      - Linwood
                                    State:
                                      type: string
                                      description: Mailing address 2 character State code
                                      examples:
                                      - NJ
                                    Zip:
                                      type: string
                                      description: Mailing address zip code (5 digits or 5-4 digites)
                                      examples:
                                      - 12345-4567
                                    Country:
                                      type: string
                                      description: Mailing address Country code
                                      examples:
                                      - USA
                            Questionnaire:
                              type: object
                              description: Questionnaire to submit
                              properties:
                                QuestionList:
                                  type: array
                                  description: A list of answers to submit
                                  items:
                                    type: object
                                    properties:
                                      Identifier:
                                        type: string
                                        description: Question identifier
                                        example: ClaimReason
                                      AnswerValue:
                                        type: string
                                        description: User's Answer to this question
                                        example: CardSecure
            example:
              ClaimList:
              - Create:
                  AccountNumber: '4447111111117413'
                  CustomerId: '939472005'
                AddClaimReasons:
                  Questionnaire:
                    QuestionList:
                    - AnswerValue: AuthChargeback
                      Identifier: ClaimReasonType
                    - AnswerValue: InPerson
                      Identifier: IntakeChannel
                    - AnswerValue: 'No'
                      Identifier: RespondToFraud
                RetrieveTransactions:
                  SearchAmount: ''
                  SearchEndDate: '20240501'
                  SearchMerchantName: ''
                  SearchStartDate: '20230101'
                AddTransactions:
                  TransactionList:
                  - TransactionId: '17'
                  - TransactionId: '567788988123'
                Submit:
                  CorrespondenceDetails:
                    Address:
                      City: Linwood
                      Country: USA
                      Line1: 6 ashbridge lane
                      Line2: ''
                      Line3: ''
                      State: NJ
                      Zip: 08111
                    EmailAddress: test@gmail.com
                    SelectedChannel: Email
                  Questionnaire:
                    QuestionList:
                    - AnswerValue: 'false'
                      Identifier: WithholdPC
                    - AnswerValue: 'false'
                      Identifier: IsContactDateOverridden
              providerId: 9999
              transactionId: 984513-395483653-4483483478
      tags:
      - Intake
components:
  parameters:
    AuthorizationHeaderParam:
      name: Authorization
      in: header
      description: For `{token}` insert base64-encoded `apiLogin:apiTransKey`
      schema:
        type: string
        default: Basic {token}
    ProfileTypeHeaderParam:
      name: profile-type
      in: header
      description: Optional param to call Dispute API as a customer-service agent or a cardholder
      schema:
        type: string
        enum:
        - agent
        - cardholder
        default: agent
