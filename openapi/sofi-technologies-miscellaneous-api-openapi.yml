                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.361,\n    \"response_data\": {\n        \"request_transaction_id\": \"3542f69d-f950-44b5-8146-68b1f5090d0e\",\n        \"api_calls\": [\n            {\n                \"gal_trans_id\": \"360\",\n                \"result_trans_id\": \"123\",\n                \"status_code\": \"0\",\n                \"in_timestamp\": \"2025-07-15 15:47:24\",\n                \"rtoken\": \"11fb8506-00af-4463-b5ca-367adaad5717\"\n            }\n        ]\n    },\n    \"echo\": {\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": null,\n        \"transaction_id\": \"ca9d046a-f8dd-4230-af0d-3b095ce29830\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n    \"system_timestamp\": \"2025-07-15 15:47:25\"\n}"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" ?>\n<response>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <processing_time>0.364</processing_time>\n  <response_data>\n    <request_transaction_id>ec77f4ed-f83e-40a1-bf6d-5c4948ed83e7</request_transaction_id>\n    <api_calls>\n      <api_call>\n        <gal_trans_id>362</gal_trans_id>\n        <result_trans_id>123</result_trans_id>\n        <status_code>0</status_code>\n        <in_timestamp>2025-07-15 15:47:58</in_timestamp>\n        <rtoken>5c41b108-ac91-49e5-8e38-e5e7f7c6faec</rtoken>\n      </api_call>\n    </api_calls>\n  </response_data>\n  <echo>\n    <provider_transaction_id/>\n    <provider_timestamp/>\n    <transaction_id>5bff3e4a-7030-44c3-9f68-eeab8ac6a4b4</transaction_id>\n  </echo>\n  <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n  <system_timestamp>2025-07-15 15:47:58</system_timestamp>\n</response>"
          description: ''
      description: 'Use the Get Call Status endpoint to retrieve the response code of a specified API call.


        This endpoint will only return data for transactions that are less than 2 days old.'
      requestBody:
        content:
