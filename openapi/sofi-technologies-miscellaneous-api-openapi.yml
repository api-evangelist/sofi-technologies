openapi: 3.2.0
info:
  title: Program Miscellaneous API
  version: '4.0'
servers:
- url: api-{corename}.{env}.gpsrv.com/intserv/4.0/
tags:
- name: Miscellaneous
paths:
  /ping:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      parameters: []
      summary: Ping
      tags:
      - Miscellaneous
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. This endpoint does not return response data, so it will always be empty.
                    type: object
                    properties: {}
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.022,\n    \"response_data\": {},\n    \"echo\": {\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": null,\n        \"transaction_id\": \"A43ZQ5ZMR4XALONBW1G3\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n    \"system_timestamp\": \"2025-07-13 10:48:07\"\n}"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" ?>\n<response>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <processing_time>0.049</processing_time>\n  <response_data/>\n  <echo>\n    <provider_transaction_id/>\n    <provider_timestamp/>\n    <transaction_id>BE8Z7F78YSAS0EA1TBA8</transaction_id>\n  </echo>\n  <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n  <system_timestamp>2025-07-13 12:42:45</system_timestamp>\n</response>"
          description: ''
      description: 'Use the Ping endpoint to test API connectivity and permissions. Ping does not perform any functions on the system. Some use cases for Ping are:

        * Testing access from an automated monitoring service

        * Integrating with an API call to confirm assumptions and validate access'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
              required:
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      operationId: post_ping
  /getPromontoryBankList:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      balance:
                        type: object
                        description: A dictionary with keys being an account number (PRN) and values that are balance data objects
                        additionalProperties:
                          type: array
                          items:
                            description: Balance information
                            type: object
                            properties:
                              balance_date:
                                type: string
                                format: date-time
                                description: Timestamp when the balance was retrieved.
                              bank_name:
                                type: string
                                description: Name of the bank.
                              balance_amount:
                                type: number
                                format: float
                                description: Account balance
                              rate_tier_balance:
                                type: number
                                format: float
                                description: Rate-tier balance
                              accrued_interest:
                                type: number
                                format: float
                                description: Accrued interest amount
                              bank_number:
                                type: integer
                                format: int32
                                description: Bank number
                              rate_record_number:
                                type: integer
                                format: int32
                                description: Rate record number
                            required:
                            - accrued_interest
                            - balance_amount
                            - balance_date
                            - bank_name
                            - bank_number
                            - rate_record_number
                            - rate_tier_balance
                    required:
                    - balance
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.424,\n    \"response_data\": {\n        \"balance\": {\n            \"005461593202\": [\n                {\n                    \"balance_date\": \"2025-07-15 00:00:00\",\n                    \"bank_name\": \"Test Bank 1\",\n                    \"balance_amount\": 1000,\n                    \"rate_tier_balance\": 0,\n                    \"accrued_interest\": 20,\n                    \"bank_number\": 1,\n                    \"rate_record_number\": 1\n                }\n            ],\n            \"005461594202\": [\n                {\n                    \"balance_date\": \"2025-07-15 00:00:00\",\n                    \"bank_name\": \"Test Bank 1\",\n                    \"balance_amount\": 1111,\n                    \"rate_tier_balance\": 0,\n                    \"accrued_interest\": 20,\n                    \"bank_number\": 1,\n                    \"rate_record_number\": 1\n                }\n            ]\n        }\n    },\n    \"echo\": {\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": null,\n        \"transaction_id\": \"30f00606-2104-4b49-9ae1-5e715bd0fec3\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n    \"system_timestamp\": \"2025-07-15 15:55:26\"\n}"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" ?>\n<response>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <processing_time>0.411</processing_time>\n  <response_data>\n    <balance>\n      <n005461595202>\n        <n00546159520>\n          <balance_date>2025-07-15 00:00:00</balance_date>\n          <bank_name>Test Bank 1</bank_name>\n          <balance_amount>1000</balance_amount>\n          <rate_tier_balance>0</rate_tier_balance>\n          <accrued_interest>20</accrued_interest>\n          <bank_number>1</bank_number>\n          <rate_record_number>1</rate_record_number>\n        </n00546159520>\n      </n005461595202>\n      <n005461596202>\n        <n00546159620>\n          <balance_date>2025-07-15 00:00:00</balance_date>\n          <bank_name>Test Bank 1</bank_name>\n          <balance_amount>1111</balance_amount>\n          <rate_tier_balance>0</rate_tier_balance>\n          <accrued_interest>20</accrued_interest>\n          <bank_number>1</bank_number>\n          <rate_record_number>1</rate_record_number>\n        </n00546159620>\n      </n005461596202>\n    </balance>\n  </response_data>\n  <echo>\n    <provider_transaction_id/>\n    <provider_timestamp/>\n    <transaction_id>d70e621a-94ca-4a85-9e77-e68db629bf5d</transaction_id>\n  </echo>\n  <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n  <system_timestamp>2025-07-15 15:56:20</system_timestamp>\n</response>"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                providerId:
                  type: integer
                  format: int32
                  description: 'Your unique provider identifier from SoFi Tech Solutions.

                    Pattern: Max 10 digits

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                accountNo:
                  type: string
                  pattern: ^.+$
                  description: 'The <<glossary:PRN>> or <<glossary:PAN>> of the account.

                    Pattern: PAN or PRN

                    Example: `"074103447228"`'
                  example: 074103447228
                startDate:
                  type:
                  - string
                  - 'null'
                  format: date
                  description: 'The beginning date for the date range, either a date or a date-time.

                    Pattern: YYYY-MM-DD or YYYY-MM-DD hh:mm:ss

                    Example: `"2016-01-01"`'
                  example: '2016-01-01'
                endDate:
                  type:
                  - string
                  - 'null'
                  format: date
                  description: 'The end date for the date range, either a date or a date-time. Must be equal to or later than `startDate`.

                    Pattern: YYYY-MM-DD or YYYY-MM-DD hh:mm:ss

                    Example: `"2016-01-01"`'
                  example: '2016-01-01'
              required:
              - accountNo
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      tags:
      - Miscellaneous
      summary: Get Promontory Bank List
      parameters: []
      description: Use the Get Promontory Bank List endpoint to retrieve a list of Promontory Bank (now IntraFi) balances. This endpoint returns a list of the banks that are included in the deposit sweeps. Omit `startDate` and `endDate` parameters to retrieve a list of the most recent bank balances; otherwise, you receive all bank-balance records within the specified date range.
      operationId: post_getpromontorybanklist
  /getIngoCustomerId:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
