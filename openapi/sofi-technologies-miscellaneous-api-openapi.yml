                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      ingo_sso_token:
                        type: string
                        description: SSO Token used for SDK
                      ingo_customer_id:
                        type: string
                        description: ID for Ingo Money system
                      registered_card:
                        description: Card used to register with the Ingo system
                        type: object
                        properties:
                          status:
                            type: string
                            description: status of card registered on Ingo System
                          card_id:
                            type: integer
                            format: int32
                            description: card_id of card registered on Ingo System
                          card_number:
                            type: string
                            description: Masked card number of card registered on Ingo System
                        required:
                        - card_id
                        - card_number
                        - status
                      ingo_message:
                        type: string
                        description: Additional error messages from Ingo system
                    required:
                    - ingo_customer_id
                    - ingo_message
                    - ingo_sso_token
                    - registered_card
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.022,\n    \"response_data\": {\n        \"ingo_customer_id\": \"xxxxxx\",\n        \"ingo_sso_token\": \"xxxxxxxx\",\n        \"registered_card\": {\n            \"card_number\": \"xxxxxxxxx\",\n            \"card_id\": \"xxxxxxxxx\",\n            \"status\": \"xxxxxxxxx\"\n        }\n    },\n    \"echo\": {\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": null,\n        \"transaction_id\": \"5ZMBW1G3R4ZQONAXAL34\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n    \"system_timestamp\": \"2025-07-14 10:45:17\"\n}"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<response>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <system_timestamp>2025-07-14 10:45:17</system_timestamp>\n  <response_data>\n    <ingo_customer_id>xxxxxx</ingo_customer_id>\n    <ingo_sso_token>xxxxxxxx</ingo_sso_token>\n    <registered_card>\n      <card_number>xxxxxxxxx</card_number>\n      <card_id>xxxxxxxxx</card_id>\n      <status>xxxxxxxxx</status>\n    </registered_card>\n  </response_data>\n  <processing_time>0.407</processing_time>\n  <echo>\n    <transaction_id>QBW3R4ZM34NA1GLOXA5Z</transaction_id>\n    <provider_transaction_id/>\n    <provider_timestamp/>\n  </echo>\n  <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n</response>"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                providerId:
                  type: integer
                  format: int32
                  description: 'Your unique provider identifier from SoFi Tech Solutions.

                    Pattern: Max 10 digits

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                accountNo:
                  type: string
                  pattern: ^$|^([0-9]{12}|[0-9]{16})$
                  description: "The <<glossary:PRN>> or <<glossary:PAN>> of the account.\nPattern: PAN or PRN \nExample: `\"074103447228\"`"
                  example: 074103447228
                mobileDeviceId:
                  type: string
                  minimum: 1
                  maximum: 255
                  description: 'Unique identifier for a cardholder''s device using the Ingo SDK. For mobile apps.

                    Pattern: 1&ndash;255 characters

                    Example: `"123456789009876"`'
                  example: '123456789009876'
              required:
              - accountNo
              - mobileDeviceId
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      tags:
      - Miscellaneous
      summary: Get Ingo Customer ID
      parameters: []
      description: Use the Get Ingo Customer ID to retrieve customer identity information from third-party provider Ingo Money. Use the Ingo customer ID as needed.
      operationId: post_getingocustomerid
  /getCallStatus:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      parameters: []
      summary: Get Call Status
      tags:
      - Miscellaneous
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      request_transaction_id:
                        type: string
                        description: The transaction_id of the original request
                      api_calls:
                        type: array
                        description: List of API calls
                        items:
                          type: object
                          properties:
                            gal_trans_id:
                              type: string
                              description: An ID used for internal tracking of the transaction
                            result_trans_id:
                              type:
                              - string
                              - 'null'
                              description: An ID used for internal tracking of the transaction
                            status_code:
                              type:
                              - string
                              - 'null'
                              description: The status of the original request
                            in_timestamp:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: The datetime the original request
                            rtoken:
                              type:
                              - string
                              - 'null'
                              description: An ID used for internal tracking of the transaction
                          required:
                          - gal_trans_id
                          - in_timestamp
                          - result_trans_id
                          - rtoken
                          - status_code
                    required:
