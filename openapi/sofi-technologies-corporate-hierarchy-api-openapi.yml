                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                providerId:
                  type: integer
                  format: int32
                  description: 'Your unique provider identifier from SoFi Tech Solutions.

                    Pattern: Max 10 digits

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                page:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  minimum: 1
                  maximum: 999999
                  description: 'The number of the page to retrieve.

                    Pattern: Integer value of `1` or greater

                    Example: `3`'
                  example: 3
                recordCnt:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 99999
                  description: 'The maximum number of records per page to be returned.

                    Pattern: Positive integer `1-99999`

                    Example: `100`'
                  example: 100
              required:
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      summary: Get Root Groups
      description: Use the Get Root Groups endpoint to retrieve all of the root groups within a core. See Creating a Corporate Hierarchy for instructions on using this endpoint.
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      root_groups:
                        type:
                        - array
                        - 'null'
                        description: List of root groups
                        items:
                          type: object
                          properties:
                            group_id:
                              type: string
                              description: Identifier for the group
                            parent_group_id:
                              type:
                              - string
                              - 'null'
                              description: Identifier for the parent group
                            business_legal_name:
                              type:
                              - string
                              - 'null'
                              description: Legal name of the business
                            doing_business_as:
                              type:
                              - string
                              - 'null'
                              description: Operating name of the business, if different from `business_legal_name`.
                            external_id:
                              type:
                              - string
                              - 'null'
                              description: User-provided ID
                            group_name:
                              type:
                              - string
                              - 'null'
                              description: Name of the group
                            smartdata:
                              type:
                              - string
                              - 'null'
                              description: Whether the root group supports Mastercard Smart Data.
                            max_level:
                              type:
                              - integer
                              - 'null'
                              format: int32
                              description: Maximum number of levels allowed below the root group
                            phone:
                              type:
                              - string
                              - 'null'
                              description: Business phone number
                            primary_contact_email:
                              type:
                              - string
                              - 'null'
                              description: Email of the primary contact at the business.
                            primary_contact_name:
                              type:
                              - string
                              - 'null'
                              description: Name of the primary contact.
                            change_ts:
                              type:
                              - string
                              - 'null'
                              description: Time when the last change was made.
                            phone_country_code:
