openapi: 3.2.0
info:
  title: Program Corporate Hierarchy API
  version: '4.0'
servers:
- url: api-{corename}.{env}.gpsrv.com/intserv/4.0/
tags:
- name: Corporate Hierarchy
paths:
  /createGroup:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      tags:
      - Corporate Hierarchy
      parameters: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                providerId:
                  type: integer
                  format: int32
                  description: 'Your unique provider identifier from SoFi Tech Solutions.

                    Pattern: Max 10 digits

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                groupName:
                  type: string
                  minLength: 1
                  maxLength: 40
                  description: "Name of the group. \nPattern: 1–40 alphanumeric characters, including spaces, hyphens, and single quotes\nExample: `\"CDE Corp\"`"
                  example: CDE Corp
                parentGroupId:
                  type: string
                  minLength: 1
                  maxLength: 10
                  pattern: ^[\d]+$
                  description: 'The identifier of the next group up in the hierarchy. **Required** when creating a non-root group; not valid when `maxLevel` is populated. This value cannot be changed after it is set

                    .Pattern: Max 10 numeric characters

                    Example: `"456"`'
                  example: '456'
                maxLevel:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  minimum: 1
                  maximum: 5
                  description: 'Maximum number of subgroup levels that can be created below this root group. **Required** when creating a root group. Not valid when `parentGroupId` is populated. This value cannot be changed to a smaller number after it is set.

                    Pattern: Numerals 0–5

                    Example: `3`'
                  example: '5'
                externalId:
                  type:
                  - string
                  - 'null'
                  maxLength: 30
                  pattern: ^[\w\s]+$
                  description: "Provider-specified identifier for the group. \nPattern: Max 30 alphanumeric characters\nExample: `\"L0000\"`"
                  example: L0000
                doingBusinessAs:
                  type:
                  - string
                  - 'null'
                  minLength: 2
                  maxLength: 150
                  description: 'Operating name of the company, if different from `businessLegalName`.

                    Pattern: 2–150 alphanumeric characters, as shown in <a href="ref:api-reference-special-characters#businessname-parameter" target="_blank">`businessName` parameter</a>

                    Example: `"SportsBall Enterprises"`'
                  example: SportsBall Enterprises
                businessLegalName:
                  type:
                  - string
                  - 'null'
                  minLength: 2
                  maxLength: 150
                  description: 'Legal name of the business.

                    Pattern: 2–150 alphanumeric characters, as shown in <a href="ref:api-reference-special-characters#businessname-parameter" target="_blank">`businessName` parameter</a>

                    Example: `"CDE Corporation, Inc."`'
                  example: CDE Corporation, Inc.
                phoneCountryCode:
                  type:
                  - string
                  - 'null'
                  minimum: 2
                  maximum: 4
                  pattern: ^\+[0-9]*$
                  description: 'Country code prefix for `phone`. If this parameter is populated, then `phone` is **required**.

                    Pattern: Plus sign (`+`) with 1–3 digits

                    Example: `"+011"`'
                  example: '+011'
                phone:
                  type:
                  - string
                  - 'null'
                  description: 'Phone number for the `primaryContactName`. If this parameter is populated, then `phoneCountryCode` is **required**.

                    Pattern: Phone number for the `primaryContactName`.

                    Example: `"18015551456"`'
                  example: '18015551456'
                primaryContactName:
                  type:
                  - string
                  - 'null'
                  minLength: 2
                  maxLength: 150
                  description: "The name of the primary point of contact at `businessLegalName`.\n Pattern: 2–150 Latin-9 characters\nExample: `\"Maxina Seward\"`"
                  example: Maxina Seward
                primaryContactEmail:
                  type:
                  - string
                  - 'null'
                  description: 'Email address of `primaryContactName`.

                    Pattern: Email address, 3–63 characters

                    Example: `"mseward@cde-corp.com"`'
                  example: mseward@cde-corp.com
                smartdata:
                  type:
                  - string
                  - 'null'
                  enum:
                  - Y
                  - N
                  description: "Specifies whether the root group is to be enrolled in <a href=\"doc:business-banking-enhancements#mastercard-smart-data\" target=\"_blank\">Mastercard Smart Data</a>.\nPattern: String \nExample: `\"Y\"`"
                  example: Y
                employerId:
                  type:
                  - string
                  - 'null'
                  pattern: ^\d{2}-?\d{7}$
                  description: 'The employer identification number (EIN) from the IRS.

                    Pattern: 99-9999999.

                    Example: `"12-3456789"`'
                  example: 12-3456789
              required:
              - groupName
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      summary: Create Group
      description: 'Use the Create Group endpoint to create a root group or a non-root group. When creating a root group, populate these parameters to create the business profile:

        - `businessLegalName`

        - `doingBusinessAs`

        - `phoneCountryCode`

        - `phone`

        - `primaryContactEmail`

        - `primaryContactName`


        When creating a non-root group, you can populate the business-profile parameters as desired. All of the name parameters support the Latin-9 (ISO-8859-15) character set. See Creating a Corporate Hierarchy for instructions on using this endpoint.'
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      group_id:
                        type: string
                        description: Identifier for the group
                      group_name:
                        type: string
                        description: Name of the group
                      parent_group_id:
                        type:
                        - string
                        - 'null'
                        description: Identifier for the parent group
                      max_level:
                        type:
                        - integer
                        - 'null'
                        format: int32
                        description: Maximum number of levels allowed below the root group
                      external_id:
                        type:
                        - string
                        - 'null'
                        description: User-provided ID
                      doing_business_as:
                        type:
                        - string
                        - 'null'
                        description: Operating name of the business, if different from `business_legal_name`
                      business_legal_name:
                        type:
                        - string
                        - 'null'
                        description: Legal name of the business
                      phone:
                        type:
                        - string
                        - 'null'
                        description: Business phone number
                      primary_contact_name:
                        type:
                        - string
                        - 'null'
                        description: Name of the primary contact
                      primary_contact_email:
                        type:
                        - string
                        - 'null'
                        description: Email of the primary contact at the business
                      smartdata:
                        type:
                        - string
                        - 'null'
                        description: Whether the root group supports <a href="doc:business-banking-enhancements#mastercard-smart-data" target="_blank">Mastercard Smart Data</a>.
                      change_ts:
                        type:
                        - string
                        - 'null'
                        description: Timestamp for the last update to the group.
                      phone_country_code:
                        type:
                        - string
                        - 'null'
                        description: Country code for the phone numbers.
                      employer_id:
                        type:
                        - string
                        - 'null'
                        description: Employer identification number (EIN)
                    required:
                    - business_legal_name
                    - change_ts
                    - doing_business_as
                    - external_id
                    - group_id
                    - group_name
                    - max_level
                    - parent_group_id
                    - phone
                    - phone_country_code
                    - primary_contact_email
                    - primary_contact_name
                    - smartdata
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.746,\n    \"response_data\":\n    {\n      \"group_id\": \"0\",\n      \"parent_group_id\": null,\n      \"group_name\": \"CDE Corp\",\n      \"external_id\": \"L0000\",\n      \"max_level\": 3,\n      \"business_legal_name\": \"CDE Corporation, Inc.\",\n      \"doing_business_as\": \"SportsBall Enterprises\",\n      \"phone_country_code\": \"+011\",\n      \"phone\": \"18015551456\",\n      \"primary_contact_email\": \"mseward@cde-corp.com\",\n      \"primary_contact_name\": \"Maxina Seward\",\n      \"smartdata\": \"Y\"\n   },\n\"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n\"system_timestamp\": \"2025-08-13 10:36:54\"\n}\n"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" ?>\n<response>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <processing_time>0.746</processing_time>\n  <response_data>\n    <group_id>0</group_id>\n    <parent_group_id/>\n    <group_name>CDE Corp</group_name>\n    <external_id>L0000</external_id>\n    <max_level>3</max_level>\n    <business_legal_name>CDE Corporation, Inc.</business_legal_name>\n    <doing_business_as>SportsBall Enterprises</doing_business_as>\n    <phone_country_code>+011</phone_country_code>\n    <phone>18015551456</phone>\n    <primary_contact_email>mseward@cde-corp.com</primary_contact_email>\n    <primary_contact_name>Maxina Seward</primary_contact_name>\n    <smartdata>Y</smartdata>\n  </response_data>\n  <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n  <system_timestamp>2025-08-13 10:36:54</system_timestamp>\n</response>"
          description: ''
      operationId: post_creategroup
  /updateGroup:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      tags:
      - Corporate Hierarchy
      parameters: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                providerId:
                  type: integer
                  format: int32
                  description: 'Your unique provider identifier from SoFi Tech Solutions.

                    Pattern: Max 10 digits

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                groupId:
                  type: string
                  minLength: 1
                  maxLength: 10
                  pattern: ^[\d]+$
                  description: 'Identifier of the group (`group_id`) as returned by the <a href="ref:post_creategroup" target="_blank">Create Group</a> endpoint.

                    Pattern: Max 10 numeric characters

                    Example: `"4522"`'
                  example: '123'
                groupName:
                  type: string
                  minLength: 1
                  maxLength: 40
                  description: "Name of the group. \nPattern: 1–40 alphanumeric characters, including spaces, hyphens, and single quotes\nExample: `\"CDE Corp\"`"
                  example: CDE Corp
                maxLevel:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  minimum: 1
                  maximum: 5
                  description: 'Maximum number of subgroup levels that can be created below this root group. **Required** when creating a root group. Not valid when `parentGroupId` is populated. This value cannot be changed to a smaller number after it is set.

                    Pattern: Numerals 0–5

                    Example: `3`'
                  example: '5'
                externalId:
                  type:
                  - string
                  - 'null'
                  maxLength: 30
                  pattern: ^[\w\s]+$
                  description: "Provider-specified identifier for the group. \nPattern: Max 30 alphanumeric characters\nExample: `\"L0000\"`"
                  example: L0000
                doingBusinessAs:
                  type:
                  - string
                  - 'null'
                  minLength: 2
                  maxLength: 150
                  description: 'Operating name of the company, if different from `businessLegalName`.

                    Pattern: 2–150 alphanumeric characters, as shown in <a href="ref:api-reference-special-characters#businessname-parameter" target="_blank">`businessName` parameter</a>

                    Example: `"SportsBall Enterprises"`'
                  example: SportsBall Enterprises
                businessLegalName:
                  type:
                  - string
                  - 'null'
                  minLength: 2
                  maxLength: 150
                  description: 'Legal name of the business.

                    Pattern: 2–150 alphanumeric characters, as shown in <a href="ref:api-reference-special-characters#businessname-parameter" target="_blank">`businessName` parameter</a>

                    Example: `"CDE Corporation, Inc."`'
                  example: CDE Corporation, Inc.
                phoneCountryCode:
                  type:
                  - string
                  - 'null'
                  minimum: 2
                  maximum: 4
                  pattern: ^\+[0-9]*$
                  description: 'Country code prefix for `phone`. If this parameter is populated, then `phone` is **required**.

                    Pattern: Plus sign (`+`) with 1–3 digits

                    Example: `"+011"`'
                  example: '+011'
                phone:
                  type:
                  - string
                  - 'null'
                  description: 'Phone number for the `primaryContactName`. If this parameter is populated, then `phoneCountryCode` is **required**.

                    Pattern: Phone number for the `primaryContactName`.

                    Example: `"18015551456"`'
                  example: '18015551456'
                primaryContactName:
                  type:
                  - string
                  - 'null'
                  minLength: 2
                  maxLength: 150
                  description: "The name of the primary point of contact at `businessLegalName`.\n Pattern: 2–150 Latin-9 characters\nExample: `\"Maxina Seward\"`"
                  example: Maxina Seward
                primaryContactEmail:
                  type:
                  - string
                  - 'null'
                  description: 'Email address of `primaryContactName`.

                    Pattern: Email address, 3–63 characters

                    Example: `"mseward@cde-corp.com"`'
                  example: mseward@cde-corp.com
                smartdata:
                  type:
                  - string
                  - 'null'
                  enum:
                  - Y
                  - N
                  description: "Specifies whether the root group is to be enrolled in <a href=\"doc:business-banking-enhancements#mastercard-smart-data\" target=\"_blank\">Mastercard Smart Data</a>.\nPattern: String \nExample: `\"Y\"`"
                  example: Y
                employerId:
                  type:
                  - string
                  - 'null'
                  pattern: ^\d{2}-?\d{7}$
                  description: 'The employer identification number (EIN) from the IRS.

                    Pattern: 99-9999999.

                    Example: `"12-3456789"`'
                  example: 12-3456789
              required:
              - groupId
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      summary: Update Group
      description: Use the Update Group endpoint to update an existing group, either a root group or a non-root group. Pass only the parameter(s) to update. All of the name parameters support the Latin-9 (ISO-8859-15) character set. You cannot change the parent ID of a group. See Creating a Corporate Hierarchy for instructions on using this endpoint.
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. This endpoint does not return response data, so it will always be empty.
                    type: object
                    properties: {}
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.746,\n    \"response_data\": {},\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n   \"system_timestamp\": \"2025-08-13 10:36:54\"\n}"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" ?>\n<response>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <processing_time>0.746</processing_time>\n  <response_data/>\n  <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n  <system_timestamp>2025-08-13 10:36:54</system_timestamp>\n</response>"
          description: ''
      operationId: post_updategroup
  /getRootGroups:
    parameters:
