                    Example: `"84121"`'
                  example: '84121'
                location:
                  type: string
                  minLength: 1
                  maxLength: 15
                  pattern: ^[a-zA-Z0-9]{1,15}$
                  description: 'Location identifier as returned by <a href="ref:post_createlocation" target="_blank">Create Location</a> (`location`) or <a href="ref:post_getlocations" target="_blank">Get Locations</a> (`location_id` or `provider_specified_id`).

                    Pattern: Integer if `location` or `location_id`; max 15 characters if `provider_specified_id`

