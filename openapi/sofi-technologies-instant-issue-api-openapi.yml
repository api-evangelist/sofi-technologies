                  example: 1000
                embossWith:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 20
                  pattern: ^[a-zA-Z0-9_\s]{1,20}$
                  description: 'Optional string to be printed on the first emboss line of the cards.

                    Pattern: Max 20 alphanumeric characters

                    Example: `"Bob''s cards"`'
                  example: Bob's cards
                shipToName:
                  type: string
                  minimum: 1
                  maximum: 40
                  description: 'In-care-of name for the address where the bulk card order is to be shipped.

                    Pattern: Max 40 alphanumeric characters

                    Example: `"c"`'
                  example: Bob's cards
                shipToAddress:
                  type: string
                  description: 'Street address where the bulk order is to be shipped.

                    Pattern: Max 40 alphanumeric characters

                    Example: `"33 Maple Street"`'
                  example: 33 Maple Street
