openapi: 3.2.0
info:
  title: Program Instant Issue API
  version: '4.0'
servers:
- url: api-{corename}.{env}.gpsrv.com/intserv/4.0/
tags:
- name: Instant Issue
paths:
  /voidCreateAccount:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      tags:
      - Instant Issue
      parameters: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                providerId:
                  type: integer
                  format: int32
                  description: 'Your unique provider identifier from SoFi Tech Solutions.

                    Pattern: Max 10 digits

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                accountNo:
                  type:
                  - string
                  - 'null'
                  pattern: ^$|^([0-9]{12}|[0-9]{16})$
                  description: 'The <<glossary:PRN>> or <<glossary:PAN>> of the account.

                    Pattern: PRN or PAN

                    Example: `"074103447228"`'
                  example: 074103447228
                type:
                  type: string
                  enum:
                  - '1'
                  - '2'
                  - 1
                  - 2
                  description: 'Type of void being performed:

                    * `"1"` &mdash; Cancel account

                    * `"2"` &mdash; Reset account (for instant issue)


                    Pattern: String

                    Example: `"1"`'
                  example: '1'
                verifyOnly:
                  type: boolean
                  default: false
                  description: 'Pass `1` to test the validity of the parameter data without committing the information to the system.

                    Pattern: Integer

                    Example: `0`'
                  example: '0'
              required:
              - transactionId
              - type
              - apiLogin
              - apiTransKey
              - providerId
      summary: Void Create Account
      description: 'Use the Void Create Account endpoint to cancel an account (move the account into `status: B`, Voided account) that was created by Create Account. Pass either the `transactionId` of the original Create Account call or the optional `accountNo` parameter to identify and void the created account. The `accountNo` parameter can be the PRN that was returned by Create Account or a PAN that you can retrieve using Get Account Cards.


        > 📘 Note

        >

        > Use Void Create Account only for instant-issue (prepaid) card accounts. To reverse an account creation for other account types, use the >.'
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. This endpoint does not return response data, so it will always be empty.
                    type: object
                    properties: {}
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.0078,\n    \"response_data\": {},\n    \"echo\": {\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": null,\n        \"transaction_id\": \"OOSQCGXU0NUE6AIPQ3OA\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n    \"system_timestamp\": \"2025-07-13 10:42:56\"\n}\n"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<response>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <system_timestamp>2011-01-31 13:37:18</system_timestamp>\n  <response_data/>\n  <processing_time>1.755</processing_time>\n  <echo>\n    <transaction_id>12345a</transaction_id>\n    <provider_transaction_id>77bb</provider_transaction_id>\n    <provider_timestamp>2025-02-06 10:10:10</provider_timestamp>\n  </echo>\n  <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n</response>"
          description: ''
      operationId: post_voidcreateaccount
  /verifyInstantIssueCard:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      summary: Verify Instant-Issue Card
      description: 'Use the Verify Instant-Issue Card endpoint to retrieve data related to the specified instant-issue card. Consult the Instant-Issue Cards guide for instructions on using this endpoint.


        [block:callout]


        {

        "type": "info",

        "title": "Note",

        "body": "You can receive PCI-sensitive information only if your provider parameters permit it."

        }

        [/block]'
      parameters: []
      tags:
      - Instant Issue
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>.. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                accountNo:
                  type: string
                  pattern: ^$|^([0-9]{12}|[0-9]{15}|[0-9]{16})$
                  description: 'The <<glossary:PRN>> or <<glossary:PAN>> of the account.

                    Pattern: PAN or PRN

                    Example: `"074103447228"`'
                  example: 074103447228
                prodId:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  minimum: 0
                  description: 'A unique product identifier from SoFi Tech Solutions.

                    Pattern: Integer

                    Example: `501`'
                  example: 501
                loadType:
                  type:
                  - string
                  - 'null'
                  pattern: ^[a-zA-Z0-9]{1,2}$
                  description: 'Transaction type for the `loadAmount`. Use values from your list of load types from SoFi Tech Solutions. If no `loadType` is specified, the default type `RL` is used.

                    Pattern: 2 characters

                    Example: `"RL"`'
                  example: RL
              required:
              - accountNo
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      status:
                        type: string
                        description: See <a href="ref:api-reference-instant-issue-card-statuses" target="_blank">Instant Issue Card Statuses</a> for valid values.
                      pmt_ref_no:
                        type: string
                        description: System-generated account number. Also called the <<glossary:PRN>>.
                      prod_id:
                        type: string
                        description: Identifier for the product associated with the card order
                      max_load_amount:
                        type: string
                        description: The maximum amount that can be loaded on a card
                      card_id:
                        type: string
                        description: System-generated card identifier (CAD). Use this ID instead of the <<glossary:PAN>> if not PCI-compliant. `None` means that no card was created.
                      card_number:
                        type: string
                        description: The card number, also called the <<glossary:PAN>>. This value is masked unless you are PCI compliant and CINFI is set.
                      expiry_date:
                        type:
                        - string
                        - 'null'
                        format: date
                        description: Expiration date of the card
                      card_security_code:
                        type:
                        - string
                        - 'null'
                        description: The card verification value (CVV2).
                      batch_id:
                        type:
                        - string
                        - 'null'
                        description: The ID of the batch number.
                      case_id:
                        type:
                        - string
                        - 'null'
                        description: Physical cards are shipped in bundles, which are divided by boxes. A `case_id` is a tracking number on each box and bundle.
                      box_id:
                        type:
                        - string
                        - 'null'
                        description: A shipping tracking number on a box of shipped cards
                      bundle_id:
                        type:
                        - string
                        - 'null'
                        description: A shipping tracking number on the bundle of shipped cards
                      galileo_location_id:
                        type:
                        - string
                        - 'null'
                        description: A code for the location at which account was created, if applicable. Can be provided by client or SoFi Tech Solutions
                      partner_location_id:
                        type:
                        - string
                        - 'null'
                        description: A code for the partner location
                    required:
                    - batch_id
                    - box_id
                    - bundle_id
                    - card_id
                    - card_number
                    - card_security_code
                    - case_id
                    - expiry_date
                    - galileo_location_id
                    - max_load_amount
                    - partner_location_id
                    - pmt_ref_no
                    - prod_id
                    - status
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.409,\n    \"response_data\": {\n        \"status\": \"P\",\n        \"pmt_ref_no\": \"005461567202\",\n        \"prod_id\": \"11982\",\n        \"max_load_amount\": \"1000000\",\n        \"card_id\": \"14861240\",\n        \"card_number\": \"527734XXXXXX8179\",\n        \"expiry_date\": null,\n        \"card_security_code\": null,\n        \"batch_id\": \"test_p2p_verify_inst\",\n        \"case_id\": 26,\n        \"box_id\": 65,\n        \"bundle_id\": 43,\n        \"galileo_location_id\": \"4400091\",\n        \"partner_location_id\": \"SHIPTOCODE\"\n    },\n    \"echo\": {\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": null,\n        \"transaction_id\": \"ef1c62e1-0af9-441f-a6f4-a7576e737080\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n    \"system_timestamp\": \"2025-07-15 15:10:14\"\n}"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" ?>\n<response>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <processing_time>0.024</processing_time>\n  <response_data>\n    <status>P</status>\n    <pmt_ref_no>005461567202</pmt_ref_no>\n    <prod_id>11982</prod_id>\n    <max_load_amount>1000000</max_load_amount>\n    <card_id>14861240</card_id>\n    <card_number>527734XXXXXX8179</card_number>\n    <expiry_date/>\n    <card_security_code/>\n    <batch_id>test_p2p_verify_inst</batch_id>\n    <case_id>26</case_id>\n    <box_id>65</box_id>\n    <bundle_id>43</bundle_id>\n    <galileo_location_id>4400091</galileo_location_id>\n    <partner_location_id>SHIPTOCODE</partner_location_id>\n  </response_data>\n  <echo>\n    <provider_transaction_id/>\n    <provider_timestamp/>\n    <transaction_id>6d6c3d39-f601-4c7e-87c4-1d0b4f2a5ef2</transaction_id>\n  </echo>\n  <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n  <system_timestamp>2025-07-15 15:10:15</system_timestamp>\n</response>"
          description: ''
      operationId: post_verifyinstantissuecard
  /moveCard:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      summary: Move Card
      description: Use the Move Card endpoint to move the specified instant-issue card to a different location.
      parameters: []
      tags:
      - Instant Issue
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>.. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                accountNo:
                  type: string
                  pattern: ^.+$
                  description: 'The <<glossary:PRN>>, <<glossary:PAN>> or <<glossary:CAD>> of the account. For card-specific endpoints such as this one, the CAD is preferred. Do not use the PRN if more than one card has ever been associated with this account.

                    Pattern: PAN, PRN, or CAD

                    Example: `"074103447228"`'
                  example: 074103447228
                moveToLocation:
                  type: string
                  pattern: ^[a-zA-Z0-9]{1,20}$
                  description: 'Identifier for the new location (`location`) as returned by the <a href="ref:post_createlocation" target="_blank">Create Location</a> endpoint. This value is also returned by the <a href="ref:post_getlocations" target="_blank">Get Locations</a> endpoint depending on the value of `locationType` when the location was created:

                    * `0` &mdash; Returned in the `location_id` field

                    * `1` &mdash; Returned in the `provider_specified_id` field


                    Pattern: Integer if `moveToLocationType: 0`; max 15 characters if `moveToLocationType: 1`

                    Example: `"3"`'
                  example: '3'
                moveToLocationType:
                  type: integer
                  format: int32
                  enum:
                  - 0
                  - 1
                  description: 'Type of location in `moveToLocation`:

                    * `0` &mdash; SoFi Tech Solutions location ID

                    * `1` &mdash; Provider location ID


                    Pattern: Integer

                    Example: `0`'
                  example: 0
              required:
              - accountNo
              - moveToLocation
              - moveToLocationType
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. This endpoint does not return response data, so it will always be empty.
                    type: object
                    properties: {}
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.378,\n    \"response_data\": {},\n    \"echo\": {\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": null,\n        \"transaction_id\": \"0d79c13e-0057-415c-9402-c988b833183d\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n    \"system_timestamp\": \"2025-07-15 14:59:16\"\n}"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" ?>\n<response>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <processing_time>0.037</processing_time>\n  <response_data/>\n  <echo>\n    <provider_transaction_id/>\n    <provider_timestamp/>\n    <transaction_id>77f9da50-310f-41d4-837a-b25b187b9796</transaction_id>\n  </echo>\n  <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n  <system_timestamp>2025-07-15 14:59:17</system_timestamp>\n</response>"
          description: ''
      operationId: post_movecard
  /getBulkCardOrder:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      summary: Get Bulk Card Order
      description: Use Get Bulk Card Order to retrieve the details of an existing bulk card order that was created with the Create Bulk Card Order endpoint. Consult the Instant-Issue Cards guide for instructions on using this endpoint.
      parameters: []
      tags:
      - Instant Issue
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>.. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                orderId:
                  type: integer
                  format: int32
                  description: 'The order ID (`order_id`) as returned by the <a href="ref:post_createbulkcardorder" target="_blank">Create Bulk Card Order</a> endpoint.

                    Pattern: Positive integer

                    Example: `5068`'
                  example: 5068
                returnAllCards:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  enum:
                  - 0
                  - 1
                  description: 'Specifies whether to return a list of all cards in the order, in the `cards` object:

                    * `0` &mdash; Do not return cards

                    * `1` &mdash; Return all cards


                    Pattern: Integer

                    Example: `0`'
                  example: 0
              required:
              - orderId
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      status:
                        type: string
                        description: 'Status of the card order: `P` &mdash; Processed; `E` &mdash; Error'
                      prod_id:
                        type:
                        - string
                        - 'null'
                        description: Identifier for the product associated with the card order
                      order_id:
                        type: string
                        description: Identifier for the card order
                      number_of_cards:
                        type: integer
                        format: int32
                        description: Number of cards in the order
                      emboss_with:
                        type:
                        - string
                        - 'null'
                        description: First line to be embossed on cards
                      ship_to_name:
                        type:
                        - string
                        - 'null'
