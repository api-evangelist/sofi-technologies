      description: 'Use the Get Pending Deposits endpoint to retrieve a list of incoming ACH credits that are pending manual review. Populate `accountNo` to retrieve the pending credits for a specified account or leave `accountNo` blank to retrieve all pending credits for your program. You can approve or reject these transactions using the > or the Modify Pending Deposit Status endpoint. Incoming ACH credits are placed into this queue based on the operation fraud settings for your program.


        See Record-Set Pagination for instructions on using the paging parameters.'
      operationId: post_getpendingdeposits
  /expireAuthorization:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      description: 'Use the Expire Authorization endpoint to expire a pending authorization and return the hold amount to the cardholder account. The authorization must be eligible for expiry. Check for one of the following:

        - `can_be_expired: 1` — Get Authorization History response

        - `AUTHORIZATION STATUS` — Authorized Transactions RDF; status `A` or `C`


        This endpoint expires the authorization in the system; the expiry is not communicated to the card network.'
