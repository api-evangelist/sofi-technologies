ll,\n                \"merchant_id\": \"\",\n                \"formatted_merchant_desc\": \"\",\n                \"terminal_id\": \"\",\n                \"card_id\": \"0\",\n                \"iac_tax\": \"0\",\n                \"iva_tax\": \"0\"\n            },\n            {\n                \"pmt_ref_no\": \"001108537430\",\n                \"act_id\": \"122876046\",\n                \"act_type\": \"PM\",\n                \"mcc\": \"534882\",\n                \"post_ts\": \"2025-01-17 09:09:16\",\n                \"amt\": \"100\",\n                \"details\": \"Retail Load\",\n                \"description\": \"Payment\",\n                \"source_id\": \"3792011\",\n                \"bal_id\": \"425782\",\n                \"prod_id\": \"1067\",\n                \"auth_ts\": \"2025-01-17 09:09:16\",\n                \"trans_code\": \"PMRL\",\n                \"ach_transaction_id\": null,\n                \"external_trans_id\": \"T6NJAH3TV5SL2UXHSSO7\",\n                \"original_auth_id\": \"0\",\n                \"network_code\": \"?\",\n                \"local_amt\": null,\n                \"local_curr_code\": null,\n                \"settle_amt\": null,\n                \"settle_curr_code\": null,\n                \"billing_amt\": null,\n                \"billing_curr_code\": null,\n                \"merchant_id\": \"\",\n                \"formatted_merchant_desc\": \"\",\n                \"terminal_id\": \"\",\n                \"card_id\": null,\n                \"iac_tax\": \"0\",\n                \"iva_tax\": \"4567.9876\"\n            }\n        ]\n    },\n    \"echo\": {\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": null,\n        \"transaction_id\": \"PA11CRHVK1ILQWK3WSN6\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n    \"system_timestamp\": \"2025-07-13 10:32:15\"\n}"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" ?>\n<response>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <processing_time>0.075</processing_time>\n  <response_data>\n    <start_date>2025-12-01 00:00:00</start_date>\n    <end_date>2025-07-13 23:59:59</end_date>\n    <number_of_pages>1</number_of_pages>\n    <page>1</page>\n    <total_record_count>3</total_record_count>\n    <transaction_count>3</transaction_count>\n    <transactions>\n      <transaction>\n        <pmt_ref_no>001108537430</pmt_ref_no>\n        <act_id>122876373</act_id>\n        <act_type>AD</act_type>\n        <mcc>534882</mcc>\n        <post_ts>2025-01-17 09:49:16</post_ts>\n        <amt>-5</amt>\n        <details>test adj</details>\n        <description>Adjustment</description>\n        <source_id>52619</source_id>\n        <bal_id>425782</bal_id>\n        <prod_id>1067</prod_id>\n        <auth_ts>2025-01-17 09:49:16</auth_ts>\n        <trans_code>ADF</trans_code>\n        <ach_transaction_id/>\n        <external_trans_id>76852773</external_trans_id>\n        <original_auth_id>0</original_auth_id>\n        <network_code>?</network_code>\n        <local_amt/>\n        <local_curr_code/>\n        <settle_amt/>\n        <settle_curr_code/>\n        <billing_amt/>\n        <billing_curr_code/>\n        <merchant_id/>\n        <formatted_merchant_desc/>\n        <terminal_id/>\n        <card_id>0</card_id>\n        <iac_tax>0</iac_tax>\n        <iva_tax>0</iva_tax>\n      </transaction>\n      <transaction>\n        <pmt_ref_no>001108537448</pmt_ref_no>\n        <act_id>122876160</act_id>\n        <act_type>AD</act_type>\n        <mcc>5344778</mcc>\n        <post_ts>2025-01-17 09:23:16</post_ts>\n        <amt>-5</amt>\n        <details>test adj</details>\n        <description>Adjustment</description>\n        <source_id>52618</source_id>\n        <bal_id>425782</bal_id>\n        <prod_id>1068</prod_id>\n        <auth_ts>2025-01-17 09:23:16</auth_ts>\n        <trans_code>ADF</trans_code>\n        <ach_transaction_id/>\n        <external_trans_id>66659246</external_trans_id>\n        <original_auth_id>0</original_auth_id>\n        <network_code>?</network_code>\n        <local_amt/>\n        <local_curr_code/>\n        <settle_amt/>\n        <settle_curr_code/>\n        <billing_amt/>\n        <billing_curr_code/>\n        <merchant_id/>\n        <formatted_merchant_desc/>\n        <terminal_id/>\n        <card_id>0</card_id>\n        <iac_tax>0</iac_tax>\n        <iva_tax>0</iva_tax>\n      </transaction>\n      <transaction>\n        <pmt_ref_no>001108537430</pmt_ref_no>\n        <act_id>122876046</act_id>\n        <act_type>PM</act_type>\n        <mcc>53463221</mcc>\n        <post_ts>2025-01-17 09:09:16</post_ts>\n        <amt>100</amt>\n        <details>Retail Load</details>\n        <description>Payment</description>\n        <source_id>3792011</source_id>\n        <bal_id>425782</bal_id>\n        <prod_id>1067</prod_id>\n        <auth_ts>2025-01-17 09:09:16</auth_ts>\n        <trans_code>PMRL</trans_code>\n        <ach_transaction_id/>\n        <external_trans_id>T6NJAH3TV5SL2UXHSSO7</external_trans_id>\n        <original_auth_id>0</original_auth_id>\n        <network_code>?</network_code>\n        <local_amt/>\n        <local_curr_code/>\n        <settle_amt/>\n        <settle_curr_code/>\n        <billing_amt/>\n        <billing_curr_code/>\n        <merchant_id/>\n        <formatted_merchant_desc/>\n        <terminal_id/>\n        <card_id/>\n        <iac_tax>0</iac_tax>\n        <iva_tax>0</iva_tax>\n      </transaction>\n    </transactions>\n  </response_data>\n  <echo>\n    <provider_transaction_id/>\n    <provider_timestamp/>\n    <transaction_id>2JDT56HUK8EOW5VPAYRM</transaction_id>\n  </echo>\n  <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n  <system_timestamp>2025-07-13 12:27:47</system_timestamp>\n</response>"
