      parameters: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                accountNo:
                  description: "The <<glossary:PRN>> or <<glossary:PAN>> of the account.\nPattern: PAN or PRN \nExample: `\"074103447228\"`"
                  example: 074103447228
                  pattern: ^$|^([0-9]{12}|[0-9]{16})$
                  type: string
                apiLogin:
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                  type: string
                apiTransKey:
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                  type: string
                authId:
                  description: 'The system-generated authorization ID (`auth_id`) as returned by <a href="ref:post_getauthhistory" target="_blank">Get Authorization History</a>.

                    Pattern: Positive integer

                    Example: `58344373`'
                  example: 58344373
                  type: integer
                expirationDate:
                  description: 'Date that the authorization is eligible for expiration. Must be a date in the future. Leave this parameter empty to expire the authorization immediately.

                    Pattern: YYYY-MM-DD

                    Example: `"2026-03-05"`'
                  example: '2026-03-05'
                  format: date
                  type:
                  - string
                  - 'null'
                transactionId:
