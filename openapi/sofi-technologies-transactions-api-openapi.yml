      parameters: []
      summary: Get Account Overview
      description: 'Use the Get Account Overview endpoint to retrieve the combined response data from several other endpoints. Best practice is to use this endpoint to retrieve the data for a customer''s landing page or other similar display.


        Data sets returned by Get Account Overview:

        - General account information (balance, status, application date)

        - Cardholder profile data

        - Posted transactions

        - Pending card authorizations

        - Pending fees (generally because of insufficient funds)

        - Savings interest data, applicable only if an associated savings account exists; otherwise, a unary `savings_interest` element is returned.


        > 📘 Note

        >

        >Transactions created by Program API endpoints (such as Create Payment, Create Adjustment, and Create Account Transfer) are not present in this endpoint''s response for several seconds after creation.'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                accountNo:
                  type: string
                  pattern: ^.+$
                  description: 'The <<glossary:PRN>> or <<glossary:PAN>> of the account.

                    Pattern: PAN or PRN

                    Example: `"074103447228"`'
                  example: 074103447228
                startDate:
                  type:
                  - string
                  - 'null'
                  format: date
                  description: 'The beginning date for the date range, either a date or a date-time.

                    Pattern: YYYY-MM-DD or YYYY-MM-DD hh:mm:ss

                    Example: `"2016-01-01"`'
                  example: '2016-01-01'
                endDate:
                  type:
                  - string
                  - 'null'
                  format: date
                  description: "The end date for the date range, either a date or a date-time. Must be equal to or later than `startDate`. Max 1098 days (~3 years) after `startDate`. \nPattern: YYYY-MM-DD or YYYY-MM-DD hh:mm:ss\nExample: `\"2016-01-01\"`"
                  example: '2016-01-01'
              required:
              - accountNo
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      tags:
      - Transactions
      operationId: post_getaccountoverview
  /createAchTransaction:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      balance:
                        type: number
                        format: float
                        description: The available balance prior to applying the ACH transaction that is initiated by this endpoint call.For outgoing credits the balance adjustment happens shortly after calling this endpoint; for outgoing debits, the balance is adjusted when the hold period expires. An Events API message notifies when the transaction is posted to the account.
                      ach_transaction_id:
                        type: string
                        description: Unique identifier for the ACH transaction
                    required:
                    - ach_transaction_id
                    - balance
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.574,\n    \"response_data\": {\n        \"balance\": 100,\n        \"ach_transaction_id\": \"7425\"\n    },\n    \"echo\": {\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": null,\n        \"transaction_id\": \"EIDUWS2OWCAPJ4DET9SY\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n    \"system_timestamp\": \"2025-07-14 14:00:32\"\n}"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<response>\n <status_code>0</status_code>\n <status>Success</status>\n <system_timestamp>2025-07-14 14:10:12</system_timestamp>\n <response_data>\n   <balance>1847.07</balance>\n   <ach_transaction_id>J4DEW2T9SYCAPWSEIDUO</ach_transaction_id>\n </response_data>\n <processing_time>0.521</processing_time>\n <echo>\n   <transaction_id>12345a</transaction_id>\n   <provider_transaction_id/>\n   <provider_timestamp/>\n </echo>\n <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n</response>"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                providerId:
                  type: integer
                  format: int32
                  description: 'Your unique provider identifier from SoFi Tech Solutions.

                    Pattern: Max 10 digits

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                accountNo:
                  type: string
                  pattern: ^$|^([0-9]{12}|[0-9]{16})$
                  description: "The <<glossary:PRN>> or <<glossary:PAN>> of the account.\nPattern: PAN or PRN \nExample: `\"074103447228\"`"
                  example: 074103447228
                achAccountId:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 999999999999
                  description: 'ACH account identifier (`ach_account_id`), as returned by <a href="ref:post_addachaccount" target="_blank">Add ACH Account</a> or <a href="ref:post_getachaccounts" target="_blank">Get ACH Accounts</a>.

                    Pattern: Integer

                    Example: `354656`'
                  example: 354656
                amount:
                  type: number
                  format: float
                  minimum: 0.01
                  maximum: 9999999.99
                  description: 'Currency amount as a whole or decimal amount.

                    Pattern: Positive integer or float

                    Example: `100.00`, `100`, or `100.73`'
                  example: 25.5
                description:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 30
                  pattern: ^[\x20-\x7E]+$
                  description: 'Description for the ACH transaction.

                    Pattern: 1&ndash;30 <a href="ref:api-reference-special-characters#ach-name-parameters" target="_blank">supported characters</a>

                    Example: `"One-time payroll load."`'
                  example: One-time payroll load.
                remittanceInfo:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 80
                  pattern: ^[\x20-\x7E]+$
                  description: 'Description for the remittance. This string populates the **Payment Related Information** field of the _ACH Addenda Record_ in the outgoing <<glossary:Nacha file>>.

                    Pattern: 1&ndash;80 <a href="ref:api-reference-special-characters#ach-name-parameters" target="_blank">supported characters</a>

                    Example: `"Payoff 2500 transfer initiated and verified to Acct 12345678."`'
                  example: Payoff 2500 transfer initiated and verified to Acct 12345678.
                debitCreditIndicator:
                  type: string
                  enum:
                  - C
                  - D
                  description: 'Specifies whether to credit (`C`) or debit (`D`) the recipient account.

                    Pattern: String

                    Example: `"D"`'
                  example: D
                authorizationMethod:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 40
                  pattern: ^[\x20-\x7E]+$
                  description: 'The authorization method to use:

                    * `online_or_mobile` &mdash; Web site or mobile app

                    * `written_or_prearranged` &mdash; Signed document, agreement, or standing auth


                    For B2C debit transactions, missing or unsupported values are set to `null`, resulting in the PPD SEC code. For B2C credit and all non-B2C transactions, `authorizationMethod` is ignored and set to `null`.


                    Pattern: 1&ndash;40 characters

                    Example: `"online_or_mobile"`'
                  example: online_or_mobile
                  enum:
                  - online_or_mobile
                  - written_or_prearranged
                companyEntryDesc:
                  type: string
                  minLength: 1
                  maxLength: 10
                  pattern: ^[\x20-\x7E]+$
                  description: "Describes the purpose of the ACH transaction. Possible values:\n* `PAYROLL` &mdash; Compensation-related payments for employees or contractors, including wages and salaries. Required only for the PPD SEC code.\n* `PURCHASE` &mdash; E-commerce-related debit transactions initiated by the cardholder. Required for WEB SEC code, except as permitted by the rule on Standing Authorization to use the TEL SEC code. \n* Free-text.\n\n See list of <a href=\"ref:api-reference-restricted-company-entry-descriptions-values\" target=\"_blank\">restricted values and use cases</a>.\n\nPattern: Max 10 characters\nExample:`PAYROLL`"
                  example: PAYROLL
                sameDay:
                  type:
                  - string
                  - 'null'
                  enum:
                  - Y
                  - N
                  description: 'Specifies whether this is a same-day transaction.

                    Pattern: String

                    Example: `"Y"`'
                  example: Y
                identNumber:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 15
                  pattern: ^[a-zA-Z0-9 ]*$
                  description: 'Provider-supplied identifier, external to the system. This value is required only for the `CIE` and `WEB` <a href="page:sec-codes-requirements-for-ach" target="_blank">SEC codes</a>.

                    Pattern: 1&ndash;15 characters

                    Example: `"999456789"`'
                  example: '999456789'
                processorToken:
                  type:
                  - string
                  - 'null'
                  description: 'Obtained from Plaid when using Plaid integration. Checks the balance of the ACH account to verify that there are sufficient funds for an ACH debit.

                    Pattern: String

                    Example: `"processor-production-35cd43b-adfc-d8aa-b331-c9ba0fdha881"`'
                  example: processor-production-35cd43b-adfc-d8aa-b331-c9ba0fdha881
                finicityBalanceCheck:
                  type:
                  - string
                  - 'null'
                  enum:
                  - Y
                  - N
                  description: 'Controls whether the system performs a real-time balance check on an ACH account linked via Mastercard Finicity. By default, this check confirms that there are sufficient funds in the recipient account before initiating an ACH debit. To bypass balance checks, set to `N`.

                    Pattern: String

                    Example: `"N"`'
                  example: Y
                holdDays:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  minimum: 0
                  maximum: 9999999999
                  description: 'The number of hold days to apply to this transaction, which overrides the hold days in product settings. This value applies only to outgoing ACH debits (`debitCreditIndicator: D`). This parameter is available only to clients who have obtained bank approval to use it. The ACOHD parameter must be set to use this parameter.

                    Pattern: Integer

                    Example: 2'
                  example: 2
              required:
              - accountNo
              - achAccountId
              - amount
              - companyEntryDesc
              - debitCreditIndicator
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      tags:
      - Transactions
      summary: Create ACH Transaction
      parameters: []
      description: 'Use the Create ACH Transaction endpoint to originate an ACH transaction to move funds between a customer account (`accountNo`) and an existing ACH bank account (`achAccountId`). Use the Add ACH Account endpoint to add an ACH bank account.


        For more information on this endpoint see Creating an ACH transaction in the *ACH Endpoints* guide.'
      operationId: post_createachtransaction
