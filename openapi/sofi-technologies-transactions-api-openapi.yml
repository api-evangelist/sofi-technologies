      parameters: []
      summary: Create Adjustment
      description: 'Use the Create Adjustment endpoint to move funds into or out of a customer account. Transactions using this endpoint are returned by the Get Account Overview endpoint only after several seconds have elapsed. To drive an account negative using this endpoint, set the ALWNB parameter at the *provider* level.


        [block:callout]


        {

        "type": "warning",

        "title": "Warning",

        "body": "This endpoint requires a positive integer less than 9223372036854775807 (sys.maxint in Python 2 or sys.maxsize in Python 3) for `transactionId` rather than the alphanumeric string that all other endpoints use. The Reverse Adjustment endpoint uses this integer to identify the transaction to reverse out."

        }

        [/block]'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                transactionId:
                  type: integer
                  minimum: 1
                  maximum: 60
                  description: "A unique integer ID for the transaction. \nPattern: 64-byte integer\nExample: `164736451002`"
                  example: 164736451002
                  format: int64
                accountNo:
                  type: string
                  pattern: ^$|^([0-9]{12}|[0-9]{16})$
                  description: "The <<glossary:PRN>> or <<glossary:PAN>> of the account.\nPattern: PAN or PRN \nExample: `\"074103447228\"`"
                  example: 074103447228
                amount:
                  type: number
                  format: float
                  minimum: 0.01
                  maximum: 999999999999.99
                  description: 'Currency amount as a whole or decimal amount.

                    Pattern: Positive integer or decimal number

                    Example: `100.00`, `100`, or `100.73`'
                  example: 25.5
                type:
                  type: string
                  pattern: ^([a-zA-Z0-9]{1,2})$
                  description: 'The transaction type for the adjustment. Use the values provided by SoFi Tech Solutions for your program.

                    Pattern: 1- or 2-character alphanumeric, case-sensitive

                    Example: `"le"`'
                description:
                  type:
                  - string
                  - 'null'
                  pattern: ^[\w\W\s\d]{1,80}$
                  description: 'Description for the transaction.

                    Pattern: 1&ndash;80 alphanumeric characters, including punctuation

                    Example: `"One time payroll load."`'
                  example: One time payroll load.
                debitCreditIndicator:
                  type: string
                  enum:
                  - C
                  - D
                  description: 'Specifies whether this transaction credits or debits the account in `accountNo`:

                    * `C` &mdash; Credit

                    * `D` &mdash; Debit


                    Pattern: String

                    Example: `"D"`'
                  example: D
                location:
                  type:
                  - string
                  - 'null'
                  pattern: ^([a-zA-Z0-9]{1,20})$
                  description: 'Unique location identifier (`location`) as returned by the <a href="ref:post_createlocation" target="_blank">Create Location</a> endpoint.  This value is also returned by the <a href="ref:post_getlocations" target="_blank">Get Locations</a> endpoint depending on the value of `locationType` when the location was created:

                    * `0` or `2` &mdash; Returned in the `location_id` field

                    * `1` &mdash; Returned in the `provider_specified_id` field


                    Pattern: Integer if `locationType: 0` or `locationType: 2`; max 15 characters if `locationType: 1`

                    Example: `"a455-3483"`'
                  example: a455-3483
                locationType:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  enum:
                  - 0
                  - 1
                  - 2
                  description: 'Type of ID in `location`:

                    * `0` &mdash; SoFi Tech Solutions location ID

                    * `1` &mdash; Partner location ID

                    * `2` &mdash; Don''t validate


                    Pattern: Integer

                    Example: `0`'
                  example: 0
                verifyOnly:
                  type:
                  - string
                  - 'null'
                  enum:
                  - '0'
                  - '1'
                  description: 'Pass `1` to test the validity of the parameter data without committing the information to the system.

                    Pattern: Integer

                    Example: `0`'
                  example: 0
                includeRtfTransfer:
                  type:
                  - string
                  - 'null'
                  enum:
                  - '0'
                  - '1'
                  description: "Specifies whether the `amount` in this transaction should be transferred to or from the RTF funding account that is associated with this RTF spending account. Default: `1`\n* `0` — Do not perform an RTF transfer for this amount\n* `1` — Perform an RTF transfer for this amount.\n\nPattern: Integer \nExample: `\"1\"` "
                  example: 0
                disputeId:
                  type:
                  - string
                  - 'null'
                  maxLength: 16
                  pattern: ^([a-zA-Z0-9]{1,16})$
                  description: 'External dispute ID, to be used by dispute providers only.

                    Pattern: 1-16 alphanumeric characters

                    Example: "21010000000D"'
                  example: 21010000000D
                enforceTransactionLimits:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  enum:
                  - 0
                  - 1
                  description: 'Pass `1` to enforce any adjustment transaction limits.

                    Pattern: Integer

                    Example: `0`'
                  example: 0
              required:
              - accountNo
              - amount
              - debitCreditIndicator
              - transactionId
              - type
              - apiLogin
              - apiTransKey
              - providerId
      tags:
      - Transactions
      operationId: post_createadjustment
