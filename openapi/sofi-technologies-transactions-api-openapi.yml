                        format: int32
                        description: The page number to be retrieved for record-set paging
                      total_record_count:
                        type: integer
                        format: int32
                        description: Number of records in the accounts-list display
                      number_of_pages:
                        type: integer
                        format: int32
                        description: Total number of pages in the accounts-list display
                      start_date:
                        type: string
                        format: date-time
                        description: Start date of the transactions
                      end_date:
                        type: string
                        format: date-time
                        description: End date of the transactions
                      sums:
                        description: sums
                        type: object
                        properties:
                          unsettled:
                            type: number
                            format: float
                            description: The sum of transactions that have not been settled
                          settled:
                            type: number
                            format: float
                            description: The sum of authorizations that have been settled
                          adjustment:
                            type: number
                            format: float
                            description: 'The sum of adjustments (`act_type: AD`)'
                          fee:
                            type: number
                            format: float
                            description: 'The sum of charges for a service (`act_type: FE`)'
                          payment:
                            type: number
                            format: float
                            description: 'The sum of payments (`act_type: PM`)'
                        required:
                        - adjustment
                        - fee
                        - payment
                        - settled
                        - unsettled
                      transactions:
                        type: array
                        description: List of transactions
                        items:
                          type: object
                          properties:
                            act_id:
                              type:
                              - string
                              - 'null'
                              description: Transaction activity identifier used in the SoFi Tech Solutions system. This value is returned only because it is used to sort the transactions.
                            is_savings:
                              type: boolean
                              description: Specifies whether the transaction is made on a savings account.
                            deny_code:
                              type:
                              - string
                              - 'null'
                              description: Two-digit code when an authorization request is denied.
                            disputable:
                              type: boolean
                              description: Specifies whether the transaction can be disputed.
                            details:
                              type: string
                              description: Description provided by the merchant about the transaction (DE043).
                            act_type:
                              type: string
                              description: Activity type. See the <a href="ref:api-reference-activity-type" target="_blank">Activity Type</a> enumeration.
                            act_type_description:
                              type: string
                              description: Description of `act_type`. See the <a href="ref:api-reference-activity-type" target="_blank">Activity Type</a> enumeration.
                            latest_incremental_id:
                              type:
                              - string
                              - 'null'
                              description: The `auth_id` of the previous authorization in an incremental sequence, if any. This field contains the same information as `original_auth_id` and is present only by request.
                            original_incremental_id:
                              type:
                              - string
                              - 'null'
                              description: The `auth_id` of the first authorization in an incremental sequence, if any. This field is present only by request.
                            post_ts:
                              type: string
                              format: date-time
                              description: The date and time when a transaction was posted to the account ledger, in <a href="ref:system-time" target="_blank">system time</a>.
                            amt:
                              type: number
                              format: float
                              description: The transaction amount in the currency of the account. A negative amount debits funds from the account.
                            source_id:
                              type:
                              - string
                              - 'null'
                              description: A system-generated integer that maps back to the original transaction, such as `auth_id`, `pmt_id`, or `adj_id`.
                            type:
                              type: string
                              description: 'The otype of the transaction. When the otype is a numeral and `act_type: SE`, the numeral is returned as a string. Other numerals are returned as integers with no leading zeros. Refer to <a href="ref:api-reference-transaction-types" target="_blank">transaction types</a> for card-transaction values; for other transaction types, consult the otype list that SoFi Tech Solutions gave you.'
                            type_description:
                              type:
                              - string
                              - 'null'
                              description: The description of the transaction type.
                            trans_code:
                              type: string
                              description: A concatenation of the activity type (`act_type`) and transaction type (`type`).
                            arn:
                              type:
                              - string
                              - 'null'
                              description: Acquirer reference number. An identifier for the acquiring processor.
                            merchant_id:
                              type:
                              - string
                              - 'null'
                              description: Network-assigned identifier for a merchant (DE042).
                            external_trans_id:
                              type:
                              - string
                              - 'null'
                              description: A user-supplied identifier for a transaction, if any.
                            calculated_balance:
                              type: number
                              format: float
                              description: '**[DEPRECATED]** This field is deprecated and may be removed in future versions. It currently contains the same value as `rolling_balance`. '
                            rolling_balance:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: Available balance immediately after this transaction posts. If SoFi Tech Solutions is not the system of record, this value may not be accurate. For a new account with no transactions, this value is `null`.
                            ach_trans_id:
                              type:
                              - string
                              - 'null'
                              description: A unique identifier for the ACH transaction, if applicable.
                            auth_ts:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: The <a href="ref:system-time" target="_blank">system time</a> when a transaction was authorized.
                            prior_id:
                              type:
                              - string
                              - 'null'
                              description: The `auth_id` of the previous transaction in the sequence, if any.  Maps to `original_auth_id`.
                            card_id:
                              type:
                              - string
                              - 'null'
                              description: A system-generated identifier for a card, which can be used instead of the PAN. Maps to `cad`.
                            formatted_merchant_desc:
                              type:
                              - string
                              - 'null'
                              description: The same information as in the `details` field, with formatting.
                            network_code:
                              type:
                              - string
                              - 'null'
                              description: A system-generated code to identify the subnetwork over which the transaction took place. Maps to `network_id`.
                            auth_id:
                              type:
                              - string
                              - 'null'
                              description: A system-generated identifier for an authorization and its settlement.
                            local_amt:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: Amount of the authorization in the currency at the point of sale. Unsigned. This amount does not include upcharges or program fees. (DE004)
                            local_curr_code:
                              type:
                              - string
                              - 'null'
                              description: Currency code for `local_amt` (DE049).
                            settle_amt:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: The transaction amount, in the settlement currency (DE005)
                            settle_curr_code:
                              type:
                              - string
                              - 'null'
                              description: Currency code for `settle_amt` (DE050).
                            billing_amt:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: 'The transaction amount, in the currency of the cardholder account (DE006) '
                            billing_curr_code:
                              type:
                              - string
                              - 'null'
                              description: Currency code for `billing_amt` (DE051).
                            pmt_ref_no:
                              type:
                              - string
                              - 'null'
                              description: A system-generated number to identify the customer account. Maps to `PRN` and `prn`.
                            mcc_code:
                              type:
                              - string
                              - 'null'
                              description: Category code for the merchant that initiated the transaction (DE018).
                            credit_ind:
                              type:
                              - string
                              - 'null'
                              description: Indicates whether a PIN was input at the point of sale. `Y` = No PIN was input. `N` = A PIN was input. `None` = Not a card transaction, or not processed as a card transaction.
                            iac_tax:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: Impuesto al consumo. Colombian consumption tax. Required for the Mastercard Interchange Intracountry Calculation Program.
                            iva_tax:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: Impuesto al valor agregado. Colombian value-added tax. Required for the Mastercard Interchange Intracountry Calculation Program.
                            funding_account_prn:
                              type:
                              - string
                              - 'null'
                              description: The <<glossary:PRN>> of the <<glossary:RTF>> funding account
                            spending_account_prn:
                              type:
                              - string
                              - 'null'
                              description: The PRN of the RTF spending account
                          required:
                          - ach_trans_id
                          - act_type
                          - act_type_description
                          - amt
                          - arn
                          - auth_id
                          - auth_ts
                          - billing_amt
                          - billing_curr_code
                          - calculated_balance
