openapi: 3.2.0
info:
  title: Program Transactions API
  version: '4.0'
servers:
- url: api-{corename}.{env}.gpsrv.com/intserv/4.0/
tags:
- name: Transactions
paths:
  /getTransHistory:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      start_date:
                        type: string
                        format: date-time
                        description: The start date for the transaction range
                      end_date:
                        type: string
                        format: date-time
                        description: The end date for the transaction range
                      number_of_pages:
                        type: integer
                        format: int32
                        description: The total number of pages available in the paginated response
                      page:
                        type: integer
                        format: int32
                        description: The current page being retunred in the paginated response
                      total_record_count:
                        type: integer
                        format: int32
                        description: Number of records in the accounts list display
                      transaction_count:
                        type: integer
                        format: int32
                        description: The number of transactions listed in the response
                      transactions:
                        type: array
                        description: List of transactions
                        items:
                          type: object
                          properties:
                            pmt_ref_no:
                              type:
                              - string
                              - 'null'
                              description: <a href="doc:about-accounts#prn" target="_blank">Payment reference number</a>.
                            act_id:
                              type:
                              - string
                              - 'null'
                              description: Transaction activity identifier used in the SoFi Tech Solutions system
                            act_type:
                              type:
                              - string
                              - 'null'
                              description: Identifier for the transaction activity type. See the <a href="ref:api-reference-activity-type" target="_blank">Activity Type</a> enumeration.
                            post_ts:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: System timestamp when the transaction posted to the customer account, in <a href="ref:system-time" target="_blank">our system time</a>
                            amt:
                              type:
                              - string
                              - 'null'
                              description: The transaction amount in the currency of the account. A negative amount debits funds from the customer account.
                            details:
                              type:
                              - string
                              - 'null'
                              description: Description provided by the merchant about the transaction (DE043)
                            description:
                              type:
                              - string
                              - 'null'
                              description: Description of the activity type specified in the `act_type` field. See the <a href="ref:api-reference-activity-type" target="_blank">Activity Type</a> enumeration.
                            source_id:
                              type:
                              - string
                              - 'null'
                              description: System-generated identifier that maps to the original transaction, such as `auth_id`, `pmt_id`, or `adj_id`
                            bal_id:
                              type:
                              - string
                              - 'null'
                              description: Balance ID, a system-generated identifier for the account on which the transaction occurs. Maps to `galileo_account_number`.
                            prod_id:
                              type:
                              - string
                              - 'null'
                              description: Identifier for the product associated with the account
                            auth_ts:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: System timestamp when the transaction was authorized, in <a href="ref:system-time" target="_blank">our system time</a>
                            trans_code:
                              type:
                              - string
                              - 'null'
                              description: Reference your program's <a href="ref:api-reference-activity-type" target="_blank">activity</a> and <a href="ref:api-reference-transaction-types" target="_blank">transaction types</a> for possible values.
                            ach_transaction_id:
                              type:
                              - string
                              - 'null'
                              description: Identifier for the ACH transaction, if applicable
                            external_trans_id:
                              type:
                              - string
                              - 'null'
                              description: Optional identifier for a transaction that you supply. External to the system.
                            original_auth_id:
                              type:
                              - string
                              - 'null'
                              description: The `auth_id` of the previous transaction in the sequence, if any. Maps to `prior_id`.
                            network_code:
                              type:
                              - string
                              - 'null'
                              description: A system-generated code to identify the subnetwork over which the transaction took place. Maps to `network_id`.
                            local_amt:
                              type:
                              - string
                              - 'null'
                              description: Amount, in cents, of the authorization request, in the currency at the point of sale. 12-digit number including leading zeros. This amount does not include upcharges or program fees. (DE004)
                            local_curr_code:
                              type:
                              - string
                              - 'null'
                              description: Currency code for `local_amt` (DE049)
                            settle_amt:
                              type:
                              - string
                              - 'null'
                              description: The transaction amount in the settlement currency (DE005)
                            settle_curr_code:
                              type:
                              - string
                              - 'null'
                              description: Currency code for `settle_amt` (DE050)
                            billing_amt:
                              type:
                              - string
                              - 'null'
                              description: 'The transaction amount in the currency of the account (DE006) '
                            billing_curr_code:
                              type:
                              - string
                              - 'null'
                              description: Currency code for `billing_amt` (DE051)
                            mcc:
                              type:
                              - string
                              - 'null'
                              description: Category code for the merchant that initiated the transaction (DE018)
                            merchant_id:
                              type:
                              - string
                              - 'null'
                              description: Network-assigned identifier for a merchant (DE042)
                            formatted_merchant_desc:
                              type:
                              - string
                              - 'null'
                              description: The same information as in the `details` field, with formatting
                            terminal_id:
                              type:
                              - string
                              - 'null'
                              description: Identifier for the card reader at the point of sale (DE041)
                            card_id:
                              type:
                              - string
                              - 'null'
                              description: A system-generated identifier for a card, which can be used instead of the PAN. Maps to `cad`.
                            credit_ind:
                              type:
                              - string
                              - 'null'
                              description: Indicates whether a PIN was input at the point of sale. `Y` = No PIN was input. `N` = A PIN was input. `None` = Not a card transaction.
                            iac_tax:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: Impuesto al Consumo. Colombian consumption tax. Required for the Mastercard Interchange Intracountry Calculation Program.
                            iva_tax:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: Impuesto al Valor Agregado. Colombian value-added tax. Required for the Mastercard Interchange Intracountry Calculation Program.
                            funding_account_prn:
                              type:
                              - string
                              - 'null'
                              description: The <<glossary:PRN>> of the <<glossary:RTF>> funding account
                            spending_account_prn:
                              type:
                              - string
                              - 'null'
                              description: The PRN of the RTF spending account
                            original_incremental_id:
                              type:
                              - integer
                              - 'null'
                              format: int32
                              description: The original incremental id. The id for the first incremental transaction
                            latest_incremental_id:
                              type:
                              - integer
                              - 'null'
                              format: int32
                              description: The latest incremental id. The id for the most recent transaction
                          required:
                          - act_id
                          - act_type
                          - amt
                          - auth_ts
                          - bal_id
                          - description
                          - details
                          - mcc
                          - pmt_ref_no
                          - post_ts
                          - prod_id
                          - source_id
                          - trans_code
                    required:
                    - end_date
                    - number_of_pages
                    - page
                    - start_date
                    - total_record_count
                    - transaction_count
                    - transactions
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.065,\n    \"response_data\": {\n        \"start_date\": \"2025-12-01 00:00:00\",\n        \"end_date\": \"2025-07-13 23:59:59\",\n        \"number_of_pages\": 1,\n        \"page\": 1,\n        \"total_record_count\": 4,\n        \"transaction_count\": 4,\n        \"transactions\": [\n            {\n                \"pmt_ref_no\": \"001108537422\",\n                \"act_id\": \"122876467\",\n                \"act_type\": \"AD\",\n                \"mcc\": \"534882\",\n                \"post_ts\": \"2025-01-17 10:01:06\",\n                \"amt\": \"-5\",\n                \"details\": \"test adj\",\n                \"description\": \"Adjustment\",\n                \"source_id\": \"52621\",\n                \"bal_id\": \"425782\",\n                \"prod_id\": \"88\",\n                \"auth_ts\": \"2025-01-17 10:01:06\",\n                \"trans_code\": \"ADF\",\n                \"ach_transaction_id\": null,\n                \"external_trans_id\": \"60130481\",\n                \"original_auth_id\": \"0\",\n                \"network_code\": \"?\",\n                \"local_amt\": null,\n                \"local_curr_code\": null,\n                \"settle_amt\": null,\n                \"settle_curr_code\": null,\n                \"billing_amt\": null,\n                \"billing_curr_code\": null,\n                \"merchant_id\": \"\",\n                \"formatted_merchant_desc\": \"\",\n                \"terminal_id\": \"\",\n                \"card_id\": \"0\",\n                \"iac_tax\": \"0\",\n                \"iva_tax\": \"0\"\n            },\n            {\n                \"pmt_ref_no\": \"001108537422\",\n                \"act_id\": \"122876352\",\n                \"act_type\": \"FE\",\n                \"mcc\": \"5344778\",\n                \"post_ts\": \"2025-01-17 09:46:43\",\n                \"amt\": \"-9.95\",\n                \"details\": \"Activ