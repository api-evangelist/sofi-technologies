      parameters: []
      summary: Get Transaction History
      description: 'Use the Get Transaction History endpoint to retrieve a list of posted transactions (settlements, payments, adjustments, fees) during a specified timespan. This endpoint does not return unsettled authorizations.

        - As desired, use the `act_type` field in the response to filter the responses by transaction type.

        - See Record-Set Pagination for instructions on using the paging parameters.

        - Open the Recipe below to see a response example.'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                accountNo:
                  type: string
                  pattern: ^$|^([0-9]{12}|[0-9]{16})$
                  description: "The <<glossary:PRN>> or <<glossary:PAN>> of the account.\nPattern: PAN or PRN \nExample: `\"074103447228\"`"
                  example: 074103447228
                startDate:
                  type: string
                  format: date
                  description: 'The beginning date for the date range, either a date or a date-time.

                    Pattern: YYYY-MM-DD or YYYY-MM-DD hh:mm:ss

                    Example: `"2016-01-01"`'
                  example: '2016-01-01'
                endDate:
                  type: string
                  format: date
                  description: "The end date for the date range, either a date or a date-time. Must be equal to or later than `startDate`. Max 1098 days (~3 years) after `startDate`. \nPattern: YYYY-MM-DD or YYYY-MM-DD hh:mm:ss\nExample: `\"2016-01-01\"`"
                  example: '2016-01-01'
                recordCnt:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  minimum: 1
                  maximum: 99999
                  description: 'The maximum number of records per page to be returned.

                    Pattern: Positive integer `1-99999`

                    Example: `100`'
                  example: 100
                page:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  default: 1
                  description: 'The number of the page to retrieve.

                    Pattern: Integer value of `1` or greater

                    Example: `3`'
                  example: 3
                includeRelated:
                  type: integer
                  format: int32
                  default: 1
                  enum:
                  - 0
                  - 1
                  description: "Whether to return transactions for all accounts that share the balance (`bal_id`). \n- `0` &mdash; Retrieve only transactions from the specified account. \n- `1` &mdash; **Default**. Retrieve all transactions that share the same balance. \n\nPattern: Integer\nExample: `0`"
                  example: 0
              required:
              - accountNo
              - endDate
              - startDate
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      tags:
      - Transactions
      operationId: post_gettranshistory
  /getAuthHistory:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      description: 'Use the Get Authorization History endpoint to retrieve a list of authorizations. By default it returns authorizations that have not settled, expired, or been reversed.

        You can return authorizations in any status by setting `includeAllStatuses`.

        - See Record-Set Pagination for instructions on using the paging parameters.

        - Open the Recipe below to see a response example.'
      operationId: post_getauthhistory
      parameters: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                accountNo:
                  description: 'The <<glossary:PRN>> or <<glossary:PAN>> of the account.

                    Pattern: PAN or PRN

                    Example: `"074103447228"`'
                  example: 074103447228
                  pattern: ^.+$
                  type: string
                apiLogin:
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                  type: string
                apiTransKey:
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                  type: string
                cardId:
                  description: Supply the cardId (CAD) to filter authorization history to those transactions performed on the provided card.
                  example: '12345'
                  type:
                  - integer
                  - 'null'
                endDate:
                  description: "The end date for the date range, either a date or a date-time. Must be equal to or later than `startDate`. Max 1098 days (~3 years) after `startDate`. \nPattern: YYYY-MM-DD or YYYY-MM-DD hh:mm:ss\nExample: `\"2016-01-01\"`"
                  example: '2016-01-01'
                  format: date
                  type: string
                includeAllStatuses:
                  description: "When true, include transactions in all statuses.  When not set, return transactions in the \"pending\" statuses.\n \nPattern: Boolean\nExample: `0`"
                  example: 0
                  type:
                  - boolean
                  - 'null'
                includeExtendedRiskData:
                  description: "When true, include extended risk data.\n \nPattern: Boolean\nExample: `0`"
                  example: 0
                  type:
                  - boolean
                  - 'null'
                includeRelated:
