                storeLongitude:
                  type:
                  - string
                  - 'null'
                  pattern: ^([-+]?[0-9]{1,3}[.]\d+)$
                  description: '**Load partners only.** Longitude for the retail store where the card was loaded.

                    Pattern: Positive or negative float, no limit on decimal places

                    Example: `-111.89920138637734`'
                storeName:
                  type:
                  - string
                  - 'null'
                  maxLength: 50
                  pattern: ^[a-zA-Z0-9áéíóúÁÉÍÓÚàèìòùÀÈÌÒÙâêîôûÂÊÎÔÛãñõÃÑÕäëïöüÿÄËÏÖÜŸåÅøØæÆœŒßçÇšžŠŽþðÞÐ '.,?#~*+@!()_;&-]+$
                  description: '**Load partners only.** Name of the retail store where the card was loaded.

                    Pattern: Max 50 alphanumeric and <a href="ref:api-reference-special-characters#international-characters" target="_blank">international</a> characters.

                    Example: `"Main Street GroceryMart"`'
                storeNumber:
                  type:
                  - string
                  - 'null'
                  maxLength: 50
                  description: '**Load partners only.** Identifier for the retail store where the card was loaded.

                    Pattern: Max 50 alphanumeric <a href="ref:api-reference-special-characters#international-characters" target="_blank">international</a> characters

                    Example: `"13459284"`'
                storeTransactionDate:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: '**Load partners only.** Date that the card was loaded.

                    Pattern: YYYY-MM-DD hh:mm:ss

                    Example: `2021-11-14 13:23:04`'
                storeCity:
                  type:
                  - string
                  - 'null'
                  pattern: ^[a-zA-Z0-9áéíóúÁÉÍÓÚàèìòùÀÈÌÒÙâêîôûÂÊÎÔÛãñõÃÑÕäëïöüÿÄËÏÖÜŸåÅøØæÆœŒßçÇšžŠŽþðÞÐ '.,_@-]+$
                  description: '**Load partners only.** City for the retail store where the card was loaded.

                    Pattern: Max 30 alphanumeric and <a href="ref:api-reference-special-characters#international-characters" target="_blank">international</a> characters plus <a href="ref:api-reference-special-characters#city-symbols" target="_blank">city symbols</a>

                    Example: `Salt Lake City`'
                storeState:
                  type:
                  - string
                  - 'null'
                  minLength: 2
                  maxLength: 2
                  pattern: ^[a-zA-ZáéíóúÁÉÍÓÚàèìòùÀÈÌÒÙâêîôûÂÊÎÔÛãñõÃÑÕäëïöüÿÄËÏÖÜŸåÅøØæÆœŒßçÇšžŠŽþðÞÐ]+$
                  description: '**Load partners only.** State or province for the retail store where the card was loaded.

                    Pattern: 2 ASCII letters or <a href="ref:api-reference-special-characters#international-characters" target="_blank">international</a> characters</a>

                    Example: `UT`'
                storeZipCode:
                  type:
                  - string
                  - 'null'
                  minLength: 5
                  maxLength: 10
                  pattern: ^[a-zA-Z0-9\-\ ]*$
                  description: '**Load partners only.** Zip code for the retail store where the card was loaded.

                    Pattern: `12345`, `12345-1234`, or `K1A-1A1`

                    Example: `"84121"`'
                  example: '84121'
                holdAmount:
                  type:
                  - number
                  - 'null'
                  format: float
                  minimum: 0.01
                  maximum: 999999999999.99
                  description: 'Amount to hold. To hold the entire payment amount, pass the same value as in `amount`.

                    Pattern: Positive integer or decimal number

                    Example: `100.00`, `100`, or `100.73`'
                  example: 25.5
                holdExpirationDateTime:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: 'Date-time to expire the hold.

                    Pattern: YYYY-MM-DD hh:mm:ss

                    Example: `2021-11-14 13:23:04`'
                  example: '2017-01-01 13:00:00'
                holdDescription:
                  type:
                  - string
                  - 'null'
                  pattern: ^([\w\W\s\d]{1,80})$
                  description: 'Description for the hold.

                    Pattern: Max 80 alphanumeric characters, including punctuation

                    Example: `"One time payroll load."`'
                  example: One time payroll load.
                holdExternalId:
                  type:
                  - string
                  - 'null'
                  pattern: ^[\w\W\s\d]{1,60}$
                  description: 'External identifier for a hold.

                    Pattern: Max 60 alphanumeric characters

                    Example: `"45348bacd483348"`'
                  example: 45348bacd483348
                referenceId:
                  type:
                  - string
                  - 'null'
                  pattern: ^[\w\W\s\d]{1,35}$
                  description: 'Network identifier for <<glossary:RTP>> payments.

                    Pattern: Max 35 alphanumeric characters

                    Example: `"20230805021000021P1BRJPM00040034610"`'
                  example: 20230805021000021P1BRJPM00040034610
                originatorName:
                  type:
                  - string
                  - 'null'
                  maxLength: 140
                  description: 'Debtor (individual or company) name for RTP payments.

                    Pattern: Max 140 characters

                    Example: `"John Doe"`'
                  example: John Doe
                receiverName:
                  type:
                  - string
                  - 'null'
                  maxLength: 140
                  description: 'Creditor (individual or company) name for RTP payments.

                    Pattern: Max 140 characters

                    Example: `"Jane Smith"`'
                  example: Jane Smith
              required:
              - accountNo
              - amount
              - transactionId
              - type
              - apiLogin
              - apiTransKey
              - providerId
