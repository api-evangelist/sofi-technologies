      operationId: post_createpayment
  /assessFee:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      old_balance:
                        type: number
                        description: The balance on the account before the reversal is processed
                      new_balance:
                        type: number
                        description: The balance on the account after the reversal is processed
                      fee_amount:
                        type: number
                        description: Numeric amount of the fee
                      transaction_id:
                        type: string
                        description: A number that represents transaction
                      fee_trans_id:
                        type: integer
                        format: int32
                        description: DEPRECATED field. Refer to `fee_id` and `fee_event_id` instead.
                      fee_id:
                        type: integer
                        format: int32
                        description: Fee transaction identifier (generated when the fee is assessed)
                      fee_event_id:
                        type: integer
                        format: int32
                        description: Fee event identifier (generated when the fee is assessed)
                    required:
                    - fee_amount
                    - fee_event_id
                    - fee_id
                    - fee_trans_id
                    - new_balance
                    - old_balance
                    - transaction_id
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.26,\n    \"response_data\": {\n        \"old_balance\": 1208.2,\n        \"new_balance\": 1206.25,\n        \"fee_amount\": \"1.95\",\n        \"transaction_id\": \"UWFIDV5YSUVTP88P5PH2\",\n        \"fee_id\": \"12312321\",\n        \"fee_event_id\": \"321321321\"\n        },\n    \"echo\": {\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": null,\n        \"transaction_id\": \"UWFIDV5YSUVTP88P5PH2\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n    \"system_timestamp\": \"2025-07-13 10:47:14\"\n}"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" ?>\n<response>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <processing_time>0.093</processing_time>\n  <response_data>\n    <old_balance>1165.6</old_balance>\n    <new_balance>1163.65</new_balance>\n    <fee_amount>1.95</fee_amount>\n    <transaction_id>1S9AU486PI1W4JAOR4F4</transaction_id>\n    <fee_id>12312321</fee_id>\n    <fee_event_id>321321321</fee_event_id>\n  </response_data>\n  <echo>\n    <provider_transaction_id/>\n    <provider_timestamp/>\n    <transaction_id>1S9AU486PI1W4JAOR4F4</transaction_id>\n  </echo>\n  <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n  <system_timestamp>2025-07-13 12:42:54</system_timestamp>\n</response>"
          description: ''
      parameters: []
      summary: Assess Fee
      description: Use the Assess Fee endpoint to charge a fee to the specified account. The fee `type` parameter values must already be registered in the system for your program.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                accountNo:
                  type: string
                  pattern: ^$|^([0-9]{12}|[0-9]{16})$
                  description: "The <<glossary:PRN>> or <<glossary:PAN>> of the account.\nPattern: PAN or PRN \nExample: `\"074103447228\"`"
                  example: 074103447228
                type:
                  type: string
                  pattern: ^([a-zA-Z0-9]{1,3})$
                  description: 'Three-character fee code. Consult the curated list of fees that SoFi Tech Solutions provided you. Do not use the numeric otype.

                    Pattern: 1-4 alphanumeric characters

                    Example: `"C2C"`'
                  example: '2'
                transAmount:
                  type:
                  - number
                  - 'null'
                  format: float
                  default: 0
                  minimum: 0
                  maximum: 999999999999.99
                  description: 'The amount of the transaction on which to assess the fee, if the fee is a percentage of the transaction. Pass a currency amount as a whole or decimal amount.

                    Pattern: Positive integer or decimal amount.

                    Example: `100.00`, `100`  or `100.73`'
                  example: 25.99
                amount:
                  type:
                  - number
                  - 'null'
                  format: float
                  default: 0
                  minimum: 0.01
                  maximum: 999999999999.99
                  description: 'Amount of the fee to assess, if the fee is a flat fee. Pass a currency amount as a whole or decimal amount.

                    Pattern: Positive integer or decimal amount

                    Example: `100.00`, `100`  or `100.73`'
                  example: 25.5
                verifyOnly:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  enum:
                  - 0
                  - 1
                  description: 'Pass `1` to test the validity of the parameter data without committing the information to the system.

                    Pattern: Integer

                    Example: `0`'
                  example: 0
              required:
              - accountNo
              - transactionId
              - type
              - apiLogin
              - apiTransKey
              - providerId
      tags:
      - Transactions
      operationId: post_assessfee
