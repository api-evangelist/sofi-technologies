          description: ''
      parameters: []
      summary: Get All Transaction History
      description: 'Use the Get All Transaction History endpoint to retrieve all of the transactions on the SoFi Tech Solutions ledger, including backouts, denied transactions, >-only requests, and tokenization requests.

        - This endpoint returns the same transactions as the *All Transactions* page in the >.

        - Transactions are returned newest first, ordered by `post_ts` descending. Because `post_ts` has one-second precision, transactions sharing the same second are then ordered by `act_id` descending. Pending payments and denied authorizations have no `act_id` and are returned after the posted transactions they share a `post_ts` with.

        - See Record-Set Pagination for instructions on using the paging parameters.

        - Open the Recipes below to see response examples.'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                accountNo:
                  type: string
                  pattern: ^$|^([0-9]{12}|[0-9]{16})$
                  description: 'The <<glossary:PRN>> or <<glossary:PAN>> of the account.

                    Pattern: PAN or PRN

                    Example: `"074103447228"`'
                  example: 074103447228
                startDate:
                  type: string
                  format: date
                  description: 'The beginning date for the date range, either a date or a date-time.

                    Pattern: YYYY-MM-DD or YYYY-MM-DD hh:mm:ss

                    Example: `"2016-01-01"`'
                endDate:
                  type: string
                  format: date
                  description: "The end date for the date range, either a date or a date-time. Must be equal to or later than `startDate`. Max 1098 days (~3 years) after `startDate`. \nPattern: YYYY-MM-DD or YYYY-MM-DD hh:mm:ss\nExample: `\"2016-01-01\"`"
                  example: '2016-01-01'
                page:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  default: 1
                  minimum: 1
                  maximum: 999999
                  description: 'The number of the page to retrieve.

                    Pattern: Integer value of `1` or greater

                    Example: `3`'
                  example: 3
                recordCnt:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  minimum: 1
                  maximum: 99999
                  description: 'The maximum number of records per page to be returned.

                    Pattern: Positive integer `1-99999`

                    Example: `100`'
                  example: 100
              required:
              - accountNo
              - endDate
              - startDate
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      tags:
      - Transactions
      operationId: post_getalltranshistory
