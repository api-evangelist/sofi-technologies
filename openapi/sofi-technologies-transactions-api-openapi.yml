                  type: string
                  minLength: 1
                  maxLength: 30
                  pattern: ^[A-Za-z0-9\|_\. '`\?,!@$%#\"\/\-=]{1,30}$
                  description: 'The account number that the account holder has with the biller. When applicable, the account number is validated against the `biller_account_no_patterns` that were returned by <a href="ref:post_searchbillerdirectory" target="_blank">Search Biller Directory</a>. You cannot edit this value with <a href="ref:post_modifyrppsbiller" target="_blank">Modify RPPS Biller</a>. If the account holder submits an incorrect value, you must remove the biller and create the biller again with the correct account number.

                    Pattern: Alphanumeric string including hyphens and spaces.

                    Example: `"3333223323455555"`'
                  example: '3333223323455555'
                frequencyType:
                  type:
                  - string
                  - 'null'
                  enum:
                  - O
                  - W
                  - M
                  - Q
                  - Y
                  description: 'Frequency of the bill payment:

                    * `O` &mdash; One time

                    * `W` &mdash; Weekly

                    * `M` &mdash; Monthly

                    * `Q` &mdash; Quarterly

                    * `Y` &mdash; Yearly


                    If this value is not `O` then `nextDate` and `endDate` are **required**.

                    Pattern: One letter

                    Example: `"W"`'
                  example: W
                nextDate:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: 'The next date that the payment is scheduled.

                    Pattern: YYYY-MM-DD

                    Example: `"2015-02-04"`'
                  example: '2015-02-04'
                endDate:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: 'The last date that the payment is scheduled. Can be up to five years in the future, so if today is 20 Jan 2020, this parameter can be no later than 20 Jan 2025. However, if today''s date is a leap day, such as 29 Feb 2020, the latest date can be 1 Mar 2025.

                    Pattern: YYYY-MM-DD

                    Example: `"2015-02-04"`'
                  example: '2015-02-04'
                amount:
                  type:
                  - number
                  - 'null'
                  format: float
                  minimum: 0.01
                  maximum: 999999999999.99
                  description: 'Currency amount as a whole or decimal amount.

                    Pattern: Positive integer or decimal number

                    Example: `100.00`, `100`, or `100.73`'
                  example: 25.5
              required:
              - accountNo
              - billerAccountNo
              - rppsBillerId
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      operationId: post_addrppsbiller
