                  description: '**Load partners only.** Second line of the retail store address where the card was loaded.

                    Pattern: Max 30 alphanumeric <a href="ref:api-reference-special-characters#international-characters" target="_blank">international</a> characters plus <a href="ref:api-reference-special-characters#address-symbols" target="_blank">address symbols</a>

                    Example: `Ste 700`'
                storeCounty:
                  type:
                  - string
                  - 'null'
                  maxLength: 50
                  description: '**Load partners only.** The country where the store is located. Three-digit UN M49 code, such as `840` for USA, `124` for Canada, `484` for Mexico, `170` for Colombia.

                    Pattern: 3-digit numeric string

