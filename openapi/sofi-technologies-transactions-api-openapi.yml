      parameters: []
      summary: Create Account Transfer
      description: 'Use the Create Account Transfer endpoint to move funds between accounts in the same program. You can combine a fee with the payment or adjustment, depending on what transaction types you have set up with SoFi Tech Solutions. The accounts can belong to the same customer or different customers. If the accounts are in different programs, verify that the program parameters permit transferring funds between the programs.


        Pass the sending account in the `accountNo` parameter and the receiving account in the `transferToAccountNo` parameter. The receiving account should be in `status: N` (active) and the active flag set to `Y`.


        To permit this endpoint to drive the sending account negative, set the ALWNB parameter on the sending product.


        Consult the Creating an Internal Transfer guide for instructions on using this endpoint.'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                accountNo:
                  type: string
                  pattern: ^$|^([0-9]{12}|[0-9]{16})$
                  description: 'The <<glossary:PRN>> or <<glossary:PAN>> of the sending account.

                    Pattern: PAN or PRN

                    Example: `"074103447228"`'
                  example: 074103447228
                amount:
                  type: number
                  format: float
                  minimum: 0.01
                  description: "Currency amount as a whole or decimal amount. \nPattern: Positive integer or decimal number\nExample: `100.00`, `100`, or `100.73`"
                  example: 25.5
                transferToAccountNo:
                  type: string
                  pattern: ^[0-9]{12}$|^[0-9]{16}$
                  description: 'The <<glossary:PAN>> or <<glossary:PRN>> of the receiving account.

                    Pattern: PAN or PRN

                    Example: `"074103447228"`'
                  example: 074103447228
                message:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 2000
                  description: 'A message for the transfer recipient. The C2DSC provider parameter must be set to `1` to populate this parameter. If you do not populate this parameter, it defaults to the value in the BMNAM product parameter. The system truncates this field to 80 characters.

                    Pattern: Max 2000  Windows-1252 characters

                    Example: `"Thanks again for lunch!"`'
                  example: Thanks again for lunch!
                senderMessage:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 80
                  description: "A message for the transfer sender. The C2DSC provider parameter must be set to populate this parameter. If you do not populate this parameter, it defaults to the value in `message`. \nPattern: Max 80 Windows-1252 characters\nExample: `\"Thanks again for lunch!\"`"
                  example: Thanks again for lunch!
                type:
                  type:
                  - string
                  - 'null'
                  pattern: ^([a-zA-Z0-9]){3}$
                  description: 'Transaction type for the transfer. Use the values provided by SoFi Tech Solutions for your program.

                    Pattern: Max 3 alphanumeric characters, case-sensitive

                    Example: `"MRM"`'
                  example: MRM
              required:
              - accountNo
              - amount
              - transactionId
              - transferToAccountNo
              - apiLogin
              - apiTransKey
              - providerId
