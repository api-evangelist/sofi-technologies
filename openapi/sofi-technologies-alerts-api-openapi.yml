                    - 'null'
                    properties:
                      found:
                        type: integer
                        format: int32
                        description: A count of the Carriers being reported on
                      carriers:
                        type: array
                        description: List of carrier objects
                        items:
                          description: A data structure that lists one or more carriers
                          type: object
                          properties:
                            carrier_id:
                              type: string
                              description: An ID number assigned to the associated carrier
                            email_gateway:
                              type:
                              - string
                              - 'null'
                              description: A domain name to be used for translating emails to text messages with various phone carriers
                            carrier_name:
                              type:
                              - string
                              - 'null'
                              description: The name of the mobile phone service carrier
                            carrier_display_name:
                              type:
                              - string
                              - 'null'
                              description: The name of the mobile phone service carrier
                          required:
                          - carrier_display_name
                          - carrier_id
                          - carrier_name
                          - email_gateway
                    required:
                    - carriers
                    - found
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.028,\n    \"response_data\": {\n        \"found\": 5,\n        \"carriers\": [\n            {\n                \"carrier_id\": \"4\",\n                \"email_gateway\": \"mobile.mycingular.net\",\n                \"carrier_name\": \"AT&T Cingular\",\n                \"carrier_display_name\": \"AT&T Cingular\"\n            },\n            {\n                \"carrier_id\": \"2\",\n                \"email_gateway\": \"txt.att.net\",\n                \"carrier_name\": \"AT&T Mobile\",\n                \"carrier_display_name\": \"AT&T Mobile\"\n            },\n            {\n                \"carrier_id\": \"1\",\n                \"email_gateway\": \"mobile.mycingular.net\",\n                \"carrier_name\": \"AT&T mMode\",\n                \"carrier_display_name\": \"AT&T mMode\"\n            },\n            {\n                \"carrier_id\": \"3\",\n                \"email_gateway\": \"sms.alltelwireless.com\",\n                \"carrier_name\": \"AllTel\",\n                \"carrier_display_name\": \"AllTel\"\n            },\n            {\n                \"carrier_id\": \"42\",\n                \"email_gateway\": \"awsms.com\",\n                \"carrier_name\": \"Appalachian Wireless\",\n                \"carrier_display_name\": \"Appalachian Wireless\"\n            }\n        ]\n    },\n    \"echo\": {\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": null,\n        \"transaction_id\": \"80YI6K6YJXKRD3UKWEG3\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n    \"system_timestamp\": \"2025-07-13 10:39:09\"\n}"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" ?>\n<response>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <processing_time>0.091</processing_time>\n  <response_data>\n    <found>5</found>\n    <carriers>\n      <carrier>\n        <carrier_id>4</carrier_id>\n        <email_gateway>mobile.mycingular.net</email_gateway>\n        <carrier_name>AT&amp;T Cingular</carrier_name>\n        <carrier_display_name>AT&amp;T Cingular</carrier_display_name>\n      </carrier>\n      <carrier>\n        <carrier_id>2</carrier_id>\n        <email_gateway>txt.att.net</email_gateway>\n        <carrier_name>AT&amp;T Mobile</carrier_name>\n        <carrier_display_name>AT&amp;T Mobile</carrier_display_name>\n      </carrier>\n      <carrier>\n        <carrier_id>1</carrier_id>\n        <email_gateway>mobile.mycingular.net</email_gateway>\n        <carrier_name>AT&amp;T mMode</carrier_name>\n        <carrier_display_name>AT&amp;T mMode</carrier_display_name>\n      </carrier>\n      <carrier>\n        <carrier_id>3</carrier_id>\n        <email_gateway>sms.alltelwireless.com</email_gateway>\n        <carrier_name>AllTel</carrier_name>\n        <carrier_display_name>AllTel</carrier_display_name>\n      </carrier>\n      <carrier>\n        <carrier_id>42</carrier_id>\n        <email_gateway>awsms.com</email_gateway>\n        <carrier_name>Appalachian Wireless</carrier_name>\n        <carrier_display_name>Appalachian Wireless</carrier_display_name>\n      </carrier>\n    </carriers>\n  </response_data>\n  <echo>\n    <provider_transaction_id/>\n    <provider_timestamp/>\n    <transaction_id>I3RGNISA0QHCD70BUYNU</transaction_id>\n  </echo>\n  <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n  <system_timestamp>2025-07-13 12:32:32</system_timestamp>\n</response>"
      tags:
      - Alerts
      description: Use the Get Carriers List endpoint to retrieve a set of carrier names and IDs. The `carrier_id` in the response is the value that was passed as `mobileCarrierId` in theCreate Account request.
      summary: Get Carriers List
      operationId: post_getcarrierlist
  /modifyOnDemandAlertStatus:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
