                  example: 123e4567-e89b-12d3-a456-426614174000
                programId:
                  type: integer
                  format: int32
                  description: 'Program ID number provided by SoFi Tech Solutions.

                    Pattern: Positive integer value

                    Example: `1032`'
                  example: 1032
              required:
              - programId
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      parameters: []
      responses:
        default:
          description: ''
          content:
            application/json:
