              - apiTransKey
              - providerId
      parameters: []
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      black_out:
                        description: Black out
                        type: object
                        properties:
                          begin_time:
                            type: string
                            description: Displays the beginning time (in 24 hour format) for an alert blackout
                          end_time:
                            type: string
                            description: Displays the time (in 24 hour format) for an alert blackout to end
                          time_zone:
                            type:
                            - string
                            - 'null'
                            description: Displays the time zone to calculate blackout between; -3=Hawaii, -2=Alaska, -1=Pacific, 0=Mountain, 1=Central, 2=Easter, 3=Atlantic
                          daylight_savings:
                            type:
                            - string
                            - 'null'
                            description: Displays if daylight savings time is observed on the alerts blackout
                        required:
                        - begin_time
                        - daylight_savings
                        - end_time
                        - time_zone
                    required:
                    - black_out
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.061,\n    \"response_data\": {\n        \"black_out\": {\n            \"begin_time\": \"07:00\",\n            \"end_time\": \"15:00\",\n            \"time_zone\": \"0\",\n            \"daylight_savings\": \"Y\"\n        }\n    },\n    \"echo\": {\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": null,\n        \"transaction_id\": \"CC2N3XSSMQYMAOPSL8XY\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n    \"system_timestamp\": \"2025-07-13 10:39:08\"\n}"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" ?>\n<response>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <processing_time>0.074</processing_time>\n  <response_data>\n    <black_out>\n      <begin_time>07:00</begin_time>\n      <end_time>15:00</end_time>\n      <time_zone>0</time_zone>\n      <daylight_savings>Y</daylight_savings>\n    </black_out>\n  </response_data>\n  <echo>\n    <provider_transaction_id/>\n    <provider_timestamp/>\n    <transaction_id>EIMZQMNLB0646JIK2IAN</transaction_id>\n  </echo>\n  <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n  <system_timestamp>2025-07-13 12:32:32</system_timestamp>\n</response>"
      tags:
      - Alerts
      description: Use the Get Alerts Blackout endpoint to retrieve a list of customer-defined preferences for when messages should not be sent.
      summary: Get Alerts Blackout
      operationId: post_getalertsblackout
