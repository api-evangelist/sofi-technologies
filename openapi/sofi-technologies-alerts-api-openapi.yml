                  type: string
                  description: 'Account holder''s mobile phone number.

                    Pattern: Exactly 10 digits, no hyphens or other characters

                    Example: `"8013656050"`'
                  example: '8013656050'
                mobileCarrierId:
                  type: integer
                  format: int32
                  description: 'Account holder''s mobile carrier. Configurable list.

                    Pattern: Configurable list

                    Example: `8`'
                  example: 8
                actionType:
                  type: string
                  enum:
                  - E
                  - U
                  - F
                  - C
                  - S
                  description: 'Type of action to perform. See the <a href="ref:api-reference-on-demand-alert-statuses" target="_blank">On-Demand Alert Statuses</a> enumeration for valid values.

                    Pattern: One character

                    Example: `"E"`'
                  example: E
                verificationPin:
                  type:
                  - string
                  - 'null'
                  minimum: 4
                  maximum: 4
                  pattern: ^[0-9]*$
                  description: 'When `actionType: C`, this value will be validated against what was sent to the cardholder via text message.

                    Pattern: 4-digit string

                    Example: `"1234"`'
                  example: '1234'
