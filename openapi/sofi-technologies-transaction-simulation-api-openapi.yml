openapi: 3.2.0
info:
  title: Program Transaction Simulation API
  version: '4.0'
servers:
- url: api-{corename}.{env}.gpsrv.com/intserv/4.0/
tags:
- name: Transaction Simulation
paths:
  /createSimulatedCardAuth:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      parameters: []
      tags:
      - Transaction Simulation
      description: 'Use the Create Simulated Card Authorization endpoint to simulate a card authorization in the > environment. This endpoint creates but does not settle a card authorization for the account and returns a response code and its description with the `auth_id`.

        - Capture the `auth_id` to settle the transaction with Create Simulated Card Settlement.

        - For instructions on using this endpoint see Simulating Card Transactions.


        [block:callout]


        {

        "type": "warning",

        "title": "Warning",

        "body": "This endpoint does not support XML responses. If you pass `response-content-type: xml`, it will be ignored."

        }

        [/block]


        [block:callout]


        {

        "type": "warning",

        "title": "Warning",

        "body": "Do not use this endpoint in >."

        }

        [/block]'
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A Galileo-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      auth_response_code:
                        type: string
                        description: A code used to give the status of the simulated auth
                      auth_response_description:
                        type: string
                        description: A description of the authorization response
                      auth_id:
                        type: string
                        description: An ID associated with the simulated auth
                    required:
                    - auth_id
                    - auth_response_code
                    - auth_response_description
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"system_timestamp\": \"2025-07-16 12:11:03\",\n    \"response_data\": {\n        \"auth_response_code\": \"00\",\n        \"auth_response_description\": \"Success\",\n        \"auth_id\": 937\n    },\n    \"processing_time\": 1.095,\n    \"echo\": {\n        \"transaction_id\": \"ae72d29061b14bf09c2c863c0affa86d\",\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": \"None\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\"\n}"
          description: ''
      summary: Create Simulated Card Authorization
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by Galileo.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by Galileo.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                providerId:
                  type: integer
                  description: 'Galileo-issued provider identifier.

                    Pattern: Max 10 digits

                    Example: `9999`'
                transactionId:
                  type: integer
                  description: 'A unique provider-generated ID to identify this API call. A UUID is preferred.

                    Pattern: 60 characters or less

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                accountNo:
                  type: string
                  description: 'The <<glossary:PRN>> or <<glossary:PAN>> of the account.

                    Pattern: PAN or PRN

                    Example: `"074103447228"`'
                amount:
                  type: number
                  description: 'The amount of the transaction in the currency at the point of sale.

                    Pattern: Positive integer or decimal number

                    Example: `100.00`, `100`, or `100.73`'
                association:
                  type: string
                  description: 'Specifies which card network to simulate: `visa` (Visa), `mc_auth` (Mastercard Credit).<!--`mc_debit` (Mastercard Debit), `star` (STAR), `coop` (Co-op), `visa_baseii` (Visa Base II), or `allpoint` (Allpoint).-->

                    Pattern: string

                    Example: `"visa"`'
                merchantName:
                  type: string
                  description: 'Simulated merchant name. Pass 40 characters for the complete string or pass up to 22 characters and the simulator will add 18 characters of a simulated address. For settlements, this parameter is **required** when `authId` is not populated.

                    Pattern: Max 40 alphanumeric characters

                    Example: `"Fred Jones Bagels"`'
                acquirerId:
                  type: string
                  description: 'Simulated acquirer ID. If this value is not passed, the simulator inserts a random 6-digit number.

                    Pattern: 6-digit number

                    Example: `437723`'
                terminalId:
                  type: string
                  description: 'Simulated terminal ID. If this value is not passed, the simulator inserts a random 8-digit number.

                    Pattern: 8-digit number

                    Example: `57395783`'
                merchantId:
                  type: string
                  description: 'Simulated merchant ID. If this value is not passed, the simulator inserts a random 15-character alphanumeric string.

                    Pattern: Max 15 alphanumeric characters

                    Example: `"asdf45sdf6sd3d0a"`'
                currencyCode:
                  type: string
                  description: 'The currency code for `amount`. Use ISO 4217 numeric currency codes. This parameter is required when using this endpoint outside the United States.

                    Pattern: 3 digits

                    Example: `"840"`'
                settleAmount:
                  type: number
                  description: 'The amount to be transferred from merchant to issuer in the settlement currency. Required when `currencyCode` differs from the account currency, or when `specialFunctions: make_multicurrency`.

                    Pattern: Positive integer or decimal number

                    Example: `100.00`, `100`, or `100.73`'
                settleCurrencyCode:
                  type: string
                  description: 'The currency code for `settleAmount`. Use ISO 4217 numeric currency codes. Required when `currencyCode` differs from the account currency, or when `specialFunctions: make_multicurrency`.

                    Pattern: 3 digits

                    Example: `"124"`'
                cardBillingAmount:
                  type: number
                  description: 'The amount that will be posted to the cardholder account in the currency of the account. Required when `currencyCode` differs from the account currency, or when `specialFunctions: make_multicurrency`.

                    Pattern: Positive integer or decimal number

                    Example: `100.00`, `100`, or `100.73`'
                cardBillingCurrencyCode:
                  type: string
                  description: 'The currency code for `cardBillingAmount`. Use ISO 4217 numeric currency codes. Required when `currencyCode` differs from the account currency, or when `specialFunctions: make_multicurrency`.

                    Pattern: 3 digits

                    Example: `484`'
                mcc:
                  type: string
                  description: 'ISO 18245 merchant category code.

                    Pattern: 4 digits

                    Example: `3408`'
                originalAuthId:
                  type: string
                  description: 'The `auth_id` of the previous authorization in a series, such as with a completion, reversal or incremental authorization. Required when `transType` is `3`, `4`, `5` or `6` (Visa) or `3` (Mastercard) or `4`, `5`, `6` (Star).

                    Pattern: Numerals

                    Example: `30582`'
                specialFunctions:
                  type: string
                  description: "Additional function to add to the simulated transaction. See the <a href=\"ref:api-reference-special-functions\" target=\"_blank\">Special Functions</a> enumeration for valid values. \nPattern: Max 100 characters\nExample `\"add_cashback\"`"
                posEntryMode:
                  type: string
                  description: 'The first two characters of DE022. Specifies how the PAN was entered, such as magnetic stripe, EMV chip or contactless. See <a href="ref:api-reference-de022-codes" target="_blank">DE022 Codes</a> for possible values. Valid only when `association: visa`.

                    Pattern: 2 characters

                    Example: `01`'
                requesterId:
                  type: string
                  description: 'An identifier for the entity that makes a tokenization request. Required when `specialFunctions: make_tokenized`.

                    Pattern: Numerals

                    Example: `3030303`'
                walletId:
                  type: string
                  description: 'Identifier for the mobile wallet that contains the card that was used for the transaction. Required when `association: mc_auth` and `specialFunctions: make_tokenized`.

                    Pattern: Numerals

                    Example: `474747474`'
                latitudeAndLongitude:
                  type: string
                  description: 'The latitude and longitude of the point of sale. Valid only when `association: visa` and `transType: 17`. Default: `40.76078/-111.89105` (Salt Lake City, UT)

                    Pattern: 99.99999/-99.99999

                    Example: `"40.76078/-111.89105"`'
                partialAmount:
                  type: number
                  description: "Amount of a partial authorization.  Valid only when `association: mc_auth` and `specialFunctions: make_partial_reversal`. \nPattern: Integer or decimal amount\nExample:  `100.00`, `100`, or `100.73`"
                partialForeignAmount:
                  type: number
                  description: 'Amount of a partial authorization when the point of sale is a different country than the account. Valid only when `association: mc_auth` and `specialFunctions: make_partial_reversal`.

                    Pattern: Integer or decimal amount

                    Example:  `100.00`, `100`, or `100.73`'
                cashbackAmount:
                  type: number
                  description: 'Amount in `localAmt` that is provided in cash. Valid only when `association: mc_auth` and `specialFunctions: make_cashback`. Debit accounts only.

                    Pattern: Integer or decimal amount

                    Example: `100.00`, `100`, or `100.73`'
                cashAdvanceAmount:
                  type: number
                  description: 'Amount in `localAmt` that is provided in cash. Valid only when `association: mc_auth` and `specialFunctions: make_cashback`.  Credit accounts only.

                    Pattern: Positive integer or decimal number

                    Example: `100.00`, `100`, or `100.73`'
                pin:
                  type: string
                  description: 'To include the PIN that is already set for the card, leave this value blank and pass `specialFunctions: add_pin` (Visa) or `specialFunctions: make_debit` (Mastercard). Pass a value for this parameter to use that value in the request and also to change the PIN for the card.

                    Pattern: 4 digits

                    Example: `4395`'
                transType:
                  type: integer
                  description: 'The type of transaction to simulate. See the <a href="ref:api-reference-simulated-transaction-types" target="_blank">Simulated Transaction Types</a> enumeration for valid values.

                    Pattern: 1 or 2 digits

                    Example: `3`'
              required:
              - providerId
              - transactionId
              - accountNo
              - amount
              - association
              - merchantName
              - apiLogin
              - apiTransKey
      operationId: post_createsimulatedcardauth
  /createSimulatedCardSettle:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      parameters: []
      tags:
      - Transaction Simulation
      description: 'Use the Create Simulated Card Settlement endpoint to settle a simulated card authorization in the > environment. First, create a simulated authorization using the Create Simulated Card Authorization endpoint, and then use this endpoint to settle it.

        - If `authId` is not populated, then `merchantName` is **required**. Populate `merchantName` but not `authId` to simulate a force-posted transaction.

        - For instructions on using this endpoint see Simulating Card Transactions.


        [block:callout]


        {

        "type": "warning",

        "title": "Warning",

        "body": "This endpoint does not support XML responses. If you pass `response-content-type: xml`, it will be ignored."

        }

        [/block]


        [block:callout]


        {

        "type": "warning",

        "title": "Warning",

        "body": "Do not use this endpoint in >."

        }

        [/block]'
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A Galileo-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      settle_response_code:
                        type: string
                        description: A code used to give the status of the simulated auth settlement
                      settle_response_description:
                        type: string
                        description: A description of the settlement response
                      settle_dtl:
                        type: string
                        description: An ID associated with the simulated settlement
                    required:
                    - settle_dtl
                    - settle_response_code
                    - settle_response_description
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"system_timestamp\": \"2025-07-16 12:16:11\",\n    \"response_data\": {\n        \"settle_response_code\": \"00\",\n        \"settle_response_description\": \"Success\",\n        \"settle_dtl_id\": 408\n    },\n    \"processing_time\": 1.082,\n    \"echo\": {\n        \"transaction_id\": \"470cfabf70ca4731970470feaf4757d8\",\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": \"None\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\"\n}"
          description: ''
      summary: Create Simulated Card Settlement
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by Galileo.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by Galileo.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                providerId:
                  type: integer
                  description: 'Galileo-issued provider identifier.

                    Pattern: Max 10 digits

                    Example: `9999`'
                transactionId:
                  type: integer
                  description: 'A unique provider-generated ID to identify this API call. A UUID is preferred.

                    Pattern: 60 characters or less

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                accountNo:
                  type: string
                  description: 'The <<glossary:PRN>> or <<glossary:PAN>> of the account.

                    Pattern: PAN or PRN

                    Example: `"074103447228"`'
                amount:
                  type: number
                  description: 'The amount of the transaction in the currency at the point of sale.

                    Pattern: Positive integer or decimal number

                    Example: `100.00`, `100`, or `100.73`'
                association:
                  type: string
                  description: 'Specifies which card network to simulate: `visa` (Visa), `mc_auth` (Mastercard Credit).<!--`mc_debit` (Mastercard Debit), `star` (STAR), `coop` (Co-op), `visa_baseii` (Visa Base II), or `allpoint` (Allpoint).-->

                    Pattern: string

                    Example: `"visa"`'
                merchantName:
                  type: string
                  description: 'Simulated merchant name. Pass 40 characters for the complete string or pass up to 22 characters and the simulator will add 18 characters of a simulated address. For settlements, this parameter is **required** when `authId` is not populated.

                    Pattern: Max 40 alphanumeric characters

                    Example: `"Fred Jones Bagels"`'
                currencyCode:
                  type: string
                  description: 'The currency code for `amount`. Use ISO 4217 numeric currency codes. This parameter is required when using this endpoint outside the United States.

                    Pattern: 3 digits

                    Example: `"840"`'
                settleAmount:
                  type: number
                  description: 'The amount to be transferred from merchant to issuer in the settlement currency. Required when `currencyCode` differs from the account currency, or when `specialFunctions: make_multicurrency`.

                    Pattern: Positive integer or decimal number

                    Example: `100.00`, `100`, or `100.73`'
                settleCurrencyCode:
                  type: string
                  description: 'The currency code for `settleAmount`. Use ISO 4217 numeric currency codes. Required when `currencyCode` differs from the account currency, or when `specialFunctions: make_multicurrency`.

                    Pattern: 3 digits

                    Example: `"124"`'
                cardBillingAmount:
                  type: number
                  description: 'The amount that will be posted to the cardholder account in the currency of the account. Required when `currencyCode` differs from the account currency, or when `specialFunctions: make_multicurrency`.

                    Pattern: Positive integer or decimal number

                    Example: `100.00`, `100`, or `100.73`'
                cardBillingCurrencyCode:
                  type: string
                  description: 'The currency code for `cardBillingAmount`. Use ISO 4217 numeric currency codes. Required when `currencyCode` differs from the account currency, or when `specialFunctions: make_multicurrency`.

                    Pattern: 3 digits

                    Example: `484`'
                authId:
                  type: string
                  description: 'The authorization ID (`auth_id`) as returned by the <a href="ref:post_createsimulatedcardauth" target="_blank">Create Simulated Card Authorization</a> endpoint. If this parameter is not populated then `merchantName` is **required**.

                    Pattern: Positive integer

                    Example: `58344373`'
              required:
              - providerId
              - transactionId
              - accountNo
              - amount
              - association
              - merchantName
              - apiLogin
              - apiTransKey
      operationId: post_createsimulatedcardsettle
  /createSimulatedAchTransaction:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      parameters: []
      tags:
      - Transaction Simulation
      description: 'Use the Create Simulated Incoming ACH Transaction endpoint to simulate an incoming ACH transaction in the > environment. This endpoint creates a pending transaction, defined by the template name and template values passed in the request, and returns an ACH transaction ID.


        For instructions on using this endpoint, see Simulating Incoming ACH Transactions.


        [block:callout]


        {

        "type": "warning",

        "title": "Warning",

        "body": "This endpoint does not support XML responses. If you pass `response-content-type: xml`, it will be ignored."

        }

        [/block]


        [block:callout]


        {

        "type": "warning",

        "title": "Warning",

        "body": "Do not use this endpoint in >."

        }

        [/block]'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by Galileo.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by Galileo.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                providerId:
                  type: integer
                  description: 'Galileo-issued provider identifier.

                    Pattern: Max 10 digits

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
                  x-minimum: 1
                  x-maximum: 60
                  description: 'A unique provider-generated ID to identify this API call. A UUID is preferred.

                    Pattern: 60 characters or less

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                templateName:
                  type: string
                  enum:
                  - ManualReviewNameMatching
                  - CreditsAndDebits
                  description: 'Name of the template that determines which template values are required to simulate an incoming ACH transaction.

                    Pattern: `"CreditsAndDebits"` or `"ManualReviewNameMatching"`

                    Example: `"CreditsAndDebits"`'
                  example: CreditsAndDebits
                templateValues:
                  type: string
                  description: 'JSON array containing the required metadata. See <a href="ref:api-reference-incoming-ach-simulation-payload-values" target="_blank">Incoming ACH Simulation Payload Values</a> for the fields to include.

                    Pattern: JSON string

                    Example: Refer to <a href="ref:api-reference-incoming-ach-simulation-payload-values#example-templatevalues-string" target="_blank">Example `templateValues` string</a>.'
                  example: '{"transactionType":"credit","companyName":"Your Company","referenceCode":"92443671","identificationNumber":"789654","effectiveEntryDate":"330212","destinationBankName":"Chase","destinationRoutingNumber":"987654321123","destinationAccountNumber":"987654321123","originBankName":"Bank of America","originRoutingNumber":"124001545","amount":"100","companyEntryDescription":"Subscribe","receiverName": "John Doe","standardEntryClassCode":"CCD","accountType":"checking"}'
              required:
              - providerId
              - templateName
              - templateValues
              - transactionId
              - apiLogin
              - apiTransKey
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A Galileo-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      ach_transaction_id:
                        type: integer
                        description: Unique identifier for the ACH transaction.
                    required:
                    - ach_transaction_id
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.051,\n    \"response_data\": {\n        \"ach_transaction_id\": 1152\n    },\n    \"echo\": {\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": null,\n        \"transaction_id\": \"d06ee89c-984b-4628-8b54-cfd672b021b7\"\n    },\n    \"system_timestamp\": \"2023-05-30 13:52:08\",\n    \"rtoken\": \"0fca914b-2669-48cd-97e8-f247669a6034\"\n }"
          description: ''
      summary: Create Simulated Incoming ACH Transaction
      operationId: post_createsimulatedachtransaction
  /cancelSimulatedAchTransaction:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      parameters: []
      tags:
      - Transaction Simulation
      description: 'Use the Cancel Simulated Incoming ACH Transaction endpoint to cancel a simulated ACH transaction that you created with the Create Simulated Incoming ACH Transaction endpoint. Pass the `ach_transaction_id` that was returned in the response. You cannot cancel the transaction after it has been processed.


        For instructions on using this endpoint, see Simulating Incoming ACH Transactions.


        [block:callout]


        {

        "type": "warning",

        "title": "Warning",

        "body": "This endpoint does not support XML responses. If you pass `response-content-type: xml`, it will be ignored."

        }

        [/block]


        [block:callout]


        {

        "type": "warning",

        "title": "Warning",

        "body": "Do not use this endpoint in >."

        }

        [/block]'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by Galileo.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
