openapi: 3.2.0
info:
  title: Program Account-Level Controls API
  version: '4.0'
servers:
- url: api-{corename}.{env}.gpsrv.com/intserv/4.0/
tags:
- name: Account-Level Controls
paths:
  /setAccountLevelAuthControl:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      description: 'Use the Set Account-Level Auth Control endpoint to create or modify an account-level velocity control. Prior to calling this endpoint, call Get Auth Control to get the `controlId` for the control to set or modify. See Set Velocity Controls for instructions on using this endpoint.


        To update existing velocity ALCs, see Updating velocity ALCs.'
      operationId: post_setaccountlevelauthcontrol
      parameters: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                accountNo:
                  description: 'The <<glossary:PRN>> for the account. Do not use the <<glossary:CAD>> or <<glossary:PAN>>.

                    Pattern: 12-digit numeric string

                    Example: `"344101254935"`'
                  example: '344101254935'
                  pattern: ^.+$
                  type: string
                amount:
                  description: 'The amount of the new limit. If this parameter is not populated when creating a new control, then `transactionCount` is required

                    Pattern: Decimal number (14, 2)

                    Example: `500.00`'
                  example: 500
                  type:
                  - number
                  - 'null'
                apiLogin:
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                  type: string
                apiTransKey:
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                  type: string
                controlId:
                  description: 'The control ID of the velocity control to set or modify, as returned by <a href="ref:post_getauthcontrol" target="_blank">Get Auth Control</a>.

                    Pattern: Integer, max  18 digits

                    Example: 10492'
                  example: 10492
                  type: integer
                endDate:
                  description: "End date-time for the control. Must be later than `startDate`. Cannot be in the past. Default: `3000-01-01 00:00:00`. \nPattern: YYYY-MM-DD hh:mm:ss or YYYY-MM-DD\nExample: `\"2022-03-10 23:59:59\"`"
                  example: '2024-03-10 23:59:59'
                  format: date
                  type:
                  - string
                  - 'null'
                mccControls:
                  description: 'A list of one or more MCC ranges, including standalone values, to apply the velocity control to. Format is `[''XXXX'', ''YYYY-ZZZZ'', ''AAAA-BBBB'']`. When updating a velocity control with an MCC range, specify the entire range: `[''YYYY-ZZZZ'']`. Max 100 ranges.

                    Pattern: List of MCCs either alone or in a range.

                    Example: `[''2000'', ''3000-3999'', ''4567'']`'
                  example:
                  - '2000'
                  - 0900-3000
                  - '4567'
                  items:
                    pattern: ^(?!(?:0000)$)\d{4}-(?!(?:0000)$)\d{4}|(?!(?:0000)$)\d{4}$
                    type: string
                  maxItems: 100
                  minItems: 1
                  type:
                  - array
                  - 'null'
                startDate:
                  description: "Start date-time for the control. Can be set up to six months in the future. Cannot be in the past. Must be earlier than `endDate`. Default: Current <a href=\"ref:system-time\" target=\"_blank\">system time</a> \nPattern: YYYY-MM-DD hh:mm:ss or YYYY-MM-DD\nExample: `\"2022-03-03 00:00:00\"`"
                  example: '2024-03-03 00:00:00'
                  format: date
                  type:
                  - string
                  - 'null'
                transactionCount:
                  description: 'New number of transactions to permit. If this parameter is not populated when creating a new control, then `amount` is required.

                    Pattern: Integer, maximum 18 digits

                    Example: `5`'
                  example: 5
                  type:
                  - integer
                  - 'null'
                transactionId:
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                  maxLength: 60
                  minLength: 1
                  type: string
              required:
              - accountNo
              - controlId
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  echo:
                    anyOf:
                    - additionalProperties: false
                      properties:
                        provider_timestamp:
                          description: Store a related timestamp for reporting and troubleshooting purposes
                          format: date-time
                          type:
                          - string
                          - 'null'
                        provider_transaction_id:
                          description: Secondary transaction identifier (generated by a provider)
                          type:
                          - string
                          - 'null'
                        transaction_id:
                          description: An ID that represents an API transaction
                          type:
                          - string
                          - 'null'
                      required:
                      - provider_timestamp
                      - provider_transaction_id
                      - transaction_id
                      type: object
                    - type:
                      - object
                      - 'null'
                    description: A structure that contains transaction ID information
                  errors:
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                    type: array
                  processing_time:
                    description: The time elapsed in processing the transaction
                    type:
                    - number
                    - 'null'
                  response_data:
                    description: A structure for the response data. This endpoint does not return response data, so it will always be empty.
                    additionalProperties: false
                    properties: {}
                    type: object
                  rtoken:
                    description: A system-generated ID used for tracking
                    type:
                    - string
                    - 'null'
                  status:
                    description: The condition of a process or response
                    type:
                    - string
                    - 'null'
                  status_code:
                    description: The response status code. May return a string for some statuses.
                    type:
                    - integer
                    - 'null'
                  system_timestamp:
                    description: A system generated timestamp
                    format: date-time
                    type:
                    - string
                    - 'null'
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
                type: object
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.111,\n    \"response_data\": [],\n    \"echo\": {\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": null,\n        \"transaction_id\": \"bbe1dd0a-9ae5-4a98-9626-66997d9e250f\"\n    },\n    \"system_timestamp\": \"2024-03-10 10:57:04\",\n    \"rtoken\": \"893003ca-7bc5-4fa6-84c5-0b533e376322\"\n}\n"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<root>\n   <echo>\n      <provider_timestamp null=\"true\" />\n      <provider_transaction_id />\n      <transaction_id>bbe1dd0a-9ae5-4a98-9626-66997d9e250f</transaction_id>\n   </echo>\n   <processing_time>0.111</processing_time>\n   <response_data />\n   <rtoken>893003ca-7bc5-4fa6-84c5-0b533e376322</rtoken>\n   <status>Success</status>\n   <status_code>0</status_code>\n   <system_timestamp>2024-03-10 10:57:04</system_timestamp>\n</root>"
          description: Successful response
      summary: Set Account-Level Auth Control
      tags:
      - Account-Level Controls
  /getAuthControl:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      description: 'Use the Get Auth Control endpoint to retrieve the velocity control details and their control IDs—at either the product level or account level, with or without MCC ranges.


        See Retrieving velocity limits for instructions on using this endpoint.'
      operationId: post_getauthcontrol
      parameters: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                accountNo:
                  description: 'The <<glossary:PRN>> for the account. Do not use the <<glossary:CAD>> or <<glossary:PAN>>. Pass this value to retrieve all of the account-level velocity controls for this account. If this parameter is not populated then `prodId` must be populated.

                    Pattern: PRN (12-digit numeric string)

                    Example: `"344101254935"`'
                  example: '344101254935'
                  pattern: ^.+$
                  type:
                  - string
                  - 'null'
                apiLogin:
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                  type: string
                apiTransKey:
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                  type: string
                beginningMcc:
                  description: 'The start of the MCC range for the control. If this parameter is populated, then `endMcc` and `accountNo` must be populated.

                    Pattern: 3–4 digit integer, no leading zero

                    Example: 3000'
                  example: 3000
                  maximum: 1000000000000000000
                  minimum: 1
                  type:
                  - integer
                  - 'null'
                controlId:
                  description: 'The system-generated identifier for the auth-level velocity control. When this parameter is populated then either `prodId` or `accountNo` must also be populated.

                    Pattern: Integer, max 18 digits

                    Example: 102'
                  example: 102
                  type:
                  - integer
                  - 'null'
                endMcc:
                  description: 'The end of the MCC range for the control. If this parameter is populated, then `beginningMcc` and `accountNo` must be populated.

                    Pattern: 3–4 digit integer, no leading zero

                    Example: 3999'
                  example: 3999
                  maximum: 1000000000000000000
                  minimum: 1
                  type:
                  - integer
                  - 'null'
                prodId:
                  description: "The system-generated identifier for the product. Pass this value to retrieve all of the product-level velocity controls for this product. If this parameter is not populated then `accountNo` must be populated. \nPattern: Integer\nExample: `15293`"
                  example: 15293
                  type:
                  - integer
                  - 'null'
                transactionId:
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                  maxLength: 60
                  minLength: 1
                  type: string
              required:
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  echo:
                    anyOf:
                    - additionalProperties: false
                      properties:
                        provider_timestamp:
                          description: Store a related timestamp for reporting and troubleshooting purposes
                          format: date-time
                          type:
                          - string
                          - 'null'
                        provider_transaction_id:
                          description: Secondary transaction identifier (generated by a provider)
                          type:
                          - string
                          - 'null'
                        transaction_id:
                          description: An ID that represents an API transaction
                          type:
                          - string
                          - 'null'
                      required:
                      - provider_timestamp
                      - provider_transaction_id
                      - transaction_id
                      type: object
                    - type:
                      - object
                      - 'null'
                    description: A structure that contains transaction ID information
                  errors:
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                    type: array
                  processing_time:
                    description: The time elapsed in processing the transaction
                    type:
                    - number
                    - 'null'
                  response_data:
                    anyOf:
                    - additionalProperties: false
                      properties:
                        auth_controls:
                          description: List of auth controls
                          items:
                            additionalProperties: false
                            properties:
                              amount:
                                description: Total transaction amount allowed per period.
                                type: number
                              amount_available:
                                description: Transaction amount available in the current period.
                                type: number
                              amount_used:
                                description: Transaction amount used in the current period.
                                type: number
                              beginning_mcc:
                                description: The initial MCC value for the range of this control. This field is present only when MCCs are specified for the control.
                                type: integer
                              control_desc:
                                description: Description of the velocity control.
                                type: string
                              control_id:
                                description: The identifier for the specific velocity control.
                                type: integer
                              domestic_flag:
                                description: Whether this velocity control applies to domestic transactions, international transactions or both. **Y**—Domestic only; **N**—International only; **A**—Both
                                type: string
                              end_date:
                                description: Ending date-time of the account-level velocity control. Not populated for product-level controls.
                                format: date-time
                                type: string
                              end_mcc:
                                description: The final MCC value for the range of this control. This field is present only when MCCs are specified for the control.
                                type: integer
                              has_pin:
                                description: Whether the limit applies to PIN transactions, signature transactions or both. **Y**—PIN only; **N**—Signature only; **A**—Both
                                type: string
                              period:
                                description: Timespan for the velocity control. xD (x days), xM (x months), 1T (one transaction).
                                type: string
                              start_date:
                                description: Starting date-time of the account-level velocity control. Not populated for product-level controls.
                                format: date-time
                                type: string
                              trans_type:
                                description: 'Type of transaction affected by the control: ATM, CAD, CBA, POS, VFT.'
                                type: string
                              transaction_count:
                                description: Number of allowed transactions per period.
                                type: integer
                              transaction_count_available:
                                description: Number of transactions available in the current period.
                                type: integer
                              transaction_count_used:
                                description: Number of transactions used in the current period.
                                type: integer
                            type: object
                          type: array
                        pmt_ref_no:
                          description: PRN. This field is populated when returning account-level velocity controls.
                          type: string
                        prod_id:
                          description: This field is populated when returning product-level velocity controls.
                          type: string
                      required:
                      - auth_controls
                      type: object
                    - type:
                      - object
                      - 'null'
                    description: A structure for the response data. It can be empty but usually will contain information.
                  rtoken:
                    description: A system-generated ID used for tracking
                    type:
                    - string
                    - 'null'
                  status:
                    description: The condition of a process or response
                    type:
                    - string
                    - 'null'
                  status_code:
                    description: The response status code. May return a string for some statuses.
                    type:
                    - integer
                    - 'null'
                  system_timestamp:
                    description: A system generated timestamp
                    format: date-time
                    type:
                    - string
                    - 'null'
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
                type: object
              examples:
                response:
                  value: "{\n  \"status_code\": 0,\n  \"status\": \"Success\",\n  \"processing_time\": 0.119,\n  \"response_data\": {\n      \"auth_controls\": [\n          {\n              \"control_id\": 1, \n              \"amount\": 1000, \n              \"transaction_count\": 6, \n              \"start_date\": \"2024-03-10 13:00:00\", \n              \"end_date\": \"3000-01-01 00:00:00\", \n              \"trans_type\": \"ATM\", \n              \"period\": \"1D\", \n              \"domestic_flag\": \"Y\", \n              \"has_pin\": \"A\",\n              \"control_desc\": \"ATM Daily Limit, Domestic\",\n              \"amount_used\": 500,\n              \"amount_available\": 500,\n              \"transaction_count_used\": null,\n              \"transaction_count_available\": null\n          }, \n          {\n              \"control_id\": 2, \n              \"amount\": 600, \n              \"transaction_count\": 24, \n              \"start_date\": \"2024-03-17 00:00:00\", \n              \"end_date\": \"2024-03-24 23:59:59\", \n              \"trans_type\": \"ATM\", \n              \"period\": \"1D\", \n              \"domestic_flag\": \"N\", \n              \"has_pin\": \"A\",\n              \"control_desc\": \"ATM Daily Limit, International\",\n              \"amount_used\": 200,\n              \"amount_available\": 400,\n              \"transaction_count_used\": null,\n              \"transaction_count_available\": null\n          }, \n          {\n              \"control_id\": 3, \n              \"amount\": 500, \n              \"transaction_count\": 3, \n              \"start_date\": \"2024-03-10 13:00:00\", \n              \"end_date\": \"2024-03-10 14:00:00\", \n              \"trans_type\": \"ATM\", \n              \"period\": \"1T\", \n              \"domestic_flag\": \"A\", \n              \"has_pin\": \"A\",\n              \"control_desc\": \"Per-transaction ATM Limit\",\n              \"amount_used\": 100,\n              \"amount_available\": 0,\n              \"transaction_count_used\": null,\n              \"transaction_count_available\": null\n          },\n          {\n              \"control_id\": 4, \n              \"amount\": 2000, \n              \"transaction_count\": 24, \n              \"start_date\": \"2024-03-10 13:00:00\", \n              \"end_date\": \"3000-01-01 00:00:00\", \n              \"trans_type\": \"POS\", \n              \"period\": \"7D\", \n              \"domestic_flag\": \"A\", \n              \"has_pin\": \"A\",\n              \"control_desc\": \"Weekly POS Limit\",\n              \"amount_used\": 500,\n              \"amount_available\": 1500,\n              \"transaction_count_used\": null,\n              \"transaction_count_available\": 24\n          },\n          {\n              \"control_id\": 4, \n              \"beginning_mcc\": 5541,\n              \"end_mcc\": 5542,\n              \"amount\": 300, \n              \"transaction_count\": 10, \n              \"start_date\": \"2024-03-10 13:00:00\", \n              \"end_date\": \"3000-01-01 00:00:00\", \n              \"trans_type\": \"POS\", \n              \"period\": \"7D\", \n              \"domestic_flag\": \"A\", \n              \"has_pin\": \"A\",\n              \"control_desc\": \"Weekly POS Limit\",\n              \"amount_used\": 100,\n              \"amount_available\": 200,\n              \"transaction_count_used\": 0,\n              \"transaction_count_available\": 10\n          },\n         {\n              \"control_id\": 4, \n              \"beginning_mcc\": 3000,\n              \"end_mcc\": 3299,\n              \"amount\": 1500, \n              \"transaction_count\": 1, \n              \"start_date\": \"2024-03-10 13:00:00\", \n              \"end_date\": \"3000-01-01 00:00:00\", \n              \"trans_type\": \"POS\", \n              \"period\": \"7D\", \n              \"domestic_flag\": \"A\", \n              \"has_pin\": \"A\",\n              \"control_desc\": \"Weekly POS Limit\",\n              \"amount_used\": 600,\n              \"amount_available\": 900,\n              \"transaction_count_used\": 1,\n              \"transaction_count_available\": 0\n          },\n          {\n              \"control_id\": 5, \n              \"amount\": 10000, \n              \"transaction_count\": 40, \n              \"start_date\": \"2024-03-10 13:00:00\", \n              \"end_date\": \"2024-03-31 23:59:59\", \n              \"trans_type\": \"POS, ATM, CAD, CBD\", \n              \"period\": \"1M\", \n              \"domestic_flag\": \"A\", \n              \"has_pin\": \"A\",\n              \"control_desc\": \"Monthly Combined Limit\",\n              \"amount_used\": 700,\n              \"amount_available\": 1300,\n              \"transaction_count_used\": 14,\n              \"transaction_count_available\": 26\n          },\n          {\n              \"control_id\": 5, \n              \"beginning_mcc\": 5812,\n              \"end_mcc\": 5814,\n              \"amount\": 1000, \n              \"transaction_count\": \"None\", \n              \"start_date\": \"2024-03-10 13:00:00\", \n              \"end_date\": \"3000-01-01 00:00:00\", \n              \"trans_type\": \"POS, ATM, CAD, CBD\", \n              \"period\": \"1M\", \n              \"domestic_flag\": \"A\", \n              \"has_pin\": \"A\",\n              \"control_desc\": \"Monthly Combined Limit\",\n              \"amount_used\": 300,\n              \"amount_available\": 700,\n              \"transaction_count_used\": null,\n              \"transaction_count_available\": null\n          },\n      ], \n  \"pmt_ref_no\": \"777777777777\"\n  }, \n  \"echo\": {\n  \"provider_transaction_id\": \"\", \n  \"provider_timestamp\": \"None\", \n  \"transaction_id\": \"JXVANPHRZ1S726826FC5\"\n  }\n}"
            application/xml:
              examples:
                response:
