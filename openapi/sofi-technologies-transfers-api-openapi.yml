openapi: 3.2.0
info:
  title: Payment Hub Api 2.0 Transfers API
  version: '1.0'
servers:
- url: '{corename}.payment-hub.{env}.gpsrv.com/payment-hub/1.0/'
tags:
- name: Transfers
paths:
  /createTransfer:
    post:
      tags:
      - Transfers
      summary: Create Transfer
      description: '> 👍 Availability

        >

        >Some of the field descriptions for this endpoint reference FedNow or Fedwire, which are future capabilities not yet available for clients.


        Use the Create Transfer endpoint to move funds between a source account and a destination account. You can use an active account link that was created by Create External Account Link or create a new one via the request.


        For card transfers, the referenced external debit card link must have a validation status of `"PASSED"` before it can be used for transfers.


        For new transfers: Omit the `returnDetails` field.

        For payment returns: Include the `returnDetails` field with the original transaction reference.

        When `returnDetails` is present, the request initiates a return of the original transfer.'
      operationId: paymenthub_post_createtransfer
      parameters:
      - name: x-gft-idempotency-key
        in: header
        required: true
        schema:
          type: string
          format: uuid4
          title: X-Gft-Idempotency-Key
      - name: Authorization
        in: header
        required: true
        description: Basic authentication token (base64-encoded {apilogin}:{apitranskey} credentials provided by SoFi Tech Solutions)
        schema:
          type: string
          pattern: ^Basic [A-Za-z0-9+/]+=*$
          example: Basic eW91cl9hcGlsb2dpbjp5b3VyX2FwaXRyYW5za2V5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                accountNo:
                  type: string
                  title: Accountno
                  description: 'The <<glossary:PRN>> associated with this transfer.

                    Pattern: PRN

                    Example: `"074103447228"`'
                paymentMethod:
                  description: 'Payment network to use for the transfer.

                    Rail-specific validation: `CARD` requires the `sourceAccount` to be `GALILEO` and `creditOrDebit` to be `DEBIT` or `CREDIT`.

                    Example: `"CARD"`'
                  type: string
                  enum:
                  - ACH
                  - FEDNOW
                  - FEDWIRE
                  - CARD
                  title: PaymentRails
                currencyAmount:
                  description: Request-side currency amount. Raises BadRequestException (400) on invalid client input.
                  properties:
                    amount:
                      type: number
                      examples:
                      - 199.32
                    currency:
                      type: string
                      title: Currency
                      description: 'Currency code following ISO 4217 standard.

                        Validation: Exactly 3 uppercase letters.

                        Pattern: ^[A-Z]{3}$

                        Example: ''USD'' (US Dollar), ''EUR'' (Euro), ''GBP'' (British Pound)'
                      default: USD
                      examples:
                      - USD
                  type: object
                  required:
                  - amount
                  title: CurrencyAmount
                creditOrDebit:
                  description: 'Posting type indicating debit or credit.


                    - DEBIT: Debit transaction (funds withdrawn)

                    - CREDIT: Credit transaction (funds deposited)'
                  type: string
                  enum:
                  - DEBIT
                  - CREDIT
                  title: PostingType
                sourceAccount:
                  description: 'Identifies the account''s role in the transaction.


                    If used as the **sourceAccount**, this is the account being debited. For push transfers (withdrawals), use the

                    SoFi Tech Solutions account; for pull transfers (deposits), use the linked external account.


                    If used as the **destinationAccount**, this is the account being credited. For push transfers, use the linked

                    external account; for pull transfers, use the SoFi Tech Solutions account.'
                  properties:
                    type:
                      description: Indicates the account category.
                      enum:
                      - GALILEO_ACCOUNT
                      - EXTERNAL_ACCOUNT_REFERENCE
                      - EXTERNAL_ACCOUNT_LINK_REQUEST
                      - LEGACY
                      title: AccountType
                      type: string
                  required:
                  - type
                  title: AccountReferenceBase
                  type: object
                  discriminator:
                    propertyName: type
                    mapping:
                      EXTERNAL_ACCOUNT_LINK_REQUEST: '#/components/schemas/AccountRequest'
                      EXTERNAL_ACCOUNT_REFERENCE: '#/components/schemas/ExternalAccountReference'
                      GALILEO_ACCOUNT: '#/components/schemas/GalileoAccount'
                destinationAccount:
                  description: 'Identifies the account''s role in the transaction.


                    If used as the **sourceAccount**, this is the account being debited. For push transfers (withdrawals), use the

                    SoFi Tech Solutions account; for pull transfers (deposits), use the linked external account.


                    If used as the **destinationAccount**, this is the account being credited. For push transfers, use the linked

                    external account; for pull transfers, use the SoFi Tech Solutions account.'
                  properties:
                    type:
                      description: Indicates the account category.
                      enum:
                      - GALILEO_ACCOUNT
                      - EXTERNAL_ACCOUNT_REFERENCE
                      - EXTERNAL_ACCOUNT_LINK_REQUEST
                      - LEGACY
                      title: AccountType
                      type: string
                  required:
                  - type
                  title: AccountReferenceBase
                  type: object
                  discriminator:
                    propertyName: type
                    mapping:
                      EXTERNAL_ACCOUNT_LINK_REQUEST: '#/components/schemas/AccountRequest'
                      EXTERNAL_ACCOUNT_REFERENCE: '#/components/schemas/ExternalAccountReference'
                      GALILEO_ACCOUNT: '#/components/schemas/GalileoAccount'
                externalId:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Externalid
                  description: 'Client-defined identifier for tracking and reconciliation.

                    Pattern: Alphanumeric string

                    Example: `My-Internal-ID-123`'
                purpose:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Purpose
                  description: 'Reason for the transfer.

                    Pattern: Alphanumeric string

                    Validation:

                    - Default: Alphanumeric string

                    - FEDWIRE: Limited to alphanumeric and special characters: @&/\''"\`~()<>$#%+-={}*|[]^.,?!;:_

                    Example: "`Bill Payment`"'
                remittanceInfo:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Remittanceinfo
                  description: 'Additional details about the transfer, such as an invoice number.

                    Pattern: Alphanumeric string

                    Validation:

                    - Default: Alphanumeric string

                    - FEDWIRE: 1-140 characters, limited to alphanumeric and special characters: @&/\''"`~()<>$#%+-={}*|[]^.,?!;:_

                    Example: "`Invoice #456-ABC`"'
                returnDetails:
                  anyOf:
                  - properties:
                      code:
                        anyOf:
                        - type: string
                        - type: 'null'
                        title: Code
                        description: 'Reason code describing why the transaction was returned.

                          Validation:

                          - FEDNOW: Required. Uses ISO 20022 External Status Reason Codes (pacs.002 StsRsnInf/Rsn/Cd). Must be 1-4 characters. Common codes include AC01 (Incorrect account number), AC03 (Invalid creditor account number), AC04 (Closed account number), AC06 (Blocked account), AC13 (Invalid debtor account type), AC14 (Invalid agent), AC15 (Account details changed), AG01 (Transaction forbidden). Refer to ISO 20022 ExternalCodeSets for the complete list of reason codes.'
                        examples:
                        - AC03
                        - AC04
                      additionalInfo:
                        anyOf:
                        - type: string
                        - type: 'null'
                        title: Additionalinfo
                        description: 'Optional additional context for the return.

                          Validation:

                          - FEDNOW: Maximum 105 characters. Maps to ISO 20022 pacs.002 StsRsnInf/AddtlInf.'
                        examples:
                        - Account closed by customer request
                      originalTransactionId:
                        type: string
                        format: uuid
                        title: Originaltransactionid
                        description: Reference to the original transaction being returned (transferId).
                        examples:
                        - 123e4567-e89b-12d3-a456-426614174000
                    type: object
                    required:
                    - originalTransactionId
                    title: ReturnDetails
                    description: Payment return information for reversing a previous transfer.
                  - type: 'null'
                  description: 'Payment return information. If present, this request initiates a return/reversal of a previous transfer.


                    When provided, the following fields take on return-specific meanings:

                    - `currencyAmount`: The amount being returned (supports partial returns, must be less than or equal to the original amount)

                    - `sourceAccount`: Account initiating the return.

                    - `destinationAccount`: Account receiving the return.

                    - `paymentMethod`: Payment rail used for the return.


                    See `ReturnDetails` class documentation for additional return fields and requirements.'
                destinationEntities:
                  anyOf:
                  - properties:
                      instructedAgent:
                        anyOf:
                        - properties:
                            memberId:
                              anyOf:
                              - type: string
                              - type: 'null'
                              title: Memberid
                              description: 'Clearing system member identification number. Required if bic is not provided.

                                For US banks: 9-digit ABA/RTN. For foreign banks: local clearing code.

                                When provided without clearingSystemId, defaults to USABA.'
                            clearingSystemId:
                              anyOf:
                              - type: string
                                enum:
                                - USABA
                                title: ClearingSystemId
                              - type: 'null'
                              description: 'Identifies the clearing system for the memberId.

                                Only applicable when memberId is provided. Defaults to USABA if omitted.'
                            bic:
                              anyOf:
                              - type: string
                              - type: 'null'
                              title: Bic
                              description: 'SWIFT/BIC code of the financial institution.

                                Exactly 8 or 11 characters. Required if memberId is not provided.'
                            lei:
                              anyOf:
                              - type: string
                              - type: 'null'
                              title: Lei
                              description: Legal Entity Identifier. 20-character alphanumeric code.
                            name:
                              anyOf:
                              - type: string
                              - type: 'null'
                              title: Name
                              description: Financial institution name. Max 140 characters.
                            address:
                              anyOf:
                              - properties:
                                  line1:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                    title: Line1
                                    description: 'First line of the address.

                                      Pattern:

                                      - Default: 1-105 characters with at least one non-whitespace character

                                      - FEDWIRE: 1-105 characters, limited to alphanumeric and special characters'
                                    examples:
                                    - 123 sesame street
                                  line2:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                    title: Line2
                                    description: 'Second line of the address (apartment, suite, etc.).

                                      Pattern:

                                      - Default: 1-35 characters with at least one non-whitespace character

                                      - FEDWIRE: 1-35 characters, limited to alphanumeric and special characters'
                                    examples:
                                    - apt 4321
                                  city:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                    title: City
                                    description: 'City name.

                                      Pattern:

                                      - Default: 1-35 characters with at least one non-whitespace character

                                      - FEDWIRE: 1-35 characters, limited to alphanumeric and special characters'
                                    examples:
                                    - Brooklyn
                                  state:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                    title: State
                                    description: 'State or province code.

                                      Pattern:

                                      - Default: 2-35 characters with at least one non-whitespace character. For US addresses, typically 2-letter state code (e.g., ''NY'', ''CA'')

                                      - FEDWIRE: 2-35 characters, limited to alphanumeric and special characters'
                                    examples:
                                    - NY
                                  zipCode:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                    title: Zipcode
                                    description: 'Postal code or ZIP code.

                                      Pattern:

                                      - Default: 1-15 characters with at least one non-whitespace character. For US addresses, typically 5-digit ZIP code (e.g., ''11201'')

                                      - FEDWIRE: 1-15 characters, limited to alphanumeric and special characters'
                                    examples:
                                    - '11201'
                                  country:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                    title: Country
                                    description: 'Country code following ISO 3166-1 alpha-2 format.

                                      Pattern: Exactly 2 uppercase letters.

                                      Examples: ''US'' (United States), ''MX'' (Mexico)'
                                    examples:
                                    - US
                                    - MX
                                type: object
                                title: RequestAddress
                              - type: 'null'
                              description: Financial institution address (bank location, not account owner).
                          type: object
                          title: FinancialAgentRequest
                          description: Financial institution involved in the transfer
                        - type: 'null'
                        description: 'The financial institution receiving the wire on FedWire.

                          For FedWire: clearingSystemId must be USABA and memberId must be a valid 9-digit ABA/RTN.'
                      intermediaryAgent1:
                        anyOf:
                        - properties:
                            memberId:
                              anyOf:
                              - type: string
                              - type: 'null'
                              title: Memberid
                              description: 'Clearing system member identification number. Required if bic is not provided.

                                For US banks: 9-digit ABA/RTN. For foreign banks: local clearing code.

                                When provided without clearingSystemId, defaults to USABA.'
                            clearingSystemId:
                              anyOf:
                              - type: string
                                enum:
                                - USABA
                                title: ClearingSystemId
                              - type: 'null'
                              description: 'Identifies the clearing system for the memberId.

                                Only applicable when memberId is provided. Defaults to USABA if omitted.'
                            bic:
                              anyOf:
                              - type: string
                              - type: 'null'
                              title: Bic
                              description: 'SWIFT/BIC code of the financial institution.

                                Exactly 8 or 11 characters. Required if memberId is not provided.'
                            lei:
                              anyOf:
                              - type: string
                              - type: 'null'
                              title: Lei
                              description: Legal Entity Identifier. 20-character alphanumeric code.
                            name:
                              anyOf:
                              - type: string
                              - type: 'null'
                              title: Name
                              description: Financial institution name. Max 140 characters.
                            address:
                              anyOf:
                              - properties:
                                  line1:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                    title: Line1
                                    description: 'First line of the address.

                                      Pattern:

                                      - Default: 1-105 characters with at least one non-whitespace character

                                      - FEDWIRE: 1-105 characters, limited to alphanumeric and special characters'
                                    examples:
                                    - 123 sesame street
                                  line2:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                    title: Line2
                                    description: 'Second line of the address (apartment, suite, etc.).

                                      Pattern:

                                      - Default: 1-35 characters with at least one non-whitespace character

                                      - FEDWIRE: 1-35 characters, limited to alphanumeric and special characters'
                                    examples:
                                    - apt 4321
                                  city:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                    title: City
                                    description: 'City name.

                                      Pattern:

                                      - Default: 1-35 characters with at least one non-whitespace character

                                      - FEDWIRE: 1-35 characters, limited to alphanumeric and special characters'
                                    examples:
                                    - Brooklyn
                                  state:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                    title: State
                                    description: 'State or province code.

                                      Pattern:

                                      - Default: 2-35 characters with at least one non-whitespace character. For US addresses, typically 2-letter state code (e.g., ''NY'', ''CA'')

                                      - FEDWIRE: 2-35 characters, limited to alphanumeric and special characters'
                                    examples:
                                    - NY
                                  zipCode:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                    title: Zipcode
                                    description: 'Postal code or ZIP code.

                                      Pattern:

                                      - Default: 1-15 characters with at least one non-whitespace character. For US addresses, typically 5-digit ZIP code (e.g., ''11201'')

                                      - FEDWIRE: 1-15 characters, limited to alphanumeric and special characters'
                                    examples:
                                    - '11201'
                                  country:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                    title: Country
                                    description: 'Country code following ISO 3166-1 alpha-2 format.

                                      Pattern: Exactly 2 uppercase letters.

                                      Examples: ''US'' (United States), ''MX'' (Mexico)'
                                    examples:
                                    - US
                                    - MX
                                type: object
                                title: RequestAddress
                              - type: 'null'
                              description: Financial institution address (bank location, not account owner).
                          type: object
                          title: FinancialAgentRequest
                          description: Financial institution involved in the transfer
                        - type: 'null'
                        description: 'Intermediary/correspondent bank in the SWIFT chain.

                          At least bic or memberId required. When present, instructedAgent is required.'
                      intermediaryAccount1:
                        anyOf:
                        - properties:
                            number:
                              type: string
                              title: Number
                              description: Account number or IBAN.
                            type:
                              description: 'Type of account number.

                                - IBAN: International Bank Account Number, validated per ISO 13616

                                - ACCOUNT_NUMBER: Standard account identifier (default when omitted)'
                              default: ACCOUNT_NUMBER
                              type: string
                              enum:
                              - IBAN
                              - ACCOUNT_NUMBER
                              title: AccountNumberType
                          type: object
                          required:
                          - number
                          title: AccountIdentification
                          description: Account identification — account number or IBAN.
                        - type: 'null'
                        description: 'Correspondent account at the intermediary bank.

                          The account the sending bank holds AT the intermediary (not the beneficiary''s account).'
                    type: object
                    title: DestinationEntitiesRequest
                    description: 'Agent routing for international wire transfers.


                      Only allowed for outbound international FedWire transfers.

                      When intermediaryAgent1 is present, instructedAgent is required.'
                  - type: 'null'
                  description: 'Agent routing for outbound international FedWire transfers.

                    Contains the instructed agent (receiving FI on FedWire) and optional intermediary/correspondent bank in the payment chain.

                    Validation:

                    - Only allowed for outbound international FedWire transfers

                    - When intermediaryAgent1 is present, instructedAgent is required

                    - FedWire instructedAgent: clearingSystemId must be USABA, memberId must be valid ABA/RTN'
                isCrossBorder:
                  type: boolean
                  title: Iscrossborder
                  description: 'Indicates whether this is a cross-border (international) transfer.

                    Currently supported for FEDWIRE only.'
                  default: false
              type: object
              required:
              - accountNo
              - paymentMethod
              - currencyAmount
              - creditOrDebit
              - sourceAccount
              - destinationAccount
              - apiLogin
              - apiTransKey
              - providerId
              title: CreateTransferRequest
              description: "Create a new payment transfer OR return a previous transfer.\n\nFor new transfers: Omit the `returnDetails` field.\nFor payment returns: Include the `returnDetails` field with the original transaction reference.\n\nWhen `returnDetails` is present, the request initiates a return of the original transfer.\nSee `ReturnDetails` class documentation for field meanings and return-specific behavior.\n\n**Character Set Restrictions for FEDWIRE and FEDNOW rails:**\n\nAll free-text fields (e.g. `purpose`, `remittanceInfo`, address fields, owner names, `bankName`)\nmust conform to the payment rail's character set when using FEDWIRE or FEDNOW:\n\n- **FEDWIRE**: Alphanumeric characters and special characters: @&/\\'\"` ~()<>$#%+-={}*|[]^.,?!;:_\n- **FEDNOW**: FedNow Service Character Set — alphanumeric, space, all printable ASCII special\n  characters (!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~), and extended Latin characters (U+00C0–U+00FF)"
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                properties:
                  transferId:
                    type: string
                    title: Transferid
                    description: Unique identifier assigned to the newly created transfer.
                type: object
                required:
                - transferId
                title: CreateTransferResponse
              examples:
                response:
                  value: "{\n    \"transferId\": \"890e4567-e89b-12d3-a456-426614174222\"\n}"
        '400':
          content:
            application/json:
              schema:
                properties:
                  error:
                    description: Provides additional information about the error.
                    properties:
                      code:
                        description: 'Identifier for the error. Possible values:'
                        type: string
                        enum:
                        - INTERNAL_SERVICE_ERROR
                        - VALIDATION_ERROR
                        - BAD_REQUEST
                        - CONCURRENT_IDEMPOTENT_REQUEST
                        - ORIGINAL_TRANSACTION_NOT_COMPLETED
                        - NOT_FOUND
                        - TOO_MANY_RTNS
                        - INVALID_LIMIT
                        - INVALID_PAGE_TOKEN
                        - RESOURCE_LIMIT_EXCEEDED
                        - ME_NOT_CONFIGURED
                        - ME_NOT_ENABLED
                        - ME_PROGRAM_MISCONFIGURED
                        title: ErrorCode
                      message:
                        type: string
                        title: Message
                        description: Short description of the error.
                      details:
                        anyOf:
                        - additionalProperties: true
                          type: object
                        - type: 'null'
                        title: Details
                        description: Contains details about the error when available. For example, which fields has validations problems or which action fails.
                    type: object
                    required:
                    - code
                    - message
                    title: ErrorInfo
                type: object
                required:
                - error
                title: ErrorResponse
          description: Bad Request
        '401':
          description: No valid API credentials provided.
          content:
            application/json:
              schema:
                properties:
                  error:
                    description: Provides additional information about the error.
                    properties:
                      code:
                        description: 'Identifier for the error. Possible values:'
                        type: string
                        enum:
                        - INTERNAL_SERVICE_ERROR
                        - VALIDATION_ERROR
                        - BAD_REQUEST
                        - CONCURRENT_IDEMPOTENT_REQUEST
                        - ORIGINAL_TRANSACTION_NOT_COMPLETED
                        - NOT_FOUND
                        - TOO_MANY_RTNS
                        - INVALID_LIMIT
                        - INVALID_PAGE_TOKEN
                        - RESOURCE_LIMIT_EXCEEDED
                        - ME_NOT_CONFIGURED
                        - ME_NOT_ENABLED
                        - ME_PROGRAM_MISCONFIGURED
                        title: ErrorCode
                      message:
                        type: string
                        title: Message
                        description: Short description of the error.
                      details:
                        anyOf:
                        - additionalProperties: true
                          type: object
                        - type: 'null'
                        title: Details
                        description: Contains details about the error when available. For example, which fields has validations problems or which action fails.
                    type: object
                    required:
                    - code
                    - message
                    title: ErrorInfo
                type: object
                required:
                - error
                title: ErrorResponse
        '403':
          description: The provided API credential does not allow this operation.
          content:
            application/json:
              schema:
                properties:
                  error:
                    description: Provides additional information about the error.
                    properties:
                      code:
                        description: 'Identifier for the error. Possible values:'
                        type: string
                        enum:
                        - INTERNAL_SERVICE_ERROR
                        - VALIDATION_ERROR
                        - BAD_REQUEST
                        - CONCURRENT_IDEMPOTENT_REQUEST
                        - ORIGINAL_TRANSACTION_NOT_COMPLETED
                        - NOT_FOUND
                        - TOO_MANY_RTNS
                        - INVALID_LIMIT
                        - INVALID_PAGE_TOKEN
                        - RESOURCE_LIMIT_EXCEEDED
                        - ME_NOT_CONFIGURED
                        - ME_NOT_ENABLED
                        - ME_PROGRAM_MISCONFIGURED
                        title: ErrorCode
                      message:
                        type: string
                        title: Message
                        description: Short description of the error.
                      details:
                        anyOf:
                        - additionalProperties: true
                          type: object
                        - type: 'null'
                        title: Details
                        description: Contains details about the error when available. For example, which fields has validations problems or which action fails.
                    type: object
                    required:
                    - code
                    - message
                    title: ErrorInfo
                type: object
                required:
                - error
                title: ErrorResponse
        '404':
          content:
            application/json:
              schema:
                properties:
                  error:
                    description: Provides additional information about the error.
                    properties:
                      code:
                        description: 'Identifier for the error. Possible values:'
                        type: string
                        enum:
                        - INTERNAL_SERVICE_ERROR
                        - VALIDATION_ERROR
                        - BAD_REQUEST
                        - CONCURRENT_IDEMPOTENT_REQUEST
                        - ORIGINAL_TRANSACTION_NOT_COMPLETED
                        - NOT_FOUND
                        - TOO_MANY_RTNS
                        - INVALID_LIMIT
                        - INVALID_PAGE_TOKEN
                        - RESOURCE_LIMIT_EXCEEDED
                        - ME_NOT_CONFIGURED
                        - ME_NOT_ENABLED
                        - ME_PROGRAM_MISCONFIGURED
                        title: ErrorCode
                      message:
                        type: string
                        title: Message
                        description: Short description of the error.
                      details:
                        anyOf:
                        - additionalProperties: true
                          type: object
                        - type: 'null'
                        title: Details
                        description: Contains details about the error when available. For example, which fields has validations problems or which action fails.
                    type: object
                    required:
                    - code
                    - message
                    title: ErrorInfo
                type: object
                required:
                - error
                title: ErrorResponse
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                properties:
                  error:
                    description: Provides additional information about the error.
                    properties:
                      code:
                        description: 'Identifier for the error. Possible values:'
                        type: string
                        enum:
                        - INTERNAL_SERVICE_ERROR
                        - VALIDATION_ERROR
                        - BAD_REQUEST
                        - CONCURRENT_IDEMPOTENT_REQUEST
                        - ORIGINAL_TRANSACTION_NOT_COMPLETED
                        - NOT_FOUND
                        - TOO_MANY_RTNS
                        - INVALID_LIMIT
                        - INVALID_PAGE_TOKEN
                        - RESOURCE_LIMIT_EXCEEDED
                        - ME_NOT_CONFIGURED
                        - ME_NOT_ENABLED
                        - ME_PROGRAM_MISCONFIGURED
                        title: ErrorCode
                      message:
                        type: string
                        title: Message
                        description: Short description of the error.
                      details:
                        anyOf:
                        - additionalProperties: true
                          type: object
                        - type: 'null'
                        title: Details
                        description: Contains details about the error when available. For example, which fields has validations problems or which action fails.
                    type: object
                    required:
                    - code
                    - message
                    title: ErrorInfo
                type: object
                required:
                - error
                title: ErrorResponse
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                          title: Location
                        msg:
                          type: string
                          title: Message
                        type:
