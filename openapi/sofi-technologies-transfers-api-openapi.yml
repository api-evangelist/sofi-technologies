  /getTransfer:
    post:
      tags:
      - Transfers
      summary: Get Transfer
      description: '> 👍 Availability

        >

        >Some of the field descriptions for this endpoint reference FedNow or Fedwire, which are future capabilities not yet available for clients.


        Use the Get Transfer endpoint to retrieve information about an existing incoming or outgoing transferthat was initiated by the Create Transfer.'
      operationId: paymenthub_post_gettransfer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                accountNo:
                  type: string
                  title: Accountno
                  description: "The <<glossary:PRN>> associated with this transfer. The `direction` field in the response identifies whether this account is the source or destination of the funds. \nPattern: PRN\nExample: \"`074103447228`\""
                transferId:
                  type: string
                  title: Transferid
                  description: 'Unique identifier for the specific transfer to retrieve.

                    Pattern: Alphanumeric string

                    Example: "`890e4567-e89b-12d3-a456-426614174222`"'
              type: object
              required:
              - accountNo
              - transferId
              - apiLogin
              - apiTransKey
              - providerId
              title: GetTransferRequest
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                properties:
                  transferId:
                    type: string
                    title: Transferid
                    description: The unique identifier for the transfer.
                  currencyAmount:
                    description: 'Response-side currency amount. Raises InternalServiceException (500) on invalid persisted data

                      — bad values in response construction reflect server-side data integrity issues, not client error.'
                    properties:
                      amount:
                        type: number
                        examples:
                        - 199.32
                      currency:
                        type: string
                        title: Currency
                        description: 'Currency code following ISO 4217 standard.

                          Validation: Exactly 3 uppercase letters.

                          Pattern: ^[A-Z]{3}$

                          Example: ''USD'' (US Dollar), ''EUR'' (Euro), ''GBP'' (British Pound)'
                        default: USD
                        examples:
                        - USD
                    type: object
                    required:
                    - amount
                    title: CurrencyAmountResponse
                  purpose:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Purpose
                    description: The purpose provided for the transfer.
                  remittanceInfo:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Remittanceinfo
                    description: Additional details about the transfer, such as an invoice number.
                  createdDate:
                    type: string
                    title: Createddate
                    description: Timestamp when the transfer was created or received.
                  paymentMethod:
                    description: 'Payment network used for the transfer.

                      Possible values:'
                    type: string
                    enum:
                    - ACH
                    - FEDNOW
                    - FEDWIRE
                    - CARD
                    title: PaymentRails
                  accountNo:
                    type: string
                    title: Accountno
                    description: The <<glossary:PRN>> associated with this view of the transfer.
                  sourceAccount:
                    properties:
                      type:
                        description: Indicates the account category.
                        enum:
                        - GALILEO_ACCOUNT
                        - EXTERNAL_ACCOUNT_REFERENCE
                        - EXTERNAL_ACCOUNT_LINK_REQUEST
                        - LEGACY
                        title: AccountType
                        type: string
                    required:
                    - type
                    title: AccountReferenceResponseBase
                    type: object
                    discriminator:
                      propertyName: type
                      mapping:
                        EXTERNAL_ACCOUNT_LINK_REQUEST: '#/components/schemas/ExternalAccountDetails'
                        EXTERNAL_ACCOUNT_REFERENCE: '#/components/schemas/ExternalAccountReferenceResponse'
                        GALILEO_ACCOUNT: '#/components/schemas/GalileoAccountResponse'
                  destinationAccount:
                    properties:
                      type:
                        description: Indicates the account category.
                        enum:
