  /cancelTransfer:
    post:
      tags:
      - Transfers
      summary: Cancel Transfer
      description: 'Use the Cancel Transfer endpoint to cancel an outgoing transfer that was initiated by Create Transfer.


        Transfers must be in a `POSTED` status to be eligible for cancellation.'
      operationId: paymenthub_post_canceltransfer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                accountNo:
                  type: string
                  title: Accountno
                  description: The <<glossary:PRN>> associated with the outgoing transfer to cancel.
                transferId:
                  type: string
                  title: Transferid
                  description: 'Unique identifier of the transfer to cancel.

                    Pattern: Alphanumeric string

                    Example: `TXN-12345ABCDE`'
              type: object
              required:
              - accountNo
              - transferId
              - apiLogin
              - apiTransKey
              - providerId
              title: CancelTransferRequest
        required: true
