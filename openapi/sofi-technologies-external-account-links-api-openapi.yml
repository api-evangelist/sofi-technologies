  /getExternalAccountLinkAccess:
    post:
      tags:
      - External Account Links
      summary: Get External Account Link Access
      description: Use the Get External Account Link Access endpoint to initiate a secure, user-facing session for linking an external account. This endpoint generates a temporary link for the user to securely provide their credentials to a third-party partner like Finicity.
      operationId: paymenthub_post_getexternalaccountlinkaccess
      requestBody:
        content:
          application/json:
            schema:
              properties:
                accountNo:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Accountno
                  description: 'The <<glossary:PRN>> for which to generate the secure linking session.

                    Required for GALILEO_CARD_CAPTURE integration.

                    Pattern: PRN

                    Example: 074103447228'
                  examples:
                  - 074103447228
                integration:
                  description: 'Third-party partner to use for the secure account-linking session.

                    Example: FINICITY'
                  type: string
                  enum:
                  - FINICITY
                  - GALILEO_CARD_CAPTURE
                  title: AccessIntegration
              type: object
              required:
              - integration
              - apiLogin
              - apiTransKey
              - providerId
              title: GetExternalAccountLinkAccessRequest
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                properties:
                  token:
                    properties:
                      type:
                        description: 'Type of token returned.

                          Example: JWT'
                        examples:
                        - JWT
                        - FINICITY_TOKEN
                        type: string
                        enum:
                        - JWT
                        - FINICITY_TOKEN
                        title: AccessTokenType
                      value:
                        type: string
                        title: Value
                        description: 'Token used to authenticate the secure session.

                          For JWT: JSON Web Token for GALILEO_CARD_CAPTURE integration.

                          For FINICITY_TOKEN: Finicity application token for API authentication.

                          Pattern: Token string

                          Example: fqnu103294.g4234g234f.42g2345gteg'
                        examples:
                        - fqnu103294.g4234g234f.42g2345gteg
                      appKey:
                        anyOf:
                        - type: string
                        - type: 'null'
                        title: Appkey
                        description: 'Application key for API authentication.

                          Only provided for FINICITY integration.

                          Pattern: Alphanumeric string

                          Example: abc123def456'
                        examples:
                        - abc123def456
                    type: object
                    required:
                    - type
                    - value
                    title: TokenDetails
                  expirationTimestamp:
                    type: string
                    title: Expirationtimestamp
                    description: 'ISO 8601 timestamp when the access token expires.

                      Pattern: ISO 8601 format

                      Example: `"2025-06-11T09:49:20.055367-06:00"`'
                    examples:
                    - '2025-06-11T09:49:20.055367-06:00'
                  expirationDate:
                    type: string
                    title: Expirationdate
                    description: 'Deprecated: Use expirationTimestamp instead. ISO 8601 timestamp when the access token expires.

                      Pattern: ISO 8601 format

                      Example: `"2025-06-11T09:49:20.055367-06:00"`'
                    deprecated: true
                    examples:
                    - '2025-06-11T09:49:20.055367-06:00'
                type: object
                required:
                - token
                - expirationTimestamp
                - expirationDate
                title: GetExternalAccountLinkAccessResponse
