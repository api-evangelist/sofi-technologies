                        - INVALID_LIMIT
                        - INVALID_PAGE_TOKEN
                        - RESOURCE_LIMIT_EXCEEDED
                        - ME_NOT_CONFIGURED
                        - ME_NOT_ENABLED
                        - ME_PROGRAM_MISCONFIGURED
                        title: ErrorCode
                      message:
                        type: string
                        title: Message
                        description: Short description of the error.
                      details:
                        anyOf:
                        - additionalProperties: true
                          type: object
                        - type: 'null'
                        title: Details
                        description: Contains details about the error when available. For example, which fields has validations problems or which action fails.
                    type: object
                    required:
                    - code
                    - message
                    title: ErrorInfo
                type: object
