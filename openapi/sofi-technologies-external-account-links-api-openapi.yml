openapi: 3.2.0
info:
  title: Payment Hub Api 2.0 External Account Links API
  version: '1.0'
servers:
- url: '{corename}.payment-hub.{env}.gpsrv.com/payment-hub/1.0/'
tags:
- name: External Account Links
paths:
  /createExternalAccountLink:
    post:
      tags:
      - External Account Links
      summary: Create External Account Link
      description: '> 👍 Availability

        >

        >Some of the field descriptions for this endpoint reference FedNow or Fedwire, which are future capabilities not yet available for clients. Right now, this endpoint supports only Mastercard Data Connect: Account Linking and Mastercard Data Connect: Balance Check.


        Use the Create External Account Link endpoint to create a link from an account at an external bank to the caller account when a user manually inputs their external account information. This account will be usable for transfers over FedWire or credit rails, depending on your configuration.'
      operationId: paymenthub_post_createexternalaccountlink
      parameters:
      - name: x-gft-idempotency-key
        in: header
        required: true
        schema:
          type: string
          format: uuid4
          title: X-Gft-Idempotency-Key
      - name: Authorization
        in: header
        required: true
        description: Basic authentication token (base64-encoded {apilogin}:{apitranskey} credentials provided by SoFi Tech Solutions)
        schema:
          type: string
          pattern: ^Basic [A-Za-z0-9+/]+=*$
          example: Basic eW91cl9hcGlsb2dpbjp5b3VyX2FwaXRyYW5za2V5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                accountNo:
                  type: string
                  title: Accountno
                  description: "The <<glossary:PRN>> of the account.\nPattern: PRN \nExample: `\"074103447228\"`"
                  examples:
                  - 074103447228
                nickname:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Nickname
                  description: 'Display name for the remote account. Not considered to be sensitive data.

                    Pattern: 1–34 characters with at least one non-whitespace character.

                    Example: `"Celia College Fund"`'
                  examples:
                  - Celia College Fund
                  - dest name 1
                owner:
                  description: Owner information for the external account.
                  properties:
                    type:
                      description: 'Type of entity that owns the external account.

                        Example: `"CONSUMER"`'
                      enum:
                      - CORPORATE
                      - CONSUMER
                      - GALILEO
                      title: OwnerEntityType
                      type: string
                    ownershipType:
                      default: FIRST_PARTY
                      description: 'Relationship of the account owner to the program account.

                        Example: `"FIRST_PARTY"`'
                      type: string
                      enum:
                      - FIRST_PARTY
                      - THIRD_PARTY
                      title: OwnershipType
                    address:
                      anyOf:
                      - properties:
                          line1:
                            anyOf:
                            - type: string
                            - type: 'null'
                            title: Line1
                            description: 'First line of the address.

                              Pattern:

                              - Default: 1-105 characters with at least one non-whitespace character

                              - FEDWIRE: 1-105 characters, limited to alphanumeric and special characters'
                            examples:
                            - 123 sesame street
                          line2:
                            anyOf:
                            - type: string
                            - type: 'null'
                            title: Line2
                            description: 'Second line of the address (apartment, suite, etc.).

                              Pattern:

                              - Default: 1-35 characters with at least one non-whitespace character

                              - FEDWIRE: 1-35 characters, limited to alphanumeric and special characters'
                            examples:
                            - apt 4321
                          city:
                            anyOf:
                            - type: string
                            - type: 'null'
                            title: City
                            description: 'City name.

                              Pattern:

                              - Default: 1-35 characters with at least one non-whitespace character

                              - FEDWIRE: 1-35 characters, limited to alphanumeric and special characters'
                            examples:
                            - Brooklyn
                          state:
                            anyOf:
                            - type: string
                            - type: 'null'
                            title: State
                            description: 'State or province code.

                              Pattern:

                              - Default: 2-35 characters with at least one non-whitespace character. For US addresses, typically 2-letter state code (e.g., ''NY'', ''CA'')

                              - FEDWIRE: 2-35 characters, limited to alphanumeric and special characters'
                            examples:
                            - NY
                          zipCode:
                            anyOf:
                            - type: string
                            - type: 'null'
                            title: Zipcode
                            description: 'Postal code or ZIP code.

                              Pattern:

                              - Default: 1-15 characters with at least one non-whitespace character. For US addresses, typically 5-digit ZIP code (e.g., ''11201'')

                              - FEDWIRE: 1-15 characters, limited to alphanumeric and special characters'
                            examples:
                            - '11201'
                          country:
                            anyOf:
                            - type: string
                            - type: 'null'
                            title: Country
                            description: 'Country code following ISO 3166-1 alpha-2 format.

                              Pattern: Exactly 2 uppercase letters.

                              Examples: ''US'' (United States), ''MX'' (Mexico)'
                            examples:
                            - US
                            - MX
                        type: object
                        title: RequestAddress
                      - type: 'null'
                      description: Primary address for the account owner.
                  required:
                  - type
                  title: AccountOwnerBase
                  type: object
                  discriminator:
                    propertyName: type
                    mapping:
                      CONSUMER: '#/components/schemas/ConsumerAccountOwner'
                      CORPORATE: '#/components/schemas/CorporateAccountOwner'
                      GALILEO: '#/components/schemas/GalileoAccountOwner'
                details:
                  description: Card or bank details for the external account.
                  properties:
                    type:
                      description: Type of external account being linked.
                      enum:
                      - BANK
                      - CARD
                      title: AccountDetailsType
                      type: string
                  required:
                  - type
                  title: AccountDetailsBaseRequest
                  type: object
                  discriminator:
                    propertyName: type
                    mapping:
                      BANK: '#/components/schemas/BankAccountDetails'
                      CARD: '#/components/schemas/CardAccountDetails'
                validation:
                  description: Details for validating the external account link.
                  properties:
                    type:
                      description: 'Specifies the validation method required for the external account link.

                        Pattern: enum

                        Example: `"CLIENT"`'
                      default: CLIENT
                      type: string
                      enum:
                      - CLIENT
                      - LEGACY
                      - CARD
                      - FINICITY
                      - NONE
                      - MICRO_ENTRY
                      title: ValidationType
                    status:
                      description: 'Indicates the current status of the validation process.

                        Pattern: enum

                        Example: `"PENDING"`'
                      default: PENDING
                      type: string
                      enum:
                      - PENDING
                      - FAILED
                      - PASSED
                      - NO_VALIDATION
                      title: ValidationStatus
                    status_reason:
                      anyOf:
                      - type: string
                      - type: 'null'
                      title: Status Reason
                      description: 'Provides additional context or a reason for the current validation status.

                        Pattern: Alphanumeric string

                        Example: `"Validated successfully"`'
                  type: object
                  title: ExternalAccountLinkValidation
              type: object
              required:
              - accountNo
              - owner
              - details
              - validation
              - apiLogin
              - apiTransKey
              - providerId
              title: CreateExternalAccountLinkRequest
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                properties:
                  externalAccountLinkId:
                    type: string
                    title: Externalaccountlinkid
                    description: Unique identifier that identifies the external account link in the system.
                type: object
                required:
                - externalAccountLinkId
                title: CreateExternalAccountLinkResponse
              examples:
                response:
                  value: "{\n    \"externalAccountLinkId\": \"123e4567-e89b-12d3-a456-4266100532\"\n}"
