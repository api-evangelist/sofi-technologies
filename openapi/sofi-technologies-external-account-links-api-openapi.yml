                      status:
                        anyOf:
                        - type: string
                          enum:
                          - PENDING
                          - FAILED
                          - PASSED
                          - NO_VALIDATION
                          title: ValidationStatus
                        - type: 'null'
                        description: 'Validation status of the external account.

                          Example: VERIFIED'
                    type: object
                    title: ModifiableExternalAccountLinkValidation
                  - type: 'null'
                  description: Specifies the validation information to update.
                  default: {}
              type: object
              required:
              - accountNo
              - externalAccountLinkId
              - apiLogin
              - apiTransKey
              - providerId
              title: ModifyExternalAccountLinkRequest
        required: true
