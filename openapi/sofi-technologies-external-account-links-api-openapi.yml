  /modifyExternalAccountLink:
    post:
      tags:
      - External Account Links
      summary: Modify External Account Link
      description: 'Use the Modify External Account Link endpoint to update an existing external bank account that sends and receives transactions.


        Specify only the parameter(s) you wish to modify. Do not pass parameters with `null` or empty values.'
      operationId: paymenthub_post_modifyexternalaccountlink
      requestBody:
        content:
          application/json:
            schema:
              properties:
                accountNo:
                  type: string
                  title: Accountno
                  description: 'The <<glossary:PRN>> to which the external account is linked.

                    Pattern: PRN

                    Example: `"074103447228"`'
                  examples:
                  - 074103447228
                externalAccountLinkId:
                  type: string
                  title: Externalaccountlinkid
                  description: 'Unique identifier for the specific external account link to modify.

                    Pattern: 1–40 digits

                    Example: `"0359320859384728394827182394832834"`'
                  examples:
                  - 0359320859384728394827182394832834
                nickname:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Nickname
                  description: 'Display name for the remote account. Not considered to be sensitive data.

                    Pattern: 1–34 characters

                    Example: `"My Savings Account"`'
                  examples:
                  - Celia College Fund
                  - dest name 1
                owner:
                  anyOf:
                  - properties:
                      address:
                        anyOf:
                        - properties:
                            line1:
                              anyOf:
                              - type: string
                              - type: 'null'
                              title: Line1
                              description: 'First line of the address.

                                Pattern:

                                - Default: 1-105 characters with at least one non-whitespace character

                                - FEDWIRE: 1-105 characters, limited to alphanumeric and special characters'
                              examples:
                              - 123 sesame street
                            line2:
                              anyOf:
                              - type: string
                              - type: 'null'
                              title: Line2
                              description: 'Second line of the address (apartment, suite, etc.).

                                Pattern:

                                - Default: 1-35 characters with at least one non-whitespace character

                                - FEDWIRE: 1-35 characters, limited to alphanumeric and special characters'
                              examples:
                              - apt 4321
                            city:
                              anyOf:
                              - type: string
                              - type: 'null'
                              title: City
                              description: 'City name.

                                Pattern:

                                - Default: 1-35 characters with at least one non-whitespace character

                                - FEDWIRE: 1-35 characters, limited to alphanumeric and special characters'
                              examples:
                              - Brooklyn
                            state:
                              anyOf:
                              - type: string
                              - type: 'null'
                              title: State
                              description: 'State or province code.

                                Pattern:

                                - Default: 2-35 characters with at least one non-whitespace character. For US addresses, typically 2-letter state code (e.g., ''NY'', ''CA'')

                                - FEDWIRE: 2-35 characters, limited to alphanumeric and special characters'
                              examples:
                              - NY
                            zipCode:
                              anyOf:
                              - type: string
                              - type: 'null'
                              title: Zipcode
                              description: 'Postal code or ZIP code.

                                Pattern:

                                - Default: 1-15 characters with at least one non-whitespace character. For US addresses, typically 5-digit ZIP code (e.g., ''11201'')

                                - FEDWIRE: 1-15 characters, limited to alphanumeric and special characters'
                              examples:
                              - '11201'
                            country:
                              anyOf:
                              - type: string
                              - type: 'null'
                              title: Country
                              description: 'Country code following ISO 3166-1 alpha-2 format.

                                Pattern: Exactly 2 uppercase letters.

                                Examples: ''US'' (United States), ''MX'' (Mexico)'
                              examples:
                              - US
                              - MX
                          type: object
                          title: RequestAddress
                        - type: 'null'
                        description: Primary address for the account owner.
                      consumerFirstName:
                        anyOf:
                        - type: string
                        - type: 'null'
                        title: Consumerfirstname
                        description: 'First name of the individual who owns the account.

                          Pattern: 1-40 characters

                          Example: `"Jane"`'
                        examples:
                        - John
                      consumerLastName:
                        anyOf:
                        - type: string
                        - type: 'null'
                        title: Consumerlastname
                        description: 'Last name of the individual who owns the account.

                          Pattern: 1-40 characters

                          Example: `"Doe"`'
                        examples:
                        - Smith
                      businessName:
                        anyOf:
                        - type: string
                        - type: 'null'
                        title: Businessname
                        description: 'Legal name of the business that owns the account.

                          Pattern: 1-40 characters

                          Example: `"ABC Corporation"`'
                        examples:
                        - ABC Corp
                    type: object
                    title: ModifiableExternalAccountOwner
                  - type: 'null'
                  description: Specifies the owner-related fields to update.
                  default: {}
                details:
                  anyOf:
                  - description: Base class for modifiable account details
                    properties:
                      type:
                        description: Type of external account being linked.
                        enum:
                        - BANK
                        - CARD
                        title: AccountDetailsType
                        type: string
                    required:
                    - type
                    title: ModifiableAccountDetailsBase
                    type: object
                    discriminator:
                      propertyName: type
                      mapping:
                        BANK: '#/components/schemas/ModifiableExternalBankAccountDetails'
                        CARD: '#/components/schemas/ModifiableExternalCardAccountDetails'
                  - type: 'null'
                  title: Details
                  description: Specifies the account or card details to update.
                validation:
                  anyOf:
                  - properties:
                      type:
                        anyOf:
                        - type: string
                          enum:
                          - CLIENT
                          - LEGACY
                          - CARD
                          - FINICITY
                          - NONE
                          - MICRO_ENTRY
                          title: ValidationType
                        - type: 'null'
                        description: 'Validation method for the external account.

