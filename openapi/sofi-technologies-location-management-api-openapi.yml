  /modifyLocationFee:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      summary: Modify Location Fee
      description: 'Use the Modify Location Fee endpoint to modify a fee that was created with the Create Location Fee endpoint. You cannot change `feeType` (`FBD` or `DEL`) with this endpoint. Instead, you must create a new fee with Create Location Fee and use this endpoint to deactivate the old fee.


        For this endpoint, `amount` and `amountType` are not required, but if one of them is populated, then both are required.'
      parameters: []
      tags:
      - Location Management
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
