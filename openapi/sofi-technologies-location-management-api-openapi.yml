  /createLocationFee:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      summary: Create Location Fee
      description: 'Use the Create Location Fee endpoint to create a fee to assess at a location. A fee can be assessed as a flat rate or a percentage. When the fee is a percentage, you can specify minimum and maximum amounts. The fee becomes active upon creation and can be deactivated using the Modify Location Fee endpoint.


        These are the fee types:

        * `FBD` — FBE direct deposit fee

        * `DEL` — ACH direct deposit fee'
      parameters: []
      tags:
      - Location Management
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>.. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                location:
                  type: string
                  pattern: ^[a-zA-Z0-9]{1,20}$
                  description: 'Unique location identifier (`location`) as returned by the <a href="ref:post_createlocation" target="_blank">Create Location</a> endpoint.  This value is also returned by the <a href="ref:post_getlocations" target="_blank">Get Locations</a> endpoint depending on the value of `locationType` when the location was created:

                    * `0` or `2` &mdash; Returned in the `location_id` field

                    * `1` &mdash; Returned in the `provider_specified_id` field


                    Pattern: Integer if `locationType: 0` or `locationType: 2`; max 15 characters if `locationType: 1`

                    Example: `"a455-3483"`'
                  example: a455-3483
                locationType:
                  type: integer
                  format: int32
                  enum:
                  - 0
                  - 1
                  - 2
                  description: 'Type of ID in `location`:

                    * `0` &mdash; SoFi Tech Solutions location ID

                    * `1` &mdash; Partner location ID

                    * `2` &mdash; Don''t validate


                    Pattern: `0`, `1`, or `2`

                    Example: `0`'
                  example: '0'
                feeType:
                  type: string
                  enum:
                  - FBD
                  - DEL
                  description: 'Type of fee to assess at this location. To set up both fee types at the same location, call this endpoint twice:

                    * `FBD` &mdash; Federal benefit enrollment direct-deposit fee

                    * `DEL` &mdash; ACH direct-deposit fee


                    Pattern: 3-character code

                    Example: `"FBD"`'
                  example: FBD
                amount:
                  type: number
                  format: float
                  minimum: 0.01
                  maximum: 999999999999.99
                  description: 'Specify either a flat amount or a percentage. For a flat amount the valid range is between `.01` and `999`. For a percentage the valid range is `.01` (1%) to `1` (100%). When this parameter is populated then `amountType` is **required**.

                    Pattern: Positive integer or decimal number

                    Example: `1.23`'
                  example: '1.23'
                amountType:
                  type: string
                  enum:
                  - percent
                  - flat
                  description: 'Specify which type of value is in `amount`:

                    * `flat` &mdash; Flat rate

                    * `percent` &mdash; Percentage


                    Pattern: String

                    Example: `"flat"`'
                  example: flat
                minFee:
                  type:
                  - number
                  - 'null'
                  format: float
                  minimum: 0
                  maximum: 999999999999.99
                  description: 'The minimum amount for the fee, when `amountType: percent`.

                    Pattern: Positive integer or decimal number

                    Example: `1.10`'
                  example: '1.10'
                maxFee:
                  type:
                  - number
                  - 'null'
                  format: float
                  minimum: 0
                  maximum: 999999999999.99
                  description: 'The maximum amount for the fee, when `amountType: percent`.

                    Pattern: Positive integer or decimal number

                    Example: `1.10`'
                  example: '1.10'
              required:
              - amount
              - amountType
              - feeType
              - location
              - locationType
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      location:
                        type: integer
                        format: int32
                        description: SoFi Tech Solutions ID of the location, when `locationType` is `0` or `2`.
                      provider_specified_id:
                        type:
                        - string
                        - 'null'
                        description: Provider ID of the location, when `locationType` is `1`.
                      fee_type:
                        type:
                        - string
                        - 'null'
                        description: Type of fee, `FBD` (FBE direct deposit fee) or `DEL` (ACH direct deposit fee).
                      amount:
                        type: number
                        format: float
                        description: Amount of the fee.
                      amount_type:
                        type: string
                        description: 'The type of the amount: `flat` or `percent`.'
                      min_fee:
                        type:
                        - string
                        - 'null'
                        description: The minimum amount to charge, when `amount_type` is `percent`.
                      max_fee:
                        type:
                        - string
                        - 'null'
                        description: The minimum amount to charge, when `amount_type` is `percent`.
                    required:
                    - amount
                    - amount_type
                    - fee_type
                    - location
                    - max_fee
                    - min_fee
                    - provider_specified_id
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n  \"status_code\": 0,\n  \"status\": \"Success\",\n  \"processing_time\": 0.023,\n  \"response_data\": {\n    \"location\": 4400002,\n    \"provider_specified_id\": \"zzz4567\",\n    \"fee_type\": \"FBD\",\n    \"amount\": 1,\n    \"amount_type\": \"flat\",\n    \"min_fee\": 0,\n    \"max_fee\": 0\n  },\n  \"echo\": {\n    \"provider_transaction_id\": \"\",\n    \"provider_timestamp\": null,\n    \"transaction_id\": \"7036a565-8d73-4ff5-96f0-5b0c8016fc2a\"\n  },\n  \"system_timestamp\": \"2025-09-02 14:15:19\",\n  \"rtoken\": \"7a3bf2ae-11a4-4d1c-8679-926fa3d40d07\"\n}\n"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<response>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <processing_time>0.576</processing_time>\n  <response_data>\n    <location>4400004</location>\n    <provider_specified_id>zzz4567</provider_specified_id>\n    <fee_type>FBD</fee_type>\n    <amount>1</amount>\n    <amount_type>flat</amount_type>\n    <min_fee>0</min_fee>\n    <max_fee>0</max_fee>\n  </response_data>\n  <echo>\n    <provider_transaction_id></provider_transaction_id>\n    <provider_timestamp></provider_timestamp>\n    <transaction_id>4044d5d6-c7bf-46cf-96e9-72334dbc472d</transaction_id>\n  </echo>\n  <system_timestamp>2025-09-02 14:18:12</system_timestamp>\n  <rtoken>c4653e5b-1693-4786-87ea-598cdfe4e3dc</rtoken>\n</response>\n"
          description: ''
