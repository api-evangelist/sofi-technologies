                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>.. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                location:
                  type: string
                  pattern: ^[a-zA-Z0-9]{1,20}$
                  description: 'Identifier for the location that was created with Create Location. This value is returned by Get Locations in the `location_id` field when `locationType: 0` or `locationType: 2`, or in the `provider_specified_id` field when `locationType: 1`.

                    Pattern: Must be a number if type is 0; Must be less than or equal to 15 characters if type is 1.

                    Example: `"a455-3483"`'
                  example: a455-3483
                locationType:
                  type: integer
                  format: int32
                  enum:
                  - 0
                  - 1
                  - 2
                  description: 'Location type, as specified by Create Location. 0=SoFi Tech Solutions location ID, 1=Partner location ID, 2=Don''t validate.

                    Pattern: `0`, `1` or `2`

                    Example: `"0"`'
                  example: '0'
                feeType:
                  type: string
                  enum:
                  - FBD
                  - DEL
                  description: 'Type of fee as specified by Create Location Fee. This value must be the original value provided at the time of the fee creation: `FBD` (FBE direct deposit fee) or `DEL` (ACH direct deposit fee)

                    Pattern: `FBD` or `DEL`

                    Example: `"FBD"`'
                  example: FBD
                amount:
                  type:
                  - number
                  - 'null'
                  format: float
                  minimum: 0.01
                  maximum: 999999999999.99
                  description: 'Specify either a flat amount or a percentage. For a flat amount the valid range is between `.01` and `999`. For a percentage the valid range is `.01` (1%) to `1` (100%). When this parameter is populated then `amountType` is required.

                    Pattern: 1, 1.10, 0.5

                    Example: 1.23'
                  example: '1.23'
                amountType:
                  type:
                  - string
                  - 'null'
                  enum:
                  - percent
                  - flat
                  description: 'Specify whether the value in `amount` is a flat rate (`flat`) or a percentage (`percent`). When this parameter is populated then `amount` is required.

                    Pattern: `flat` or `percent`

                    Example: ''flat'''
                  example: '''flat'''''
                minFee:
                  type:
                  - number
                  - 'null'
                  format: float
                  minimum: 0
                  maximum: 999999999999.99
                  description: 'The minimum amount for the fee, if the amount type is a percentage.

                    Pattern: 10, 20.5, 2.33

                    Example: 1.10'
                  example: '1.10'
                maxFee:
                  type:
                  - number
                  - 'null'
                  format: float
                  minimum: 0
                  maximum: 999999999999.99
                  description: 'The maximum amount for the fee, if the amount type is a percentage.

                    Pattern: 10, 20.5, 2.33

                    Example: 1.10'
                  example: '1.10'
                active:
                  type:
                  - string
                  - 'null'
                  enum:
                  - Y
                  - N
                  description: 'Specify whether to activate the fee (`Y`) or deactivate the fee (`N`).

                    Pattern: `Y` or `N`

                    Example: `"Y"`'
                  example: Y
              required:
              - feeType
              - location
              - locationType
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
