                      description: Whether the merchant or acquirer claims that the 3DS authentication was successful.
                      example: false
                    merchant_authentication_assertions_validated:
                      type:
                      - boolean
                      - 'null'
                      description: Validation results of the merchant's assertions.
                      example: true
                    cavv_result_code:
                      type:
                      - string
                      - 'null'
                      description: '_Visa only_. A code that indicates the outcome of CAVV validation. See <a href="ref:api-reference-cavv-result-code" target="_blank">CAVV Result Code</a> for valid values.


                        Example: `"B"`'
                      example: B
                  required:
                  - is_ecommerce
                eligible_for_balance_return:
                  type: boolean
                  description: 'Whether the cardholder''s balance can be returned. This field is always `true` when `transaction_type: Balance Inquiry`. See <a href="doc:authorization-controller-api#balance-inquiry-responses" target="_blank">Balance-inquiry responses</a> in the _Authorization Controller API_ guide for information on returning balances in the response to this message.'
                  example: true
                emv:
                  type: object
                  description: Additional EMV information. Also see EMV entry types under `entry_type` and EMV-related fields under `validation_results`.
                  properties:
                    is_emv:
                      type: boolean
                      description: This field is `true` if the `entry_type` is `EMV Chip` or `EMV Contactless`. When this value is `true`, the remaining fields below will be present, although they may be only partially populated, depending on the card network or EMV entry type.
                      example: true
                    brand:
                      type: string
                      description: 'Type of EMV. Possible values:

                        * `visa`

                        * `mastercard`

                        * `discover`


                        The card network may not match the EMV brand. For example, Visa EMV technology can be used on a card whose BIN is serviced through Allpoint.'
                      example: visa
                      enum:
                      - visa
                      - mastercard
                      - discover
                    terminal_verification_results:
                      type: object
                      description: 'This object interprets the status bits sent by the payment terminal, based on what happened during the transaction, such as whether the cardholder entered a valid PIN. Selected bits of the TVR have been separated out into the Boolean fields below.


                        Use these fields with caution: There can be inconsistencies between different networks, and some bits are not applicable for certain entry types such as `EMV Contactless`. For example, Discover states that byte 3, bits 4 and 5 should be ignored for contactless transactions.'
                      properties:
                        raw:
                          type:
                          - string
                          - 'null'
                          description: 'The raw TVR (as a hex string) that was received in the ISO 8583 message, if present. If not present this field is null and the remaining fields in the `terminal_verification_results` object will not be present.


                            Example: `"0000000000"`'
                        online_pin_entered:
                          type: boolean
                          description: '_Byte 3, bit 3._ Whether a PIN is being sent in the ISO message for validation instead of using offline validation (where the EMV chip on the card validates the PIN). '
                          example: true
                        pin_required_pad_pres_but_no_pin_entered:
                          type: boolean
                          description: _Byte 3, bit 4._ Whether the merchant or cardholder chose to bypass PIN entry, and the PIN pad was operational.
                          example: false
                        pin_required_no_pad_or_bad_pad:
                          type: boolean
                          description: _Byte 3, bit 5._ Whether a PIN was required but there was no PIN pad, or the PIN pad wasn't working.
                          example: true
                        pin_try_limit_exceeded:
                          type: boolean
                          description: _Byte 3, bit 6._ Whether the PIN-try limit was exceeded. For example, the terminal read the PIN-try counter on the chip and it was zero.
                          example: false
                        cardholder_verification_not_successful:
                          type: boolean
                          description: _Byte 3, bit 8._ Whether the terminal indicates that cardholder verification was not successful.
                          example: false
                      required:
                      - raw
                  required:
                  - is_emv
                version:
                  type: string
                  description: 'Auth API version of this webhook.


                    Example: `"2.0"`'
                  example: '2.0'
                iias_info:
