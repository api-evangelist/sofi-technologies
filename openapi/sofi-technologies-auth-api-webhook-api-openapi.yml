                tar_info:
                  type: object
                  description: 'Tokenization authorization request (TAR) data is provided by the network during mobile wallet provisioning. The following are the subfields in a tokenization authorization request. Note the distinctions between Mastercard and Visa networks.


                    For enhanced provisioning security based on some of these fields, see <a href="doc:setup-for-mobile-wallets#enhanced-provisioning-security" target="_blank">Enhanced provisioning security</a> in _Setup for Mobile Wallets_.


                    If you do not receive this data for provisioning approved BINs, contact SoFi Tech Solutions for assistance.'
                  properties:
                    correlation_id:
                      type: string
                      description: '_Mastercard only._ Identifier assigned that can be used by the issuer to associate related tokenization requests and notification messages. 14 alphanumeric characters.


                        Example: `"D0002688797932"`'
                      example: D0002688797932
                    pan_source:
                      type: string
                      description: 'For Mastercard, this field identifies the method by which the cardholder is attempting to tokenize a PAN.

                        - `1` &mdash; Card on file

                        - `2` &mdash; Card added manually

                        - `3` &mdash; Card added via application



                        For Visa, this tag, if present, identifies whether it’s push provisioning.

                        - `01` &mdash; Key entered

                        - `02` &mdash; On file

                        - `03` &mdash; Mobile banking application

                        - `04` &mdash; Token

                        - `05` &mdash; Chip dip

                        - `06` &mdash; Contactless


                        If the value is `03`, then it is push provisioning.'
                      enum:
                      - '1'
                      - '2'
                      - '3'
                      - '01'
                      - '02'
                      - '03'
                      - '04'
                      - '05'
                      - '06'
                    payment_app_instance_id:
                      type: string
                      description: '_Mastercard only._ Identifier associated with the payment application instance installed onto the customer''s device. 48 alphanumeric characters.


                        Example: `"tSnaYXYaTSkz7DoGPz_wvVLhieie4lyhMPuMrvXx4kdAwkgV"`'
                      example: tSnaYXYaTSkz7DoGPz_wvVLhieie4lyhMPuMrvXx4kdAwkgV
                    device_ip:
                      type: string
                      description: 'For Mastercard, this field is the variable-length IP address. Each octet of the IP address is converted to hex and joined into one string, with the order maintained. 8 alphanumeric characters.


                        Example: `"83BF5B74"`


                        For Visa, this field contains the IP address of the device at the time of the provisioning request. 15 characters maximum.


                        Example: `"255.255.255.255"`'
                    acc_id_hash:
                      type: string
                      description: '_Mastercard only._ Contains the customer’s account ID associated with the wallet provider as a PBKDF2 hash. This account ID is typically the email address. The PBKDF2 function is performed using 10 iterations, a salt, and the lowercase account ID as the password. The salt is calculated by taking the lowercase UTF-8 bytes from the account ID and performing a SHA-256 hash operation.


                        **Example**:

                        Input (Password): `csharp@walletprovider.com`

                        Salt: `"41404d1bca85ddb59ab21466e277ac1ac5f61470be120c82a21b1e45b5248123"`

                        Count: `10`

                        Output: `"7098014b646d44c6f3b454c5d54f7a32b3b46e2b0c8e2367f3e5307e3036dfe6"`'
                      example: 7098014b646d44c6f3b454c5d54f7a32b3b46e2b0c8e2367f3e5307e3036dfe6
                    cardholder_name:
                      type: string
                      description: '_Mastercard only._ Contains the name of the cardholder. The format is represented in one of these two formats:

                        - LASTNAME/FIRSTNAME with the names delimited by a slash `/`.


                        Example: `"SMITH/JOE"`

                        - FIRSTNAME LASTNAME.


                        Example: `"JOE SMITH"`


                        27 characters maximum. If the cardholder’s name is longer than 27 positions, the data is truncated.'
                      example: SMITH/JOE
                    tokenization_recommendation:
                      type: integer
                      description: 'The tokenization decision suggested by the wallet provider.


                        For Mastercard, possible values are:

                        - `0` &mdash; Decline

                        - `1` &mdash; Approve

                        - `2` &mdash; Requires additional authentication


                        For Visa, possible values are:

                        - `0` &mdash; Unconditionally approved

                        - `1` &mdash; Conditionally approved with further cardholder verification

                        - `2` &mdash; Not approved'
                      enum:
                      - 0
                      - 1
                      - 2
                    tokenization_recommendation_standard_ver:
                      type: string
                      description: 'The version of the standards the wallet provider is using to determine the suggested tokenization recommendation.


                        - For Mastercard, this value is 2 digits.


                        Example: `"01"`

                        - For Visa, this value is a decimal value.


                        Example: `"0002.00"`'
                    device_score:
                      type: integer
                      description: 'The score assigned by the wallet provider for the device. The score is returned as a value between `1` and `5`, with `5` being most trusted.


                        Example: `5`'
                      enum:
                      - 1
                      - 2
                      - 3
                      - 4
                      - 5
                    account_score:
                      type: integer
                      description: '_Mastercard only._ Score assigned by the wallet provider for the <<glossary:PAN>>. Value between`1` and `5`, with `5` being most trusted.


                        Example: `5`'
                      enum:
                      - 1
                      - 2
                      - 3
                      - 4
                      - 5
                    active_tokens:
                      type: string
                      description: '_Mastercard only._ Number of existing, active tokens for the PAN, excluding card-on-file tokens. Space-filled when the requested token is digitized to a server.


                        Example: `"08"`'
                      example: 08
                    tokenization_recommendation_reason_code:
                      type: string
                      description: 'Indicates the specific reason the wallet provider is suggesting the tokenization recommendation.


                        For Mastercard, the data of this field is a hex-encoded bitmap, whereby each bit corresponds to a specific reason code. If the wallet provider returns no reason, this field will contain spaces.


                        See the possible values for Visa in the <a href="ref:api-reference-tokenization-recommendation-reason-codes#visa-codes" target="_blank">Tokenization Recommendation Reason Codes</a>.


                        Example: `"008011"`'
                    tokenization_recommendation_reason_codes_parsed:
                      type: string
                      description: '_Mastercard only._ Indicates the specific reason the wallet provider is suggesting the tokenization recommendation. This field shows the interpretation of the hex-encoded bitmap in the `tokenization_recommendation_reason_code` field for Mastercard.


                        See the possible values for this field in the <a href="ref:api-reference-tokenization-recommendation-reason-codes#mastercard-codes" target="_blank">Tokenization Recommendation Reason Codes</a>.


                        Example: `"08" `'
                    location:
                      type: string
                      description: 'Latitude and longitude points where the cardholder''s device was located at the time the tokenization was attempted.


                        - For Mastercard. The decimal latitude and longitude values, converted to hexadecimal.


                        Example: `"2F197A2E1"`

                        - For Visa, when available, the latitude and longitude points are provided with up to 4 digits of precision or rounded to a less-granular level.


                        Example: `"+39.13/-77.55"`'
                    last_four_digits:
                      type: string
                      description: '_Mastercard only._ Last four digits of the cardholder''s mobile phone number associated with the active wallet.


                        Example: `"0885"`'
                      example: 0885
                    token_type:
                      type: string
                      description: 'The type of requested token.

                        - `C` &mdash; Mastercard cloud-based payments

                        - `F` &mdash; Card on file

                        - `S` &mdash; Embedded secure element

                        - `H` &mdash; <<glossary:VTS>> cloud token'
                      enum:
                      - C
                      - F
                      - S
                      - H
                    consumer_identifier:
                      type: string
                      description: '_Mastercard only._ Unique identifier for each cardholder, which must be verified by the financial institution before a cardholder can add their credentials to the payment-enabled device. Default: blank.'
                    device_type:
                      type: string
                      description: '_Visa only._ Device type value.

                        - `00` &mdash; Unknown

                        - `01` &mdash; Mobile phone

                        - `02` &mdash; Tablet

                        - `03` &mdash; Watch

                        - `04` &mdash; Mobile phone or tablet

                        - `05` &mdash; Personal computer'
                      enum:
                      - 0
                      - 1
                      - 2
                      - 3
                      - 4
                      - 5
                    device_language:
                      type: string
                      description: '_Visa only._ Language used by the cardholder’s device. 3 characters maximum.


                        Example: `"eng"` for English.'
                      example: eng
                    device_id:
                      type: string
                      description: '_Visa only._ The device ID. 48 characters maximum.


                        Example: `"MTgwOTIxMTQzMjAwMTA0LUh0"`'
                      example: MTgwOTIxMTQzMjAwMTA0LUh0
                    device_number:
                      type: string
                      description: '_Visa only._ Contains the device number, or the full or partial telephone number, when available. Provided by the Visa network.


                        Example: `"15127717396"`'
                      example: '15127717396'
                    device_name:
                      type: string
                      description: '_Visa only._ The name of the device given by the cardholder. 16 characters maximum. Value is truncated when longer than maximum length.


                        Example: `"Work Phone"`'
                      example: Work Phone
                    account_id:
                      type: string
                      description: '_Visa only._ Contains the wallet account ID.


                        Example: `"eg2t6TyJQ2G8NIraaCypzg"`'
                      example: eg2t6TyJQ2G8NIraaCypzg
                    account_email_addr:
                      type: string
                      description: '_Visa only._ Contains the hashed full email address for the cardholder account that was sent by the wallet provider.


                        Example: `"\xc1_\xf8\xc8_/\xd1%%\x06\xc4?_"`'
                      example: Á_øÈ_/Ñ%%Ä?_
                    visa_token_score:
                      type: string
                      description: '_Visa only._ Contains the Visa Token Score associated with a token. Scores range from 01-99, with higher values indicating higher risk. `00` indicates a token was not scored.

                        Example: `"01"`'
                      example: '01'
                  required:
                  - correlation_id
                  - pan_source
                  - payment_app_instance_id
                  - device_ip
                  - acc_id_hash
                  - cardholder_name
                  - tokenization_recommendation
                  - tokenization_recommendation_standard_ver
                  - device_score
                  - account_score
                  - active_tokens
                  - location
                  - last_four_digits
                  - token_type
                  - consumer_identifier
                  - device_id
                fleet_info:
                  type: object
                  description: Information that is provided for cards with fleet-card BINs, which are Mastercard only. See <a href="doc:fleet-cards" target="_blank">Fleet Cards</a> for more information.
                  properties:
                    fleet_card_driver_number:
                      type: integer
                      description: 'Driver ID. 17 digits maximum.


                        Example: `06123456`'
                    fleet_card_vehicle_number:
                      type: integer
                      description: 'Vehicle ID. 17 digits maximum.


                        Example: `03123`'
                    fleet_prompt_data:
                      type: integer
                      description: 'Contains occurrences of the prompt code read from a card chip. There can be up to 5 prompt codes. Consult the documentation from Mastercard for the full list.


                        Example: `002` (vehicle number)'
                    merchant_override_indicator:
                      type: integer
                      description: 'Indicates if the merchant point-of-sale supports the fleet spend control override capability: `0` (does not support) or `1` (supports)'
                    control_override_items:
                      type: integer
                      description: Provides merchants with information, on a transaction basis, to override purchase restrictions to allow products to be purchased that may not have otherwise been allowed. Only to be populated when DE106SE2 contains the value `1`, indicating that the merchant point-of-sale supports the fleet spend-control override capability.
                    fuel_info:
                      type: integer
                      description: 'Contains item-level detail information of the motor fuel product(s) purchased at the POS (3 digit code). Can have up to 3 subfields. Consult the documentation from Mastercard for the full list.


                        Example: `036` (racing fuel)'
                    non_fuel_info:
                      type: integer
                      description: 'Contains item-level detail information of the non-fuel product(s) purchased at the POS. Can have up to 12 subfields. Consult the documentation from Mastercard for the full list.


                        Example: `102` (car wash)'
                aifi_fields:
                  type: object
                  description: _Colombia only_. Information related to <a href="doc:colombia-atm-issuer-fee-inquiries" target="_blank">ATM issuer-fee inquiries</a>.
                  properties:
                    issuer_fee_inquiry_indicator:
                      type: string
                      description: Contains `"01"` to indicate issuer-fee inquiry request. DE112SE035.
                    pos_transaction_status:
                      type: integer
                      description: Contains `"8"` to indicate account-status inquiry (ASI) service. DE061SF7.
                    issuer_fee_amt:
                      type: string
                      default: '0.0'
                      description: 'Amount of the ATD (domestic ATM) fee. This amount is displayed to the cardholder as the issuer fee. DE112SE036.


                        Example: `"15000.00"`'
                merchant_advice_code:
                  type:
                  - string
                  - 'null'
                  description: '_Mastercard only._ Contains the supported merchant advice code (MAC), if applicable: `03`, `40`, `41`, or `43`. The GMACD parameter must be set to `Y` to enable MAC decisioning.'
                  example: '40'
                fraud_results:
                  type: object
                  description: _Mastercard only_. Contains the results from the Mastercard Fraud Rule Management Service. If you subscribe to this service, ask SoFi Tech Solutions to enable this object. Consult the documentation from Mastercard for DE048SE56 to interpret the values.
                  properties:
                    AQV:
                      type: string
                      description: 'GDV-based spend ranking.


                        Example: `"400"`'
                      example: '400'
                    AQF:
                      type: string
                      description: 'Frequency-based spend ranking.


                        Example: `"100"`'
                      example: '100'
                    AQS:
                      type: string
                      description: 'Segment qualifier.


                        Example: `"002"`'
                      example: '002'
                    AIQ:
                      type: string
                      description: 'Digital transaction insights.


                        Example: `"3QZ"`'
                      example: 3QZ
                  required:
                  - AQV
                  - AQF
                  - AQS
                  - AIQ
                fraud_scoring_data:
                  type: object
                  description: '_Mastercard only._ DE048SE75. Contains the results from Mastercard''s Expert Monitoring, Fraud Scoring Service, or Decision Intelligence (DI) service. If you subscribe to any of these services, ask SoFi Tech Solutions to enable this object. Consult the documentation from Mastercard for your service to interpret the values.

                    '
                  properties:
                    risk_assessment_score:
                      type: integer
                      description: 'Mastercard Decision Intelligence (DI) score ranging from `0-999`.


                        Example: `"089"`'
                      example: '89'
                    risk_assessment_score_reason_code:
                      type: string
                      description: 'Fraud reason code. Indicates the key factors that influenced the value in `risk_assessment_score`.


                        Example: `"64"`'
                      example: '64'
                    real_time_fraud_score:
                      type: string
                      description: 'The Fraud Rule Manager Service provides the rule-adjusted score of `000-999`, where `000` indicates the least likely fraudulent transaction and `999` indicates the most likely fraudulent transaction.


                        Example: `"089"`'
                      example: 089
                    real_time_fraud_score_reason_code_1:
                      type: string
                      description: 'An alphanumeric reason code that identifies the data used to derive the `real_time_fraud_score`.


                        Example: `"64"`'
                      example: '64'
                    real_time_fraud_score_reason_code_2:
                      type: string
                      description: 'An alphanumeric reason code that identifies the data used to derive the `real_time_fraud_score`.


                        Example: `"00"`'
                      example: '00'
                digital_payment_data:
                  type: object
                  description: '_Mastercard only._ DE104SE4. Contains the results from Mastercard''s Token Authentication Framework (TAF) program. If you subscribe to Mastercard''s Expert Monitoring, Fraud Scoring Service, or Decision Intelligence (DI) service, ask SoFi Tech Solutions to enable this object to use for decisioning. Consult the documentation from Mastercard on DE104 Subelement 004 to interpret the values.

                    '
                  properties:
                    digital_service_provider:
                      type: string
                      description: 'Identifies the entity that authenticated the transaction. Consult the documentation from Mastercard for a complete list of values for DE104SE4SF1.


                        Example: `"001005A0010"`'
                      example: 001005A0010
                    digital_authentication_data:
                      type: string
                      description: 'Confirms that the transaction was fully authenticated, and identifies the authentication method used. Consult the documentation from Mastercard for a complete list of values for DE104SE5SF1.


                        Example:`"0010054TRID00200500000"`'
                      example: 0010054TRID00200500000
                latest_incremental_id:
                  type: integer
                  description: 'The `auth_id` of the previous authorization in an incremental sequence when `incremental_auth: true`. This field contains the same information as `original_id` and is present only by request.


                    Example: `13371854`'
                  example: 13371854
                original_incremental_id:
                  type: integer
                  description: 'The `auth_id` of the first authorization in an incremental sequence when `incremental_auth: true`. This field is present only by request.


                    Example: `13369203`'
                  example: 13369203
                account_attack_intelligence_score:
                  type:
                  - string
                  - 'null'
                  description: '_Visa only_. A score for <<glossary:CNP>> transactions to evaluate risk of enumeration attacks. Field 104, Dataset 5B, Tag 85. Valid values are `01-99` or null. Lower scores mean less risk.


                    Example: `"24"`'
                  example: 24
                relay_resistance_protocol_data:
                  type: object
                  description: _Mastercard only_. DE048SE71. For tokenized (mobile wallet), contactless transactions, this is information captured at the terminal related to the possibility of relay attacks. For valid values, see <a href="ref:api-reference-relay-resistance-protocol-data" target="_blank">Relay Resistance Protocol Data</a>.
                  properties:
                    on_behalf_service:
                      type: string
                      description: 'The type of service performed on the transaction.


                        Example: `"51"`'
                      example: '51'
                    result_1:
                      type: string
                      description: 'The first result from the on-behalf service.


                        Example: `"A"`'
                      example: A
                    result_2:
                      type: string
                      description: 'The second result from the on-behalf service, if any.


                        Example: `"K"`'
                      example: K
                service_processing_type:
                  type:
                  - string
                  - 'null'
                  description: '_Visa only_. Service processing type for scheduled, deferred <<glossary:OCT>>s. See <a href="ref:api-reference-service-processing-types" target="_blank">Service Processing Types</a> for valid values. Field 104 Dataset 57 Tag 80.


                    Example: `"03"`'
                  example: '03'
                visa_atm_managed_services:
                  type: object
                  description: _Visa only_. Managed-service information. Field 111 Dataset 02.
                  properties:
                    managed_service_indicator:
                      type: string
                      description: 'Whether this is a managed-service transaction. Tag 82.


                        Example: `"Y"`'
                      example: Y
                    agreement_type:
                      type: string
                      description: 'The type of managed service that was provided for this transaction. Consult the documentation from Visa for valid values. Tag C1. Max 4 char.


                        Example: `"1234"`'
                      example: '1234'
                is_in_person_tap_transaction:
                  type: boolean
                  description: _Visa only_. Whether this is a direct in-person tap transaction. Applies only to <<glossary:OCT>>s and <<glossary:AFT>>s. Field 34.
                  example: true
                vdcap_info:
                  type: object
                  description: _Visa only_. <<glossary:VDCAP>> information from Field 34, Field 56, and Field 111.
                  properties:
                    authentication_program:
                      type: string
                      description: 'Indicates which authentication solution or data-sharing solution was used to process the transaction. See <a href="ref:api-reference-vdcap-info" target="_blank">VDCAP Info</a> for valid values. Field 34 Dataset 01 Tag C0.


                        Example: `"01"`'
                      example: '01'
                    consumer_device_ip_address:
                      type: string
                      description: 'External IP address that is the device public IP address used by the 3DS requestor application when it connects to the 3DS requestor environment. Field 34 Dataset 01 Tag 92.


                        Example: `"172.16.22.52"`'
                      example: 172.16.22.52
                    applied_special_service:
                      type: string
                      description: 'Indicates whether the merchant has used the eligible authentication or data-sharing method and provided the required data elements. Visa sends `1` (<<glossary:VDCAP>>) if all the conditions are met. Field 111 Dataset 56 Tag 89.


                        Example: `"1"`'
                      example: '1'
                    other_phone_number:
                      type: string
                      description: 'A phone number belonging to the cardholder. Field 56 Dataset 02 Tag 83. Max 16 char.


                        Example: `"8015552333"`'
                      example: '8015552333'
                    browser_ip_address:
                      type: string
                      description: '3DS browser IP address. Field 34 Dataset 01 Tag 89.


                        Example `"10.0.45.66"`'
                      example: 10.0.45.66
                    other_email_address:
                      type: string
                      description: 'An email address belonging to the cardholder. Field 56 Dataset 02 Tag 86. Max 99 char.


                        Example: `"3dsuser@exampledomain.com"`'
                      example: 3dsuser@exampledomain.com
                    device_id:
                      type: string
                      description: 'Unique identifier associated with the cardholder device. Field 34 Dataset 06 Tag 86. Max 64 char.


                        Example: `"device000"`'
                      example: device000
                credit_info:
                  type: object
                  description: Contains information related to credit accounts.
                  properties:
                    credit_card_balance:
                      type: number
                      description: 'The outstanding balance on a credit account. This value can be interpreted as being accurate as of the `opentobuy_ts`.


                        Example: "-249.51"'
                      example: '-249.51'
                    opentobuy_ts:
                      type: string
                      description: 'Date and time when when the `credit_card_balance` was last captured. Format is YYYY-MM-DD hh:mm:ss.ssssss and timezone is always `MST`, which is Arizona time (GMT -0700).


                        Example: `"2025-03-17 14:06:50.243654"`'
                      example: '2025-03-17 14:06:50.243654'
                mastercard_transaction_id_data:
                  type: object
                  description: _Mastercard only_. Derived from DE105, Multi-Use Transaction Identification Data. Contains the <<glossary:TLID>>, which is globally unique in a distributed environment and used as a single unique reference to perform matching and linking of all message activity
                  properties:
                    tlid:
                      type: string
                      description: 'DE105SE1. Transaction link identifier. A unique ID that Mastercard generates for each original transaction. Example: `"aabb112233445566"`'
                      example: aabb112233445566
                    economically_related_tlid:
                      type: string
                      description: DE105SE2. The Mastercard-generated TLID from an economically related independent transaction that a customer retains and returns in subsequent economically related transactions.
                      example: ff00ee11dd22cc33
                    lifecycle_tlid_validation_data:
                      type: object
                      description: Data relative to the TLID lifecycle.
                      properties:
                        action_indicator:
                          type: string
                          description: 'DE105SE3SF1. Indicates whether Mastercard modified the `tlid`, either because the customer did not provide a TLID in a lifecycle-linking scenario, or the TLID was unmatched. Possible values:

                            - `1` &mdash; Mastercard populated `tlid` with the original message TLID. The customer did not submit a lifecycle message with a TLID, and so `customer_provided_tlid` will not be populated.

                            - `2` &mdash; Mastercard populated `tlid` with the original lifecycle message TLID. The customer submitted the lifecycle message with a TLID value that did not match the original message. Mastercard moved the customer-provided TLID value to `customer_provided_tlid`.

                            - `3` &mdash; Mastercard generated a new TLID value for `tlid`. Mastercard was unable to match this lifecycle message to any original message. If the customer submitted this transaction with a TLID value, Mastercard moved the customer-provided TLID value to `customer_provided_tlid`.'
                          example: '2'
                        customer_provided_tlid:
                          type: string
                          description: DE105SE3SF2. Contains the customer-provided TLID value from DE105SE1 (`tlid`) when Mastercard is unable to confirm the validity of that customer-provided TLID value.
                          example: cc998877dd665544
