                  description: This object contains information related to <<glossary:3DS>> authentication, if the website supported 3DS. Included in this information is the result of validating the <<glossary:AAV>> for Mastercard or the <<glossary:CAVV>> for Visa. For detailed information about these fields, refer to <a href="doc:3-d-secure-access-control-server#the-ecommerce-object" target="_blank">The ecommerce object</a> in the _3-D Secure Access Control Server_ guide.
                  properties:
                    is_ecommerce:
                      type:
