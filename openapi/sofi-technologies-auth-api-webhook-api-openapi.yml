                      example: true
                    merchant_asserts_authentication_attempted:
                      type:
                      - boolean
                      - 'null'
                      description: Whether the merchant or acquirer claims that 3DS authentication was attempted.
                      example: None
                    merchant_asserts_authenticated:
                      type:
                      - boolean
