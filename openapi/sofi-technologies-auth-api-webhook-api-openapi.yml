openapi: 3.2.0
info:
  title: Auth API Webhook API
  description: '# Overview


    Auth API is a webhook that allows clients to participate in the authorization

    decision making process.'
  version: 2.0.0
servers:
- url: https://example.client.domain.com
  description: You will provide the base URL you would like to use for Auth API. The endpoint should use HTTPS.
security:
- bearerAuth: []
tags:
- name: Auth API Webhook
paths:
  /basepath/Authorization:
    post:
      summary: Auth API Webhook 2.0
      description: 'With the Auth API 2.0 webhook, you can participate in authorization decisions. For this webhook there is only one verb: `POST`. SoFi Tech Solutions sends information about the authorization request in the body of the HTTP request, in JSON. Your decision should be in the body of the HTTP response.


        In the authorization information that we send, the `response_code` is the current response code to be returned to the merchant, unless you override it. Use the `response_code` field in the HTTP response body to override the authorization response code, as desired.


        See the Authorization Controller API guide for more information.

        > 📘 About the field properties

        >

        > SoFi Tech Solutions initializes the webhook payload by setting all fields to `null`. As values come in with the ISO 8583 authorization request, we populate the respective payload fields with the data the network sends, which can include empty strings (`" "`). This documentation shows the field properties (data type, nullability, required) that are most likely. However, variations by network and transaction type mean that a few of the values passed in the webhook payload can vary from what is shown here.'
      operationId: webhook_authorization_post_2
      tags:
      - Auth API Webhook
      parameters:
      - name: X-Request-ID
        in: header
        description: A unique identifier for the HTTP request.
        schema:
          type: string
          format: uuid
        required: true
      requestBody:
        description: Information about the authorization request.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auth_type:
                  type: string
                  description: 'All transactions are grouped into three basic message types:

                    * `Auth` &mdash; Authorization request. MTI x1xx (authorization or preauthorization over credit rails or preauthorization over debit rails) or x2xx (authorization over debit rails).

                    * `Advice` &mdash; Notification of a completed transaction. MTI xx2x. Only a `00` response code is permitted.

                    * `Reversal` &mdash; A reversal of a previous authorization. MTI x4xx. May or may not reference the previous authorization.'
                  enum:
                  - Auth
                  - Advice
                  - Reversal
                transaction_type:
                  type: string
                  description: 'The transaction type indicates at a lower level what kind of transaction this is.  This field is used to differentiate merchant credits, ATMs, balance inquiries, etc.

                    * `Preauth` &mdash; A preauthorization for an estimated amount. Often followed by a completion advice.

                    * `Auth` &mdash; Conventional authorization request. Also used with advices and reversals.

                    * `ATM` &mdash; ATM withdrawal.

                    * `Cash Advance` &mdash; Cash advance from a teller.

                    * `Balance Inquiry` &mdash; Balance inquiry from an ATM.

                    * `Merchant Credit` &mdash; A credited amount from a merchant. Usually does not reference a previous authorization.

                    * `Adjustment` &mdash; Debit adjustment, unrelated to a previous authorization. The merchant is adjusting a cardholder balance.

                    * `Payment` &mdash; Loading funds onto a card.

                    * `Tokenization` &mdash; A request to tokenize a card for use in a mobile wallet or a request from a merchant to validate a tokenized card for payment.'
                  enum:
                  - Preauth
                  - Auth
                  - ATM
                  - Cash Advance
                  - Balance Inquiry
                  - Merchant Credit
                  - Adjustment
                  - Payment
                  - Tokenization
                id:
                  type: string
                  description: "Unique identifier for this authorization. \n\nExample: `\"DHWJtI8zRjuDcgF8hru3oQ\"`"
                  example: DHWJtI8zRjuDcgF8hru3oQ
                timestamp:
                  type: string
                  description: 'Date and time when the webhook was sent by SoFi Tech Solutions.


                    Format is `<timestamp><timezone>`, where `timestamp` is `YYYYMMDD:HHMMSS` and `timezone` is always `MST`, which is Arizona time (GMT -0700).


                    Example: `"20250315:121504MST"`'
                  example: 20250315:121504MST
                network:
                  type: string
                  description: 'Card network name. Possible values:


                    * `Visa`

                    * `Allpoint`

                    * `Discover`

                    * `Mastercard`

                    * `Star`

                    * `Pulse`'
                  enum:
                  - Visa
                  - Allpoint
                  - Discover
                  - Mastercard
                  - Star
                  - Pulse
                subnetwork:
                  type: string
                  description: 'The subnetwork name. This is the same as `network` if there is no subnetwork. Possible values:


                    * `Visa`

                    * `Visa Interlink`

                    * `Visa PLUS`

                    * `Mastercard Banknet`

                    * `Mastercard Debit Switch`

                    * `Discover`

                    * `Allpoint`

                    * `Star`

                    * `Star MoneyPass`

                    * `Star Presto`

                    * `Pulse`'
                  enum:
                  - Visa
                  - Visa Interlink
                  - Visa PLUS
                  - Mastercard Banknet
                  - Mastercard Debit Switch
                  - Discover
                  - Allpoint
                  - Star
                  - Star MoneyPass
                  - Star Presto
                  - Pulse
                account:
                  type: object
                  properties:
                    xid:
                      type: integer
                      description: 'Internal ID for the account.


                        Example: `5398373`'
                      example: 5398373
                    cad:
                      type: integer
                      description: 'System-generated ID for the card. This ID has a 1:1 relationship with the <<glossary:PAN>>.


                        Example: `72450868`'
                      example: 72450868
                    prn:
                      type: string
                      minLength: 12
                      maxLength: 12
                      description: '<a href="doc:about-accounts#prn" target="_blank">Payment reference number</a> for the account. 12 digits.


                        Example: `"999200002022"`'
                      example: '999200002022'
                    product_id:
                      type:
                      - integer
                      - 'null'
                      description: 'Product ID for the account, as provided by SoFi Tech Solutions.


                        Example: `2577`'
                      example: 2577
                    program_id:
                      type:
                      - integer
                      - 'null'
                      description: 'Program ID for the account, as provided by SoFi Tech Solutions.


                        Example: `566`'
                      example: 566
                    pan:
                      type: string
                      description: 'Last four digits of the <<glossary:PAN>> of the card.


                        Example: `"5198"`'
                      example: '5198'
                    account_status:
                      type: string
                      description: 'Account status code. See the possible values in the <a href="ref:api-reference-account-statuses" target="_blank">Account Statuses</a> enumeration.


                        Example: `"N"`'
                    card_status:
                      type: string
                      example: N
                      description: 'Card status code. See the possible values in the <a href="ref:api-reference-card-statuses" target="_blank">Card Statuses</a> enumeration.


                        Example: `"N"`'
                    expiration_date:
                      type: string
                      minLength: 4
                      maxLength: 4
                      description: 'Card expiration date (format `YYMM`).


                        Example: `"2103"`.'
                      example: '2103'
                    track_expiration_date:
                      type:
                      - string
                      - 'null'
                      minLength: 4
                      maxLength: 4
                      description: 'The expiration date (format: `YYMM`) that was read from the card''s magnetic stripe and sent in the ISO message, if present and applicable. For example, this field will not be present for a card-not-present transaction.


                        Example: `"2103"`'
                      example: '2103'
                    merchant_supplied_expiration_date:
                      type:
                      - string
                      - 'null'
                      minLength: 4
                      maxLength: 4
                      description: 'The expiration date (format: `YYMM`) supplied by the merchant, if present and applicable.



                        Example: `"2103"`'
                      example: '2103'
                  required:
                  - xid
                  - cad
                  - prn
                  - pan
                  - account_status
                  - card_status
                  - expiration_date
                  - track_expiration_date
                  - merchant_supplied_expiration_date
                amounts:
                  type: object
                  description: 'The amounts are always unsigned. To calculate the sign for an amount, start with a factor of &ndash;1, and then apply another factor of &ndash;1 for each of the following criteria:

                    * `"auth_type": "Reversal"`

                    * `"transaction_type": "Merchant Credit"`

                    * `"transaction_type": "Payment"`


                    Amount fields may not display a numeric value for non-active cards. Instead, the string `"none"` could be displayed.'
                  properties:
                    currency:
                      type:
                      - string
                      - 'null'
                      minLength: 3
                      maxLength: 3
                      description: 'The currency code for the amounts, unless otherwise indicated. This is the currency of the cardholder account. ISO 4217 Numeric Currency Code. 3 digits.


                        Example: `"840"`'
                      example: '840'
                    trans_amount:
                      type: string
                      description: 'Transaction amount. Full amount of the authorization request, including upcharges and fees and after any currency conversion is performed.


                        Example: `"12.40"`'
                      example: '12.40'
                    partial_amount:
                      type: string
                      default: '0.0'
                      description: 'If `partial_supported: true` and `response_code` is `10` or `87`, this is the amount of the partial approval.


                        Example: `"10.00"`'
                      example: '10.00'
                    cashback_amount:
                      type: string
                      default: '0.0'
                      description: 'Cashback amount requested. This amount is included in `trans_amount`.


                        Example: `"5.00"`'
                      example: '5.00'
                    fee_amount:
                      type: string
                      default: '0.0'
                      description: 'Amount of any fees. This amount is included in `trans_amount`.


                        Example: `"1.50"`'
                      example: '1.50'
                    available_funds:
                      type: string
                      description: 'The card''s <a href="doc:account-balances#available-balance" target="_blank">available balance</a> before this transaction is applied.


                        If this authorization request is approved, the card''s available balance is affected within a few milliseconds after the approval is sent to the network. Keep in mind that this is the available balance known to SoFi Tech Solutions&mdash;if you are the system of record for your program, refer to your records to determine whether the account has sufficient funds.



                        Example: `100.00`'
                      example: 100
                    amt_til_limit:
                      type: string
                      default: '0.0'
                      description: 'Amount remaining before `nearest_limit` is reached.


                        Example: `502.80`'
                      example: 502.8
                    nearest_limit:
                      type:
                      - string
                      - 'null'
                      description: 'The name of the first limit that would be reached if a partial authorization or denied authorization is overridden via the `override_limit` field. This field is present only when the limit would be reached in overriding the authorization.


                        Example: `"PCL Daily Limit"`'
                      example: PCL Daily Limit
                    local_currency:
                      type: string
                      minLength: 3
                      maxLength: 3
                      description: 'ISO 4217 numeric currency code for `local_currency_amount`, which is the currency at the point of sale. 3 digits.


                        Example: `"124"`'
                      example: '124'
                    local_currency_amount:
                      type: string
                      default: '0.0'
                      description: 'Amount of the request in the currency at the point of sale. Upcharges and fees are not included.


                        Example: `"21.00"`'
                      example: '21.00'
                    settle_currency:
                      type:
                      - string
                      - 'null'
                      minLength: 3
                      maxLength: 3
                      description: 'ISO 4217 numeric currency code for `settlement_currency_amount`. To understand what a settlement currency is, see <a href="doc:multicurrency-bins" target="_blank">Multicurrency BINs</a>. 3 digits.


                        Example: `"978"`'
                      example: '978'
                    settle_currency_amount:
                      type: string
                      default: '0.0'
                      description: 'Amount of the request in the settlement currency. Upcharges and fees are not included.



                        Example: `"17.00"`'
                      example: '17.00'
                    billing_currency:
                      type: string
                      minLength: 3
                      maxLength: 3
                      description: 'ISO 4217 numeric currency code for `billing_currency_amount`.


                        Example: `840`'
                      example: 840
                    billing_currency_amount:
                      type: string
                      default: '0.0'
                      description: 'The amount of the transaction in the billing currency, which is the currency of the card account.


                        Example: `"12.40"`'
                      example: '12.40'
                    local_surcharge_amt:
                      type: string
                      default: '0.0'
                      description: 'The surcharge amount in the currency at the point of sale.


                        Example: `"0.50"`'
                      example: '0.50'
                    settle_surcharge_amt:
                      type: string
                      default: '0.0'
                      description: 'The surcharge amount in the settlement currency.


                        Example: `"0.75"`'
                      example: '0.75'
                    settle_exchange_rate:
                      type: string
                      description: 'The factor used to convert from the local request amount to the settlement amount. The string has the pattern `<shift digit><exchange rate digits>`. The first digit specifies how many places from the right the decimal is moved. For example, `69985022` translates to an exchange rate of 9.985022%.


                        Example: `"69985022"`'
                      example: '69985022'
                    exchange_rate:
                      type: string
                      description: 'The factor used to convert from the local request amount to the billing amount. The string has the pattern `<shift digit><exchange rate digits>`. The first digit specifies how many places from the right the decimal is moved. For example, `69985022` translates to an exchange rate of 9.985022%.


                        Example: `"65991234"`'
                      example: '65991234'
                    upcharge_amount:
                      type: string
                      default: '0.0'
                      description: 'The upcharge amount, which is included in `trans_amount`.


                        Example: `"75.00"`'
                      example: '75.00'
                  required:
                  - currency
                  - trans_amount
                  - cashback_amount
                  - fee_amount
                  - available_funds
                  - amt_til_limit
                  - upcharge_amount
                mcc:
                  type: integer
                  description: 'Merchant category code. This value does not include leading zeros.


                    Example: `5992`'
                  example: 5992
                digital_commerce_data:
                  type: object
                  description: '_Mastercard only_. Contains data regarding a digital commerce transaction. Derived from DE048SE48.  See <a href="doc:auth-api-field-detail#digital-commerce-solutions-indicators" target="_blank">Digital Commerce Solutions Indicators</a> for more information.

                    '
                  properties:
                    entity_type_name:
                      type: string
                      description: 'SF3. The check-in entity type and entity name.


                        Example: `"202010030220"`

                        '
                      example: '202010030220'
                    domain_id:
                      type: string
                      description: 'SF1. The entity responsible for populating the other fields in this object.


                        Example: `"01"`

                        '
                      example: '01'
                    program_id:
                      type: string
                      description: "SF2. The specific digital commerce program.\n          \n\nExample: `\"01\"`\n"
                      example: '01'
                    checkin_method:
                      type: string
                      description: 'SF4. The methods that a check-in entity applies to validate cardholder presence. **Required** when `program_id: 04`.


                        Example: `" "`

                        '
                      example: null
                merchant:
                  type: object
                  properties:
                    acquirer_id:
                      type:
                      - string
                      - 'null'
                      description: 'The acquiring institution ID.


                        Example: `"406160"`'
                      example: '406160'
                    terminal_id:
                      type:
                      - string
                      - 'null'
                      description: 'The ID for the device that acquired the card information.


                        Example: `"A1Z23B99"`'
                      example: A1Z23B99
                    merchant_id:
                      type:
                      - string
                      - 'null'
                      description: 'The merchant ID, as assigned by the network.


                        Example: `"39AJKEO30634KVN3"`'
                      example: 39AJKEO30634KVN3
                    merchant_description:
                      type:
                      - string
                      - 'null'
                      description: 'The merchant description.


                        Example: `"123 WIDGETS MERCHANT BEVERLY HILLS CA"`'
                      example: 123 WIDGETS MERCHANT     BEVERLY HILLSCA
                    merchant_country:
                      type:
                      - string
                      - 'null'
                      description: 'ISO 3166-1 country code for the country where the merchant is located. 3 digits.


                        Example: `"840"`'
                      example: '840'
                    merchant_postal_code:
                      type:
                      - string
                      - 'null'
                      description: 'Postal code, nine characters. Left-justified and padded with zeros. If there are nine zeros, then no postal code was provided.


                        Example: `"902100000"`'
                      example: '90210'
                    merchant_state:
                      type:
                      - string
                      - 'null'
                      description: 'Two-letter state or provincial designator for the merchant''s location.


                        Example: `"NV"`'
                      example: NV
                    terminal_network:
                      type:
                      - string
                      - 'null'
                      description: 'Network to which the terminal belongs, Possible values are `VPA` (Visa PLUS Alliance), `Allpoint`, or `None` (another network). If you are not configured to receive this data, the value will always be `None`.



                        Example: `"VPA"`'
                      example: VPA
                      enum:
                      - Allpoint
                      - VPA
                      - None
                  required:
                  - acquirer_id
                  - terminal_id
                  - merchant_id
                  - merchant_description
                  - merchant_country
                  - merchant_postal_code
                  - merchant_state
                  - terminal_network
                mti:
                  type: string
                  description: 'Message-type indicator, as defined by ISO 8583. See <a href="doc:authorization-controller-api#message-types" target="_blank">Message types</a> in the _Authorization Controller API_ guide.


                    Example: `"0200"`'
                  example: '0200'
                transaction:
                  type: object
                  description: Information about the transaction
                  properties:
                    recurring:
                      type: string
                      description: 'Whether a transaction is recurring: `Y` or `N`.


                        Example: `"N"`'
                      example: N
                    cardholder_present:
                      type: string
                      description: 'Whether the physical card was present at the point of sale: `Y` or `N`.


                        Example: `"Y"`'
                      example: Y
                    transaction_initiator_code:
                      type: string
                      description: '*Mastercard only.* Whether the transaction was initiated by the cardholder or the merchant. Populated only when DE048 subfield 22 is present in the authorization request. See <a href="ref:api-reference-cit-and-mit-indicators" target="_blank">CIT and MIT Indicators</a> for more information.


                        Example: `"M101"`'
                      example: M101
                    is_advance_payment:
                      type: boolean
                      description: _Visa only_. Field 126 SE 13. Whether the transaction is an advance payment, meaning that the merchant secures the payment before the goods or services are available.
                      example: true
                  required:
                  - recurring
                  - cardholder_present
                validation_results:
                  type: object
                  properties:
                    cvv1:
                      type: string
                      description: 'Result of <<glossary:CVV>>1 validation. Possible values:

                        * `Y` &mdash; Validated

                        * `F` &mdash; Failed

                        * `N` &mdash; Not present'
                      enum:
                      - Y
                      - F
                      - N
                    cvv2:
                      type: string
                      description: 'Result of CVV2 validation. Possible values:

                        * `Y` &mdash; Validated

                        * `F` &mdash; Failed

                        * `N` &mdash; Not present'
                      enum:
                      - Y
                      - F
                      - N
                    cvv3:
                      type: string
                      description: 'Result of CVV3 validation. Possible values:

                        * `Y` &mdash; Validated

                        * `F` &mdash; Failed

                        * `N` &mdash; Not present'
                      enum:
                      - Y
                      - F
                      - N
                    pin:
                      type: string
                      description: 'Result of PIN validation. Possible values:

                        * `Y` &mdash; Verified

                        * `F` &mdash; Failed

                        * `L` &mdash; Locked

                        * `M` &mdash; PIN not set

                        * `B` &mdash; Blocked

                        * `N` &mdash; No PIN was passed'
                      enum:
                      - Y
                      - F
                      - L
                      - M
                      - B
                      - N
                    arqc:
                      type: string
                      description: 'Result of validating the authorization request cryptogram for an EMV chip. Possible values:

                        * `Y` &mdash; Validated

                        * `F` &mdash; Failed

                        * `N` &mdash; Not present'
                      enum:
                      - Y
                      - F
                      - N
                    offline_pin:
                      type: string
                      description: 'Result of validating the offline PIN. Possible values:

                        * `Y` &mdash; Validated

                        * `F` &mdash; Failed

                        * `N` &mdash; Not present

                        * `E` &mdash; Offline PIN attempts exceeded

                        * `P` &mdash; Ignored due to risk params'
                      enum:
                      - Y
                      - F
                      - N
                      - E
                      - P
                    avs_result:
                      type: string
                      description: 'Result of the <<glossary:AVS>> check. See <a href="ref:api-reference-avs-codes" target="_blank">AVS Codes</a> for valid values.


                        Example: `"Y"`'
                      enum:
                      - Y
                      - A
                      - Z
                      - N
                      - M
                      - T
                      - X
                      - S
                      - U
                      - B
                      - C
                      - D
                      - R
                    aav:
                      type: string
                      description: 'Result of validating the <<glossary:AAV>>/<<glossary:CAVV>>. Possible values:

                        * `Y` &mdash; Validated

                        * `F` &mdash; Failed

                        * `N` &mdash; Not present'
                      enum:
                      - Y
                      - F
                      - N
                  required:
                  - cvv1
                  - cvv2
                  - cvv3
                  - pin
                  - arqc
                  - offline_pin
                  - avs_result
                  - aav
                avs_data:
                  type: object
                  description: When the authorization includes an <<glossary:AVS>> request, this object contains the data that SoFi Tech Solutions used to calculate the AVS response.
                  properties:
                    zip:
                      type: string
                      description: 'Postal code provided by the cardholder.


                        Example: `"84121"`'
                      example: '84121'
                    address:
                      type: string
                      description: 'Numbers in the first address line, provided by the cardholder.


                        Example: `"1235"`'
                      example: '1235'
                  required:
                  - zip
                  - address
                international:
                  type: boolean
                  description: 'Whether this is <a href="doc:international#what-counts-as-a-domestic-transaction" target="_blank">an international transaction</a>. '
                  example: true
                response_code:
                  type: string
                  description: 'Authorization response code, which specifies whether a transaction is approved or denied. See the <a href="page:authorization-response-codes#account-and-card-status-response-codes" target="_blank">Authorization Response Codes</a> enumeration for possible values.


                    Example: `"05"`'
                  example: '05'
                auth_id:
                  type: integer
                  description: 'System-generated ID for the authorization. Use this ID to track the transaction throughout the system. For an explanation of how these IDs are generated, see <a href="doc:transaction-ids#authorization-identifiers" target="_blank">Authorization identifiers</a> in the _Transaction IDs_ guide.


                    Example: `13371854`'
                  example: 13371854
                partial_supported:
                  type: boolean
                  description: Whether the merchant supports partial authorizations.
                  example: true
                stip:
                  type: object
                  description: This object is present when a <<glossary:STIP>> transaction is processed by the network. See <a href="doc:authorization-controller-api#stand-in-processing" target="_blank">Stand-in processing</a> in the _Authorization Controller API_ guide for more information.
                  properties:
                    detail:
                      type: string
                      description: 'Advice reason code relayed from the network, which provides information on the STIP transaction. See <a href="ref:api-reference-advice-reason-codes" target="_blank">Advice Reason Codes</a> for valid values.


                        Example: `"4000000"` or `"9020"`'
                      example: '9020'
                    stip_decision:
                      type: string
                      description: 'The <a href="ref:api-reference-events-authorization-response-codes" target="_blank">Authorization Response Code</a> that was returned to the merchant by the STIP process.


                        Example: `"00"`'
                    additional_detail:
                      type:
                      - string
                      - 'null'
                      description: 'More information about the STIP transaction. See <a href="ref:api-reference-stip-additional-detail" target="_blank">STIP Additional Detail</a> for valid values.


                        Example: `"000003"`'
                    is_stip_denial:
                      type: string
                      description: 'Whether the transaction was denied by the STIP process: `N` (approved). Denied STIP transactions do not trigger an Auth API message.


                        Example: `"N"`'
                incremental_auth:
                  type: boolean
                  description: 'If this authorization is part of an an incremental sequence, this field is `true` and `original_id` contains the `auth_id` of the previous authorization in the sequence. '
                  example: true
                entry_type:
                  type: string
                  description: 'Method of entering the <<glossary:PAN>>, also known as <<glossary:POS>> entry mode. See <a href="ref:api-reference-de022-codes#entry_type-mapping" target="_blank">DE022 Codes</a> to correlate with the numerical values. Possible values:

                    * `Card Not Present` &mdash; Online, mail order or telephone order

                    * `Card On File` &mdash; _Mastercard only._ Card number is kept on file

                    * `E-Commerce`  &mdash; _Mastercard only._ The card was used on an ecommerce site

                    * `EMV Chip` &mdash; The card has an EMV chip that was inserted in an EMV slot

                    * `EMV Contactless` &mdash; Contactless transaction with EMV chip card

                    * `EMV Fallback` &mdash; Unable to use the EMV chip: fallback to magstripe

                    * `Magnetic Stripe` &mdash; The magnetic stripe was read

                    * `Contactless` &mdash; Contactless transaction with magstripe card

                    * `Manual` &mdash; Manually entered information

                    * `Other` &mdash; None of the above'
                  enum:
                  - EMV Chip
                  - EMV Contactless
                  - EMV Fallback
                  - Magnetic Stripe
                  - Contactless
                  - Card Not Present
                  - Manual
                  - Other
                pin_entry_capability:
                  type: string
                  description: 'Condition of the PIN pad at the point of sale. See <a href="ref:api-reference-de022-codes#position-3" target="_blank">DE022 Codes</a> to correlate with the numerical values. Possible values:

                    * `Capable` &mdash; Terminal has PIN-entry capability

                    * `Incapable` &mdash; Terminal has no PIN-entry capability

                    * `Inoperative` &mdash; Terminal has PIN-entry capability but it is not working

                    * `Other` &mdash; Unknown PIN-entry capability, or not applicable.'
                  enum:
                  - Capable
                  - Incapable
                  - Inoperative
                  - Other
                payment_info:
                  type: object
