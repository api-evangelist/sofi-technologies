                      example: true
                    raw_eci:
                      type: string
                      description: 'The electronic commerce indicator (ECI) that is sent in the authorization request.


                        Example: `"212"`'
                      example: 212
                    aav_indicator:
                      type: string
                      description: 'Universal Cardholder Authentication Field (UCAF).


                        Example: `"kE"`'
                      example: kE
                    merchant_asserts_data_protection:
