              - entry_type
              - response_code_list
              - ecommerce
              - eligible_for_balance_return
              - emv
              - version
      responses:
        '200':
          description: 'Use the fields in this schema to respond with your decision plus any instructions for SoFi Tech Solutions. '
          content:
            application/json:
              schema:
                type: object
                properties:
                  response_code:
                    type: string
                    description: 'Authorization response code, which specifies whether a transaction is approved or denied. See the <a href="page:authorization-response-codes#account-and-card-status-response-codes" target="_blank">Authorization Response Codes</a> enumeration for possible values.


                      Example: `"05"`'
                    example: '05'
                  avs_response:
                    type: string
                    description: 'Use this field to override `avs_result`, if you believe `avs_result` is wrong. See <a href="ref:api-reference-avs-codes" target="_blank">AVS Codes</a> for valid values. Example: `"Y"`'
                  override_limit:
                    type: boolean
                    description: 'Use this field to override authorization limits, if permitted. If this field is `true` then any limits that would be reached are overridden. Example: `true`'
                    example: true
                  partial_amount:
                    type: number
                    format: float
                    minimum: 0
                    description: 'If `response_code` indicates a partial approval (`10` or `87`), this is the partial amount to approve. Example: `5.00`'
                    example: 5
                  transfer_prn:
                    type: string
                    minLength: 12
                    maxLength: 12
                    description: 'If you want to perform a transfer to cover a lack of funds, this is the PRN of the account to supply the funds. Example: `"155200002717"`'
                    example: '155200002717'
                  transfer_amount:
                    type: number
                    format: float
                    minimum: 0
                    description: 'The amount to transfer from the `transfer_prn` to the cardholder account. Example: `20.00`'
                    example: 20
                  source_transfer_type:
                    type: string
                    description: 'The transaction type for the adjustment on the source account in `transfer_prn`. Use the value that SoFi Tech Solutions supplied. Case sensitive. Default: `pc`. Example: `"lm"`'
                    minLength: 2
                    maxLength: 2
                    example: pc
                  dest_transfer_type:
                    type: string
                    description: 'The transaction type for the adjustment to the cardholder account. Use the value that SoFi Tech Solutions supplied. Case sensitive. Default: `PC` Example: `"LM"`'
                    minLength: 2
                    maxLength: 2
                    example: PC
                  available_balance:
                    type: number
                    format: float
                    description: 'If `eligible_for_balance_return: true` AND you hold the ledger for the card account, populate this field with the card account''s available balance to spend _before_ the transaction is performed. Otherwise, SoFi Tech Solutions sends the balance it has in the response message. The amount should be in the account currency. (The card networks will perform currency conversion as needed.) Example: `250.00`'
                    example: 250
                  savings_balance:
                    type: number
                    format: float
                    description: 'If `eligible_for_balance_return: true` AND you hold the ledger for the cardholder''s savings account, populate this field with the savings account balance in the currency of the account. Otherwise, SoFi Tech Solutions sends the balance it has in the response message. Example: `4000.00`'
                    example: 4000
                  available_credit:
                    type: number
                    format: float
                    description: 'If `eligible_for_balance_return: true` AND you hold the ledger for the cardholder''s credit account, populate this field with the credit limit remaining in the currency of the account. Otherwise, SoFi Tech Solutions sends the remaining limit it has in the response message. Example: `1500.00`'
                    example: 1500
                  merchant_advice_code:
                    type: string
                    description: '*Mastercard only.* Use this field to override MAC decisioning, if permitted. Leave blank if you do not wish to override the SoFi Tech Solutions MAC decision. SoFi Tech Solutions reverts to the original decision if an invalid MAC is provided. The MACO product parameter must be set to `Y` to enable overrides.'
                    example: '41'
                required:
                - response_code
              examples:
                Approve Transaction:
                  summary: Approve transaction
                  value:
                    response_code: '00'
                Override avs_result:
                  summary: Override AVS result
                  value:
                    response_code: '00'
                    avs_response: Y
                Transfer:
                  summary: Real-time transfer
                  value:
                    response_code: '00'
                    transfer_prn: '155200002717'
                    transfer_amount: 20
                    source_transfer_type: pc
                    dest_transfer_type: PC
                    available_balance: 250
                Do Not Honor:
                  summary: Override approval
                  value:
                    response_code: '05'
                Return Multiple Balances:
                  summary: Return multiple balances
                  value:
                    response_code: '00'
                    available_balance: 3654.22
                    savings_balance: 2450.89
                    available_credit: 354.34
  /base_path/Authorization:
    post:
      summary: Auth API Webhook 3.0
      description: 'With the Auth API 3.0 webhook, you can participate in authorization decisions. For this webhook there is only one verb: `POST`. SoFi Tech Solutions sends information about the authorization request in the body of the HTTP request, in JSON. Your decision should be in the body of the HTTP response.


        In the authorization information that we send, the `response_code` is the current response code to be returned to the merchant, unless you override it. Use the `response_code` field in the HTTP response body to override the authorization response code, as desired.


        See the Authorization Controller API guide for more information.

        > 📘 About the field properties

        >

        > SoFi Tech Solutions initializes the webhook payload by setting all fields to `null`. As values come in with the ISO 8583 authorization request, we populate the respective payload fields with the data the network sends, which can include empty strings (`" "`). This documentation shows the field properties (data type, nullability, required) that are most likely. However, variations by network and transaction type mean that a few of the values passed in the webhook payload can vary from what is shown here.


        Open the Recipes below to see webhook examples that you can use for testing.'
      operationId: webhook_authorization_post_3
      tags:
      - Auth API Webhook
      parameters:
      - name: X-Request-ID
        in: header
        description: A unique identifier for the HTTP request.
        schema:
          type: string
          format: uuid
        required: true
      requestBody:
        description: Information about the authorization request.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auth_type:
                  type: string
                  description: 'All transactions are grouped into three basic message types:

                    * `Auth` &mdash; Authorization request. MTI x1xx (authorization or preauthorization over credit rails or preauthorization over debit rails) or x2xx (authorization over debit rails).

                    * `Advice` &mdash; Notification of a completed transaction. MTI xx2x. Only a `00` response code is permitted.

                    * `Reversal` &mdash; A reversal of a previous authorization. MTI x4xx. May or may not reference the previous authorization.'
                  enum:
                  - Auth
                  - Advice
                  - Reversal
                transaction_type:
                  type: string
                  description: 'The transaction type indicates at a lower level what kind of transaction this is.  This field is used to differentiate merchant credits, ATMs, balance inquiries, etc.

                    * `Preauth` &mdash; A preauthorization for an estimated amount. Often followed by a completion advice.

                    * `Auth` &mdash; Conventional authorization request. Also used with advices and reversals.

                    * `ATM` &mdash; ATM withdrawal.

                    * `Cash Advance` &mdash; Cash advance from a teller.

                    * `Balance Inquiry` &mdash; Balance inquiry from an ATM.

                    * `Merchant Credit` &mdash; A credited amount from a merchant. Usually does not reference a previous authorization.

                    * `Adjustment` &mdash; Debit adjustment, unrelated to a previous authorization. The merchant is adjusting a cardholder balance.

                    * `Payment` &mdash; Loading funds onto a card.

                    * `Tokenization` &mdash; A request to tokenize a card for use in a mobile wallet or a request from a merchant to validate a tokenized card for payment.'
                  enum:
                  - Preauth
                  - Auth
                  - ATM
                  - Cash Advance
                  - Balance Inquiry
                  - Merchant Credit
                  - Adjustment
                  - Payment
                  - Tokenization
                id:
                  type: string
                  description: "Unique identifier for this authorization. \n\nExample: `\"DHWJtI8zRjuDcgF8hru3oQ\"`"
                  example: DHWJtI8zRjuDcgF8hru3oQ
                timestamp:
                  type: string
                  description: 'Date and time when the webhook was sent by SoFi Tech Solutions.


                    Format is `<timestamp><timezone>`, where `timestamp` is `YYYYMMDD:HHMMSS` and `timezone` is always `MST`, which is Arizona time (GMT -0700).


                    Example: `"20250315:121504MST"`'
                  example: 20250315:121504MST
                network:
                  type: string
                  description: 'Card network name. Possible values:


                    * `Visa`

                    * `Allpoint`

                    * `Discover`

                    * `Mastercard`

                    * `Star`

                    * `Pulse`'
                  enum:
                  - Visa
                  - Allpoint
                  - Discover
                  - Mastercard
                  - Star
                  - Pulse
                subnetwork:
                  type: string
                  description: 'The subnetwork name. This is the same as `network` if there is no subnetwork. Possible values:


                    * `Visa`

                    * `Visa Interlink`

                    * `Visa PLUS`

                    * `Mastercard Banknet`

                    * `Mastercard Debit Switch`

                    * `Discover`

                    * `Allpoint`

                    * `Star`

                    * `Star MoneyPass`

                    * `Star Presto`

                    * `Pulse`'
                  enum:
                  - Visa
                  - Visa Interlink
                  - Visa PLUS
                  - Mastercard Banknet
                  - Mastercard Debit Switch
                  - Discover
                  - Allpoint
                  - Star
                  - Star MoneyPass
                  - Star Presto
                  - Pulse
                account:
                  type: object
                  properties:
                    xid:
                      type: integer
                      description: 'Internal ID for the account.


                        Example: `5398373`'
                      example: 5398373
                    cad:
                      type: integer
                      description: 'System-generated ID for the card. This ID has a 1:1 relationship with the <<glossary:PAN>>.


                        Example: `72450868`'
                      example: 72450868
                    prn:
                      type: string
                      minLength: 12
                      maxLength: 12
                      description: '<a href="doc:about-accounts#prn" target="_blank">Payment reference number</a> for the account. 12 digits.


                        Example: `"999200002022"`'
                      example: '999200002022'
                    product_id:
                      type:
                      - integer
                      - 'null'
                      description: 'Product ID for the account, as provided by SoFi Tech Solutions.


                        Example: `2577`'
                      example: 2577
                    program_id:
                      type:
                      - integer
                      - 'null'
                      description: 'Program ID for the account, as provided by SoFi Tech Solutions.


                        Example: `566`'
                      example: 566
                    pan:
                      type: string
                      description: 'Last four digits of the <<glossary:PAN>> of the card.


                        Example: `"5198"`'
                      example: '5198'
                    account_status:
                      type: string
                      description: 'Account status code. See the possible values in the <a href="ref:api-reference-account-statuses" target="_blank">Account Statuses</a> enumeration.


                        Example: `"N"`'
                    card_status:
                      type: string
                      example: N
                      description: 'Card status code. See the possible values in the <a href="ref:api-reference-card-statuses" target="_blank">Card Statuses</a> enumeration.


                        Example: `"N"`'
                    expiration_date:
                      type: string
                      minLength: 4
                      maxLength: 4
                      description: 'Card expiration date (format `YYMM`).


                        Example: `"2103"`.'
                      example: '2103'
                    track_expiration_date:
                      type:
                      - string
                      - 'null'
                      minLength: 4
                      maxLength: 4
                      description: 'The expiration date (format: `YYMM`) that was read from the card''s magnetic stripe and sent in the ISO message, if present and applicable. For example, this field will not be present for a card-not-present transaction.


                        Example: `"2103"`'
                      example: '2103'
                    merchant_supplied_expiration_date:
                      type:
                      - string
                      - 'null'
                      minLength: 4
                      maxLength: 4
                      description: 'The expiration date (format: `YYMM`) supplied by the merchant, if present and applicable.



                        Example: `"2103"`'
                      example: '2103'
                  required:
                  - xid
                  - cad
                  - prn
                  - pan
                  - account_status
                  - card_status
                  - expiration_date
                  - track_expiration_date
                  - merchant_supplied_expiration_date
                amounts:
                  type: object
                  description: 'The amounts are always unsigned. To calculate the sign for an amount, start with a factor of &ndash;1, and then apply another factor of &ndash;1 for each of the following criteria:

                    * `"auth_type": "Reversal"`

                    * `"transaction_type": "Merchant Credit"`

                    * `"transaction_type": "Payment"`


                    Amount fields may not display a numeric value for non-active cards. Instead, the string `"none"` could be displayed.'
                  properties:
                    currency:
                      type:
                      - string
                      - 'null'
                      minLength: 3
                      maxLength: 3
                      description: 'The currency code for the amounts, unless otherwise indicated. This is the currency of the cardholder account. ISO 4217 Numeric Currency Code. 3 digits.


                        Example: `"840"`'
                      example: '840'
                    trans_amount:
                      type: string
                      description: 'Transaction amount. Full amount of the authorization request, including upcharges and fees and after any currency conversion is performed.


                        Example: `"12.40"`'
                      example: '12.40'
                    partial_amount:
                      type: string
                      default: '0.0'
                      description: 'If `partial_supported: true` and `response_code` is `10` or `87`, this is the amount of the partial approval.


                        Example: `"10.00"`'
                      example: '10.00'
                    cashback_amount:
                      type: string
                      default: '0.0'
                      description: 'Cashback amount requested. This amount is included in `trans_amount`.


                        Example: `"5.00"`'
                      example: '5.00'
                    fee_amount:
                      type: string
                      default: '0.0'
                      description: 'Amount of any fees. This amount is included in `trans_amount`.


                        Example: `"1.50"`'
                      example: '1.50'
                    available_funds:
                      type: string
                      description: 'The card''s <a href="doc:account-balances#available-balance" target="_blank">available balance</a> before this transaction is applied.


                        If this authorization request is approved, the card''s available balance is affected within a few milliseconds after the approval is sent to the network. Keep in mind that this is the available balance known to SoFi Tech Solutions&mdash;if you are the system of record for your program, refer to your records to determine whether the account has sufficient funds.



                        Example: `100.00`'
                      example: 100
                    amt_til_limit:
                      type: string
                      default: '0.0'
                      description: 'Amount remaining before `nearest_limit` is reached.


                        Example: `502.80`'
                      example: 502.8
                    nearest_limit:
                      type:
                      - string
                      - 'null'
                      description: 'The name of the first limit that would be reached if a partial authorization or denied authorization is overridden via the `override_limit` field. This field is present only when the limit would be reached in overriding the authorization.


                        Example: `"PCL Daily Limit"`'
                      example: PCL Daily Limit
                    local_currency:
                      type: string
                      minLength: 3
                      maxLength: 3
                      description: 'ISO 4217 numeric currency code for `local_currency_amount`, which is the currency at the point of sale. 3 digits.


                        Example: `"124"`'
                      example: '124'
                    local_currency_amount:
                      type: string
                      default: '0.0'
                      description: 'Amount of the request in the currency at the point of sale. Upcharges and fees are not included.


                        Example: `"21.00"`'
                      example: '21.00'
                    settle_currency:
                      type:
                      - string
                      - 'null'
                      minLength: 3
                      maxLength: 3
                      description: 'ISO 4217 numeric currency code for `settlement_currency_amount`. To understand what a settlement currency is, see <a href="doc:multicurrency-bins" target="_blank">Multicurrency BINs</a>. 3 digits.


                        Example: `"978"`'
                      example: '978'
                    settle_currency_amount:
                      type: string
                      default: '0.0'
                      description: 'Amount of the request in the settlement currency. Upcharges and fees are not included.



                        Example: `"17.00"`'
                      example: '17.00'
                    billing_currency:
                      type: string
                      minLength: 3
                      maxLength: 3
                      description: 'ISO 4217 numeric currency code for `billing_currency_amount`.


                        Example: `840`'
                      example: 840
                    billing_currency_amount:
                      type: string
                      default: '0.0'
                      description: 'The amount of the transaction in the billing currency, which is the currency of the card account.


                        Example: `"12.40"`'
                      example: '12.40'
                    local_surcharge_amt:
                      type: string
                      default: '0.0'
                      description: 'The surcharge amount in the currency at the point of sale.


                        Example: `"0.50"`'
                      example: '0.50'
                    settle_surcharge_amt:
                      type: string
                      default: '0.0'
                      description: 'The surcharge amount in the settlement currency.


                        Example: `"0.75"`'
                      example: '0.75'
                    settle_exchange_rate:
                      type: string
                      description: 'The factor used to convert from the local request amount to the settlement amount. The string has the pattern `<shift digit><exchange rate digits>`. The first digit specifies how many places from the right the decimal is moved. For example, `69985022` translates to an exchange rate of 9.985022%.


                        Example: `"69985022"`'
                      example: '69985022'
                    exchange_rate:
                      type: string
                      description: 'The factor used to convert from the local request amount to the billing amount. The string has the pattern `<shift digit><exchange rate digits>`. The first digit specifies how many places from the right the decimal is moved. For example, `69985022` translates to an exchange rate of 9.985022%.


                        Example: `"65991234"`'
                      example: '65991234'
                    upcharge_amount:
                      type: string
                      default: '0.0'
                      description: 'The upcharge amount, which is included in `trans_amount`.


                        Example: `"75.00"`'
                      example: '75.00'
                  required:
                  - currency
                  - trans_amount
                  - cashback_amount
                  - fee_amount
                  - available_funds
                  - amt_til_limit
                  - upcharge_amount
                mcc:
                  type: integer
                  description: 'Merchant category code. This value does not include leading zeros.


                    Example: `5992`'
                  example: 5992
                digital_commerce_data:
                  type: object
                  description: '_Mastercard only_. Contains data regarding a digital commerce transaction. Derived from DE048SE48.  See <a href="doc:auth-api-field-detail#digital-commerce-solutions-indicators" target="_blank">Digital Commerce Solutions Indicators</a> for more information.

