                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      changes:
                        type: array
                        description: An object containing a list of credit-limit changes.
                        items:
                          type: object
                          properties:
                            timestamp:
                              type: string
                              format: date-time
                              description: The date/time when the credit limit was changed.
                            credit_limit:
                              type: number
                              format: float
                              description: The amount that the credit limit was changed to.
                      total_record_count:
                        type: integer
                        format: int32
                        description: Number of credit-limit changes in the list.
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.081,\n    \"response_data\": {\n      \"total_record_account\": 3,\n      \"changes\": [\n        {\n          \"timestamp\": \"2023-07-13 14:23:40\",\n          \"credit_limit\": \"2500\"\n        },\n        {\n          \"timestamp\": \"2023-07-12 14:23:40\",\n          \"credit_limit\": \"2000\"\n        },\n        {\n          \"timestamp\": \"2023-07-11 14:23:40\",\n          \"credit_limit\": \"1500\"\n        }\n      ]\n    },\n    \"echo\": {\n      \"provider_transaction_id\": \"\",\n      \"provider_timestamp\": null,\n      \"transaction_id\": \"9845dk-39fdk3fj3-4483483478\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n    \"system_timestamp\": \"2023-07-13 10:38:13\"}"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<root>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <processing_time>0.081</processing_time>\n  <response_data>\n    <total_record_account>3</total_record_account>\n    <changes>\n      <timestamp>2023-07-13 14:23:40</timestamp>\n      <credit_limit>2500</credit_limit>\n    </changes>\n    <changes>\n      <timestamp>2023-07-12 14:23:40</timestamp>\n      <credit_limit>2000</credit_limit>\n    </changes>\n    <changes>\n      <timestamp>2023-07-11 14:23:40</timestamp>\n      <credit_limit>1500</credit_limit>\n    </changes>\n  </response_data>\n  <echo>\n    <provider_transaction_id></provider_transaction_id>\n    <provider_timestamp>null</provider_timestamp>\n    <transaction_id>9845dk-39fdk3fj3-4483483478</transaction_id>\n  </echo>\n  <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n  <system_timestamp>2023-07-13 10:38:13</system_timestamp>\n</root>"
          description: ''
      parameters: []
      summary: Get Corporate Credit Change History
      description: Use the Get Corporate Credit Change History endpoint to retrieve a history of changes to the credit limit for the specified > funding account. Pass a CC funding account for `accountNo`.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                accountNo:
                  type: string
                  pattern: ^$|^([0-9]{12}|[0-9]{16})$
                  description: "The <<glossary:PRN>> or <<glossary:PAN>> of the account.\nPattern: PAN or PRN \nExample: `\"074103447228\"`"
                  example: 074103447228
              required:
              - accountNo
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      tags:
      - Corporate Credit and RTF
      operationId: post_getcorporatecreditchangehistory
