openapi: 3.2.0
info:
  title: Program Corporate Credit and RTF API
  version: '4.0'
servers:
- url: api-{corename}.{env}.gpsrv.com/intserv/4.0/
tags:
- name: Corporate Credit and RTF
paths:
  /getRtfAccountRelationship:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      tags:
      - Corporate Credit and RTF
      parameters: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                providerId:
                  type: integer
                  format: int32
                  description: 'Your unique provider identifier from SoFi Tech Solutions.

                    Pattern: Max 10 digits

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                accountNo:
                  type: string
                  pattern: ^$|^([0-9]{12}|[0-9]{16})$
                  description: 'The <<glossary:PRN>> for either an RTF funding or RTF spending account. Do not use the <<glossary:CAD>> or <<glossary:PAN>>.

                    Pattern: 12-digit numeric string

                    Example: `"344101254935"`'
                  example: 074103447228
                page:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  default: 1
                  minimum: 1
                  maximum: 999999
                  description: 'The number of the page to retrieve.

                    Pattern: Integer value of `1` or greater

                    Example: `3`'
                  example: 3
                recordCnt:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  minimum: 1
                  maximum: 99999
                  description: 'The maximum number of records per page to be returned.

                    Pattern: Positive integer `1-99999`

                    Example: `100`'
                  example: 100
              required:
              - accountNo
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      summary: Get RTF Account Relationship
      description: 'Use the Get > Account Relationship endpoint to retrieve either the RTF spending accounts that are associated with an RTF funding account, or the RTF funding account that is associated with an RTF spending account.


        For instructions on using this endpoint see Creating Real-Time Funding Accounts.'
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      funding_account:
                        description: The funding account associated with the RTF spending account.
                        type: object
                        properties:
                          pmt_ref_no:
                            type: string
                            description: The payment reference number of the account.
                          status:
                            type: string
                            description: The status of the account. See <a href="ref:api-reference-account-statuses" target="_blank">Account Statuses</a> for valid values.
                          active:
                            type: string
                            description: 'Whether the account is active: `Y` or `N`'
                          galileo_account_number:
                            type: string
                            description: Balance ID for the account.
                          product_id:
                            type: string
                            description: The identifier for the product that this account belongs to.
                        required:
                        - active
                        - galileo_account_number
                        - product_id
                        - status
                      spending_accounts:
                        type: array
                        description: Contains a list of RTF spending accounts associated with the RTF funding account.
                        items:
                          type: object
                          properties:
                            pmt_ref_no:
                              type: string
                              description: The payment reference number of the account.
                            status:
                              type: string
                              description: The status of the account. See <a href="ref:api-reference-account-statuses" target="_blank">Account Statuses</a> for valid values.
                            active:
                              type: string
                              description: 'Whether the account is active: `Y` or `N`'
                            galileo_account_number:
                              type: string
                              description: Balance ID for the account.
                            product_id:
                              type: string
                              description: The identifier for the product that this account belongs to.
                          required:
                          - active
                          - galileo_account_number
                          - product_id
                          - status
                      funding_account_prn:
                        type: string
                        description: The PRN of the funding account.
                      spending_account_prn:
                        type: string
                        description: The PRN of the spending account.
                      spending_account_count:
                        type: integer
                        format: int32
                        description: Number of spending accounts returned.
                      page:
                        type: integer
                        format: int32
                        description: The page number to be retrieved in the context of recordset paging
                      total_record_count:
                        type: integer
                        format: int32
                        description: Number of records in the accounts list display
                      number_of_pages:
                        type: integer
                        format: int32
                        description: Total number of pages in the accounts list display
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n\t\"status_code\": 0,\n\t\"status\": \"Success\",\n\t\"processing_time\": 0.081,\n\t\"response_data\": {\n    \t\"spending_account_count\": 2,\n    \t\"page\": 1,\n    \t\"total_record_count\": 2,\n    \t\"number_of_pages\": 1,\n    \t\"spending_accounts\": [\n        \t{\n            \t\"pmt_ref_no\": \"999102798106\",\n            \t\"product_id\": \"4444\",\n            \t\"galileo_account_number\": \"7000398\",\n            \t\"status\": \"N\",\n            \t\"active\": \"Y\"\n        \t},\n        \t{\n            \t\"pmt_ref_no\": \"999102798262\",\n            \t\"product_id\": \"4444\",\n            \t\"galileo_account_number\": \"7000555\",\n            \t\"status\": \"N\",\n            \t\"active\": \"Y\"\n        \t}\n    \t],\n    \t\"funding_account_prn\": \"999102798098\"\n\t},\n\t\"echo\": {\n    \t\"provider_transaction_id\": \"\",\n    \t\"provider_timestamp\": null,\n    \t\"transaction_id\": \"b0465cf0-c32a-4dbc-8c6e-011cff4e20af\"\n\t},\n\t\"system_timestamp\": \"2023-07-12 15:57:45\",\n\t\"rtoken\": \"af1be148-1c61-447b-8848-52469c75dd83\"\n}"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<root>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <processing_time>0.081</processing_time>\n  <response_data>\n    <spending_account_count>2</spending_account_count>\n    <page>1</page>\n    <total_record_count>2</total_record_count>\n    <number_of_pages>1</number_of_pages>\n    <spending_accounts>\n      <pmt_ref_no>999102798106</pmt_ref_no>\n      <product_id>4444</product_id>\n      <galileo_account_number>7000398</galileo_account_number>\n      <status>N</status>\n      <active>Y</active>\n    </spending_accounts>\n    <spending_accounts>\n      <pmt_ref_no>999102798262</pmt_ref_no>\n      <product_id>4444</product_id>\n      <galileo_account_number>7000555</galileo_account_number>\n      <status>N</status>\n      <active>Y</active>\n    </spending_accounts>\n    <funding_account_prn>999102798098</funding_account_prn>\n  </response_data>\n  <echo>\n    <provider_transaction_id></provider_transaction_id>\n    <provider_timestamp/>\n    <transaction_id>b0465cf0-c32a-4dbc-8c6e-011cff4e20af</transaction_id>\n  </echo>\n  <system_timestamp>2023-07-12 15:57:45</system_timestamp>\n  <rtoken>af1be148-1c61-447b-8848-52469c75dd83</rtoken>\n</root>"
          description: ''
      operationId: post_getrtfaccountrelationship
  /getCorporateCreditChangeHistory:
