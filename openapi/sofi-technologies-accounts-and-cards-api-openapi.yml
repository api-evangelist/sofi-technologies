                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      prn:
                        type: string
                        description: The payment reference number
                      prod_id:
                        type: integer
                        format: int32
                        description: Unique system generated product id associated with the account
                      app_date:
                        type:
                        - string
                        - 'null'
                        description: The date the account's application was submitted. `Formatted yyyy-mm-dd`.
                      status:
                        type: string
                        description: Indicates the status of an account
                      active_flag:
                        type: string
                        description: Indicates if an account is active or not
                      bill_cycle_day:
                        type:
                        - string
                        - 'null'
                        description: Day of the month that the customer is billed
                      group_id:
                        type:
                        - string
                        - 'null'
                        description: Integer value used for tracking the location (store, entity, etc...) where the customer was acquired
                      start_date:
                        type:
                        - string
                        - 'null'
                        description: Date the account was activated
                      galileo_account_number:
                        type:
                        - string
                        - 'null'
                        description: System-generated integer account number, also known as balance ID
                      new_emboss_uuid:
                        type:
                        - string
                        - 'null'
                        description: UUID for an emboss record that has not yet been sent to the embosser.
                      cards:
                        type: array
                        description: List of cards associated with the account
                        items:
                          type: object
                          properties:
                            card_number:
                              type: string
                              description: A PAN or 16 digit card number (usually masked)
                            expiry_date:
                              type:
                              - string
                              - 'null'
                              format: date
                              description: Expiration date of the card
                            status:
                              type: string
                              description: A single character code specifying the status of the card
                            card_id:
                              type: string
                              description: Unique identifier for a card
                            emboss_uuid:
                              type:
                              - string
                              - 'null'
                              description: UUID for an emboss record that has been sent to the embosser. When this field is present outside the `embossed_cards` object, it contains the most recent emboss UUID.
                            external_card_id:
                              type:
                              - string
                              - 'null'
                              description: Partner specified external card identity
                            card_security_code:
                              type:
                              - string
                              - 'null'
                              description: The card verification value (CVV2)
                            pmt_ref_no:
                              type: string
                              description: A system-generated account number
                            first_name:
                              type:
                              - string
                              - 'null'
                              description: First name
                            middle_name:
                              type:
                              - string
                              - 'null'
                              description: Middle name
                            last_name:
                              type:
                              - string
                              - 'null'
                              description: Last name
                            encrypted_card_number:
                              type:
                              - string
                              - 'null'
                              description: Encrypted number for the card
                            encrypted_expiry_date:
                              type:
                              - string
                              - 'null'
                              description: Encrypted expiration date for the card
                            embossed_cards:
                              type:
                              - array
                              - 'null'
                              description: List of emboss records, one for each time the card was sent to the embosser. This object is populated only when emboss records exist.
                              items:
                                type:
                                - object
                                - 'null'
                                properties:
                                  emboss_uuid:
                                    type:
                                    - string
                                    - 'null'
                                    description: UUID for an emboss record that has been sent to the embosser. When this field is present outside the `embossed_cards` object, it contains the most recent emboss UUID.
                                  status:
                                    type: string
                                    description: The status of the card
                                  created_date:
                                    type: string
                                    format: date
                                    description: Date the card was created
                                  emboss_date:
                                    type: string
                                    format: date
                                    description: Date the card was embossed
                                  expiry_date:
                                    type:
                                    - string
                                    - 'null'
                                    format: date-time
                                    description: Expiration date of the card
                                  shipping_type:
                                    type: string
                                    description: The type of shipping used for the card
                                required:
                                - created_date
                                - emboss_date
                                - emboss_uuid
                                - shipping_type
                                - status
                            pin_fail_count:
                              type:
                              - string
                              - 'null'
                              description: Counts the number of times a PIN entry fails
                            pin_fail_date:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: Date a PIN fail was recorded
                            freeze_info:
                              type: object
                              properties:
                                status:
                                  type: string
                                  description: Flag showing whether a card is frozen or not
                                start_date:
                                  type:
                                  - string
                                  - 'null'
                                  format: date-time
                                  description: Start date for card being frozen
                                end_date:
                                  type:
                                  - string
                                  - 'null'
                                  format: date-time
                                  description: End date for card being frozen
                              required:
                              - end_date
                              - start_date
                              - status
                            spend_controls:
                              type: object
                              properties:
                                available_credit:
                                  type:
                                  - string
                                  - 'null'
                                  description: The amount available to be charged to a credit card
                                single_use:
                                  type:
                                  - string
                                  - 'null'
                                  description: A flag that indicated an alias credit card number, exhausted after one use
                                credit_limit:
                                  type:
                                  - string
                                  - 'null'
                                  description: The maximum outstanding balance allowed on a credit card
                              required:
                              - available_credit
                              - credit_limit
                              - single_use
                            ssn:
                              type:
                              - string
                              - 'null'
                              description: The Social Security Number associated with the account. Set CINFN when PCI-compliant to see this value.
                          required:
                          - card_id
                          - card_number
                          - emboss_uuid
                          - embossed_cards
                          - expiry_date
                          - external_card_id
                          - first_name
                          - freeze_info
                          - last_name
                          - middle_name
                          - pin_fail_count
                          - pin_fail_date
                          - pmt_ref_no
                          - spend_controls
                          - status
                    required:
                    - active_flag
                    - app_date
                    - bill_cycle_day
                    - cards
                    - galileo_account_number
                    - group_id
                    - prn
                    - prod_id
                    - start_date
                    - status
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n  \"status_code\": 0,\n  \"status\": \"Success\",\n  \"processing_time\": 0.729,\n  \"response_data\": {\n    \"prn\": \"005461616202\",\n    \"prod_id\": 12003,\n    \"app_date\": \"2025-10-09\",\n    \"status\": \"N\",\n    \"active_flag\": \"Y\",\n    \"bill_cycle_day\": \"5012488\",\n    \"group_id\": \"4400147\",\n    \"start_date\": \"2025-10-12\",\n    \"galileo_account_number\": \"5012488\",\n    \"new_emboss_uuid\": \"22222222-dfad-4e5d-abff-90865d1e13b2\",\n    \"cards\": [\n      {\n        \"card_number\": \"619416XXXXXX8367\",\n        \"expiry_date\": null,\n        \"card_security_code\": null,\n        \"status\": \"N\",\n        \"card_id\": \"14861269\",\n        \"emboss_uuid\": \"11111111-dfad-4e5d-abff-90865d1e13b1\",\n        \"external_card_id\": null,\n        \"pmt_ref_no\": \"005461616202\",\n        \"first_name\": \"Barrett\",\n        \"middle_name\": \"Audra\",\n        \"last_name\": \"Abplanalp\",\n        \"encrypted_card_number\": null,\n        \"encrypted_expiry_date\": null,\n        \"embossed_cards\": [\n          {\n            \"status\": \"N\",\n            \"created_date\": \"2025-10-12\",\n            \"emboss_date\": \"2025-10-12\",\n            \"expiry_date\": \"\",\n            \"shipping_type\": \"standard\",\n            \"emboss_uuid\": \"11111111-dfad-4e5d-abff-90865d1e13b1\"\n          },\n          {\n            \"status\": \"N\",\n            \"created_date\": \"2025-10-12\",\n            \"emboss_date\": \"2025-10-12\",\n            \"expiry_date\": \"\",\n            \"shipping_type\": \"standard\",\n            \"emboss_uuid\": \"11111111-dfad-4e5d-abff-90865d1e13b1\"\n          },\n          {\n            \"status\": \"N\",\n            \"created_date\": \"2025-10-12\",\n            \"emboss_date\": \"2025-10-12\",\n            \"expiry_date\": \"\",\n            \"shipping_type\": \"standard\",\n            \"emboss_uuid\": \"11111111-dfad-4e5d-abff-90865d1e13b1\"\n          },\n          {\n            \"status\": \"N\",\n            \"created_date\": \"2025-10-12\",\n            \"emboss_date\": \"2025-10-12\",\n            \"expiry_date\": \"\",\n            \"shipping_type\": \"standard\",\n            \"emboss_uuid\": \"11111111-dfad-4e5d-abff-90865d1e13b1\"\n          }\n        ],\n        \"pin_fail_count\": \"0\",\n        \"pin_fail_date\": null,\n        \"freeze_info\": {\n          \"status\": \"Unfrozen\",\n          \"start_date\": null,\n          \"end_date\": null\n        },\n        \"spend_controls\": {\n          \"available_credit\": null,\n          \"single_use\": null,\n          \"credit_limit\": null\n        }\n      }\n    ]\n  },\n  \"echo\": {\n    \"provider_transaction_id\": \"\",\n    \"provider_timestamp\": null,\n    \"transaction_id\": \"40bab512-8a5b-4298-aaef-27280b1bfeaa\"\n  },\n  \"system_timestamp\": \"2025-10-12 13:29:53\",\n  \"rtoken\": \"19e497ab-83c2-4e3c-b024-d10014e9d49a\"\n}\n"
