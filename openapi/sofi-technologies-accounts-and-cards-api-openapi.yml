              - apiLogin
              - apiTransKey
              - providerId
      summary: Get Account by ID
      description: 'Use the Get Account by ID endpoint to retrieve account information using _exactly one_ of the mutually exclusive lookup keys. See Account lookup for specific instructions.


        This endpoint returns customer data such as enrollment status and onboarding date as well as a list of all accounts associated with the customer. Each account entry includes `closureDate` to indicate when the account was closed. `closureDate` is populated only when the account is in status `C` (closed/canceled), `Z` (closed/canceled without refund), or `R` (charged off); it is `null` for open accounts.


        To search on broader criteria, try Search Accounts.'
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      accounts:
                        type: array
                        description: List of accounts
                        items:
                          description: Acts as a logical separator between accounts if more than one is returned
                          type: object
                          properties:
                            prn:
                              type: string
                              description: The <a href="doc:about-accounts#prn" target="_blank">payment reference number</a>
                            prod_id:
                              type: string
                              description: A unique product identifier from SoFi Tech Solutions
                            app_date:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: The date the account's application was submitted
                            status:
                              type: string
                              description: The <a href="ref:api-reference-account-statuses" target="_blank">status of the account</a>
                            active_flag:
                              type: string
                              description: Whether the account is active
                            balance:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: The <a href="doc:account-balances#available-balance" target="_blank">available balance</a> of the account
                            closure_date:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: UTC timestamp (`YYYY-MM-DD hh:mm:ss`) of when the account was closed. Populated only when status is `C` (closed/canceled), `Z` (closed/canceled without refund), or `R` (charged off); `null` means the account is open.
                            galileo_account_number:
                              type:
                              - string
                              - 'null'
                              description: The balance ID of the account.
                            cards:
                              type:
                              - array
                              - 'null'
                              description: List of the cards associated with the account
                              items:
                                type: object
                                properties:
                                  card_id:
                                    type: string
                                    description: The card identifier (CAD)
