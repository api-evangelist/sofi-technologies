      summary: Update Account
      description: 'Use the Update Account endpoint to modify customer profile information in an existing customer record. Pass only the parameters to modify — other parameters should be left blank. Only active accounts (`status: N`) can be updated using this endpoint, unless you set provider parameter UPDCZ to update accounts in `status: C` or `status: Z`.


        #### Nullifying data elements

        Pass the string `null` for any of these parameters to update that value to `null`.


        | | | | |

        |:--|:--|:--|:--|

        | `firstName` | `middleName` | `lastName` | `address1` |

        | `city` | `state` | `postalCode` | `primaryPhone` |

        | `otherPhone` | `mobilePhone` | `shipToAddress1` | `webUid` |

        | `secretQuestion` | `secretAnswer` | `mailBounced` | `email`\* |

        | `embossLine2` | | | |

        \*Only if the provider parameter AENUL is set.


        [block:callout]


        {

        "type": "warning",

        "title": "Warning",

        "body": "Exercise caution when nullifying a primary address — for compliance in the United States you must maintain a physical address as an individual cardholder''s primary address."

        }

        [/block]


        #### Updating customer ID

        When you are using the SoFi Tech Solutions integrated > process, you can update the primary customer ID (`id` and `idType`) as long as the customer has not passed customer identity verification. If the customer has already passed IVS, status code `415-02` is returned. Secondary and tertiary customer IDs (`id2`/`idType2` and `id3`/`idType3`) can be updated regardless of customer-verification status, but they cannot be nullified or cleared. If you omit those keys, the current value is not changed.


        #### Updating the ship-to address

        When updating the ship-to address for a customer, the elements `shipToAddress1`, `shipToCity`, `shipToState`, and `shipToPostalCode` are required – `shipToAddress2` is optional. You can retrieve the current customer ship-to address data using the Get Account Cards endpoint.


        By default, the embosser sends the card to the primary address. To ship to a different address than the primary, use the ship-to address fields. If you pass `shipToAddressPermanent: 1` the embosser will always send cards to the ship-to address; otherwise, the ship-to address is used only for the current order.'
