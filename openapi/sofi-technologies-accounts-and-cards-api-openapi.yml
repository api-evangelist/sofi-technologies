                    Example: `"84121"`'
                  example: '84121'
                countryCode:
                  type:
                  - string
                  - 'null'
                  pattern: ^\d{3}$
                  description: 'Account holder''s country. Three-digit UN M49 code, such as `840` for USA, `124` for Canada, `484` for Mexico, `170` for Colombia.

                    Pattern: 3-digit number

                    Example: `"840"`'
                  example: '840'
                primaryPhone:
                  type:
                  - string
                  - 'null'
                  pattern: ^([0-9]+|null)$
                  description: 'Account holder''s primary phone number.

                    Pattern: Exactly 10 digits, no hyphens or other characters

                    Example: `"8013656060"`'
                  example: '8013656060'
                otherPhone:
                  type:
                  - string
                  - 'null'
                  pattern: ^([0-9]+|null)$
                  description: 'Phone number.

                    Pattern: Exactly 10 digits, no hyphens or other characters

                    Example: `"8013656060"`'
                  example: '8013656060'
                mobilePhone:
                  type:
                  - string
                  - 'null'
                  pattern: ^([0-9]+|null)$
                  description: 'Phone number.

                    Pattern: Exactly 10 digits, no hyphens or other characters

                    Example: `"8013656060"`'
                  example: '8013656060'
                mobileCarrierId:
                  type:
                  - string
                  - 'null'
                  description: 'Account holder''s mobile carrier. Configurable list.

                    Pattern: Configurable list

                    Example: `"8"`'
                  example: '8'
                email:
                  type:
                  - string
                  - 'null'
                  format: email
                  minLength: 3
                  maxLength: 63
                  description: 'Account holder''s email. This field is validated by Marshmallow.

                    Pattern: Email address, 3&ndash;63 characters

                    Example: `"user@fakedomain.com"`'
                  example: user@fakedomain.com
                webUid:
                  type:
                  - string
                  - 'null'
                  minimum: 4
                  maximum: 30
                  pattern: ^[a-zA-Z0-9]+(?:[_-][a-zA-Z0-9]+)*$
                  description: 'Account holder''s username for the website hosted by SoFi Tech Solutions. Must be unique across the program.

                    Pattern: Alphanumeric, with first character a letter; case insensitive

                    Example: `"eharley"`'
                  example: eharley
                webPwd:
                  type:
                  - string
                  - 'null'
                  description: 'Account holder''s password for the website hosted by SoFi Tech Solutions.

                    Pattern: Min 8 characters: must include upper-case character, lower-case character, and a number

                    Example: `"4j9KH3kkdh"`'
                  example: 4j9KH3kkdh
                secretQuestion:
                  type:
                  - string
                  - 'null'
                  maximum: 50
                  pattern: ^[A-Za-z0-9_\'\s\?]*$
                  description: 'Account holder''s secret question for the website hosted by SoFi Tech Solutions.

                    Pattern: Max 50 characters: letters, spaces, `?`

                    Example: `"What was the name of your first pet?"`'
                  example: What was the name of your first pet?
                secretAnswer:
                  type:
                  - string
                  - 'null'
                  maximum: 50
                  description: 'Account holder''s answer to `secretQuestion`.

                    Pattern: Max 50 characters: letters, spaces, `?`

                    Example: `"Larry"`'
                  example: Larry
                monthlyIncome:
                  type:
                  - number
                  - 'null'
                  format: float
                  default: 0
                  minimum: 0
                  maximum: 9999999999
                  description: 'Monthly income for the account holder.

                    Pattern: Float between 0 and 9999999999

                    Example: `3400.00`'
                  example: 25.99
                monthlyLiab:
                  type:
                  - number
                  - 'null'
                  format: float
                  default: 0
                  minimum: 0
                  maximum: 999999999999.99
                  description: 'Currency amount as a whole or decimal amount.

                    Pattern: Positive integer or decimal number

                    Example: `100.00`, `100`, or `100.73`'
                  example: 25.99
                businessName:
                  type:
                  - string
                  - 'null'
                  description: 'Account holder''s business name. This field is **required** if `prodId` is a business product.

                    Pattern: 2&ndash;150 characters. See the <a href="ref:api-reference-special-characters#businessname-parameter" target="_blank">supported character set</a>.

                    Example: `"Ed%26Ted"`'
                  example: Ed
                  pattern: ^[A-Za-z0-9_\s\'-\.,\?@&\!#~\*;\+ '-]*$
              required:
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
