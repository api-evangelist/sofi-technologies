  /modifyStatus:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      tags:
      - Accounts and Cards
      parameters: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                providerId:
                  type: integer
                  format: int32
                  description: 'Your unique provider identifier from SoFi Tech Solutions.

                    Pattern: Max 10 digits

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                accountNo:
                  type: string
                  pattern: ^.+$
                  description: 'The <<glossary:PRN>>, <<glossary:PAN>> or <<glossary:CAD>> of the account.

                    Pattern: PAN, PRN, or CAD

                    Example: `"074103447228"`'
                  example: 074103447228
                type:
                  type: integer
                  format: int32
                  description: 'Specifies the account and/or card status to set. See the <a href="ref:api-reference-modify-status-types" target="_blank">Modify Status Types</a> enumeration for valid values.

                    Pattern: Predefined integer value range

                    Example: `2`'
                  example: 2
                startDate:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: 'Valid only with `type: 17` (freeze card). If you pass a value for `startDate`, you must also populate `endDate`. Default is current date-time.

                    Pattern: `YYYY-MM-DD hh:mm:ss`

                    Example: `"2020-02-02 12:22:02"`'
                  example: '2020-02-02 12:22:02'
                endDate:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: 'Valid only with `type: 17` (freeze card). If you pass a value for `endDate`, you must also populate `startDate`. Must be later than `startDate`. Default is current date-time plus 24 hours.

                    Pattern: `YYYY-MM-DD hh:mm:ss`

                    Example: `"2020-02-12 10:00:00"`'
                  example: '2020-02-12 10:00:00'
                bypassRepFee:
                  type:
                  - string
                  - 'null'
                  enum:
                  - Y
                  - N
