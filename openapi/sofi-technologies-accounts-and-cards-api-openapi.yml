                              - 'null'
                            payload:
                              description: Samsung Pay only. A Base64-encoded or Base64url-encoded opaque string.
                              type: string
                          type: object
                      required:
                      - provisioning_request_data
                      type: object
                    - type:
                      - object
                      - 'null'
