    post:
      summary: Get Access Token
      description: 'Use the Get Access Token endpoint to retrieve an access token for a card, account, or customer record. The expiry in seconds (default: 300) and usage count (default: 3) for the access token are configurable using the TSECV (seconds) and TUSEC (usage) parameters.


        When `type: 0` always use > for `accountNo`.


        Use this endpoint to send a customer a link to a one-time view of a dynamically generated image of a virtual card via HTTP, for example, or for other purposes as appropriate.


        Consult Digital card images in the *Retrieving Card Information* guide for more information. For other uses contact SoFi Tech Solutions.'
      parameters: []
      tags:
      - Accounts and Cards
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>.. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                accountNo:
                  type: string
                  pattern: ^.+$
                  description: 'The <<glossary:PRN>>, <<glossary:PAN>> or <<glossary:CAD>> of the account.

                    Pattern: PAN, PRN, or CAD

                    Example: `"074103447228"`'
                  example: 074103447228
                type:
                  type: integer
                  format: int32
                  enum:
                  - 0
                  - 1
                  - 2
                  description: 'Type of access token to retrieve:

                    * `0` &mdash; Card

                    * `1` &mdash; Account

                    * `2` &mdash; Customer


                    Pattern: Integer

                    Example: `2`'
                  example: 2
              required:
              - accountNo
              - transactionId
              - type
              - apiLogin
              - apiTransKey
              - providerId
      responses:
        default:
          content:
