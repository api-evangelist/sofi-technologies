                  example: 4sb62fh6w4h7w34g
                  type: string
                cert1:
                  description: The leaf certificate returned by the wallet provider that was signed using `cert2`. Should be the hexlified (case insensitive) binary data of the certificate. See <a href="doc:creating-a-provisioning-request#certificate-formatting" target="_blank">Certificate formatting</a> for more information. Required for Apple Pay; not required for Samsung Pay or Google Pay.
                  format: hexadecimal digits
                  type:
                  - string
                  - 'null'
                cert2:
                  description: The subordinate certificate returned by the wallet provider that was signed using the wallet provider’s Certificate Authority (CA) certificate. Should be the hexlified (case insensitive) binary data of the certificate. See <a href="doc:creating-a-provisioning-request#certificate-formatting" target="_blank">Certificate formatting</a> for more information. Required for Apple Pay; not required for Samsung Pay or Google Pay.
                  format: hexadecimal digits
                  type:
                  - string
                  - 'null'
                clientDeviceID:
                  description: Value returned by Google Pay or Samsung Pay for use with Visa. **Required** for Visa + Samsung Pay or Google Pay; not required for Visa + Apple Pay.
                  type:
                  - string
                  - 'null'
                clientWalletAccountID:
                  description: Value returned by Google Pay or Samsung Pay for use with Visa. **Required** for Visa + Samsung Pay or Google Pay; not required for Visa + Apple Pay.
                  type:
                  - string
                  - 'null'
                nonce:
                  description: 'The hexlified (case insensitive) nonce value returned by Apple Pay. **Required** for Apple Pay; not required for Google Pay or Samsung Pay.

                    Pattern: 8 character nonce value

                    Example: `"9c023092"`'
                  example: 9c023092
                  format: hexadecimal digits
                  type:
                  - string
                  - 'null'
                nonceSignature:
                  description: 'The hexlified (case insensitive) nonce signature value returned by Apple Pay. **Required** for Apple Pay (not required for web push provisioning); not required for Google Pay or Samsung Pay.

                    Pattern: Nonce signature value

                    Example: `"4082f883ae62..."`'
                  example: 4082f883ae62...
                  format: hexadecimal digits
                  type:
                  - string
                  - 'null'
                provisioningSource:
                  description: 'The source of the provisioning request. Accepted values: `"in_app"`, `"web"`. Defaults to `"in_app"` in the provisioner when not provided.

                    Example: `"web"`'
                  enum:
                  - in_app
                  - web
                  example: in_app
                  type:
                  - string
                  - 'null'
                transactionId:
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                  maxLength: 60
                  minLength: 1
                  type: string
                walletProvider:
                  description: "The type of wallet to provision:\n* `1` &mdash; Apple Pay\n* `2` &mdash; Google Pay \n* `3` &mdash; Samsung Pay\n* `4` &mdash; Apple Pay Web\nPattern: One digit\nExample: `2`"
                  enum:
                  - 1
                  - 2
                  - 3
                  - 4
                  - 5
                  example: 2
                  type: integer
