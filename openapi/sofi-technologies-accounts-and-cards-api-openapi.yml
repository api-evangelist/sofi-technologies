  /getCardTokens:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      summary: Get Card Tokens
      description: 'Use the Get Card Tokens endpoint to retrieve information on tokens associated with a card. To use this endpoint, the MTLCM product parameter must be set. This endpoint is currently valid only for Mastercard.


        > 🚧 Notice

        >

        > The token-management endpoints are available by special arrangement only. Enabling this feature requires additional setup and costs. Contact SoFi Tech Solutions for details.'
      parameters: []
      tags:
      - Accounts and Cards
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>.. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                accountNo:
                  type: string
                  maximum: 18
                  pattern: ^$|^([0-9]+)$
                  description: 'The <<glossary:PRN>>, <<glossary:PAN>> or <<glossary:CAD>> of the account. For card-specific endpoints such as this one, the CAD is preferred. Do not use the PRN if more than one card has ever been associated with this account.

                    Pattern: PAN, PRN, or CAD

                    Example: `"999103447228"`'
                  example: 074103447228
                tokenUniqueReference:
                  type:
                  - string
                  - 'null'
                  minLength: 48
                  maxLength: 48
                  description: 'A unique 48-character reference assigned to a token and used to identify the token for the duration of its lifetime.

                    Pattern: 48-char alphanumeric

                    Example: `"DWSPMC00000000010906a349d9ca4eb1a4d53e3c90a11d9c"`'
                  example: DWSPMC00000000010906a349d9ca4eb1a4d53e3c90a11d9c
                includeDeviceTokensOnly:
                  type: boolean
                  default: false
                  description: "Specifies whether to receive only the tokens tied to the cardholder device: \n- `true` &mdash;  <<glossary:MDES>> returns only the device-based tokens\n- `false` &mdash; MDES returns all tokens mapped to the PAN (server, device, and <<glossary:COF>>). \n\nPattern: Boolean\nExample: `true`"
                  example: 'true'
                excludeDeletedIndicator:
                  type: boolean
                  default: true
                  description: "Specifies whether to exclude deleted tokens from the search results. Valid values: \n- `true` &mdash; Exclude deleted tokens from the search results.\n- `false` &mdash; Include deleted tokens in the search results. \n\nPattern: `true` or `false`\n Example: `true`"
                  example: 'true'
              required:
              - accountNo
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  token_details_mc:
                    type: array
                    items:
                      description: List of tokens.
                      type: object
                      properties:
                        token_unique_reference:
                          type: string
                          minLength: 48
                          maxLength: 48
                          description: Unique reference assigned to a token, used to identify the token for the duration of its lifetime.
                        expiration_date:
                          type: string
                          minLength: 4
                          maxLength: 4
                          description: 'Expiration date of the token. Conditional field, present once the token has been designated for the digitization. Format: MMYY.'
                        current_status_code:
                          type: string
                          minLength: 1
                          maxLength: 1
                          description: 'Current status of the token. See `current_status_description` field for the value descriptions: `U`, `A`, `S`, `D`.'
                        current_status_description:
                          type: string
                          minLength: 1
                          maxLength: 100
                          description: 'Description for the `current_status_code`: `"Unmapped"`, `"Active"`, `"Suspended"`, `"Deleted"`'
                        current_status_date_time:
                          type: string
                          minLength: 24
                          maxLength: 24
                          description: 'Date-time the status was updated. ISO 8601 format: YYYY-MM-DDThh:mm:ssTZD.'
                        token_requestor_id:
                          type: string
                          minLength: 6
                          maxLength: 11
                          description: The entity uniquely recognized by Mastercard as the Token Requestor
                        token_requestor_name:
                          type: string
                          minLength: 1
                          maxLength: 100
                          description: The legal name of the token requestor. There can be more than one Token Requestor ID per token Requester Name (legal name), so you should use both the ID and the name to uniquely identify a token requestor.
                        token_type:
                          type: string
                          minLength: 1
                          maxLength: 1
                          description: 'Type of token. Valid values: `S` (embedded secure element token), `C` (Mastercard cloud-based payments token), `F` (<<glossary:COF>> token)'
                        wallet_id:
                          type: string
                          minLength: 3
                          maxLength: 3
                          description: Identifier of the wallet provider that requested the tokenization of the card.
                        payment_app_instance_id:
                          type: string
                          minLength: 48
                          maxLength: 64
                          description: Identifier of the Payment App instance within a device that will be provisioned with a token. Not present for CoF tokens.
                      required:
                      - token_unique_reference
                      - wallet_id
                  token_details_visa:
                    type: array
                    items:
                      description: List of tokens.
                      type: object
                      properties:
                        tokenRequestorId:
                          type: integer
                          format: int32
                          maximum: 99999999999
                          description: Unique ID assigned to the initiator of the token request.
                        tokenReferenceId:
                          type: string
                          maxLength: 32
                          description: Unique ID for the token associated with the <<glossary:PAN>>.
                        entityOfLastAction:
                          type: string
                          enum:
                          - TOKEN_REQUESTOR
                          - ISSUER
                          description: The entity that performed the last action.
                        tokenType:
                          type: string
                          enum:
                          - SECURE_ELEMENT
                          - HCE
                          - CARD_ON_FILE
                          - ECOMMERCE
                          - QRC
                          description: Type of token.
                        tokenStatus:
                          type: string
                          enum:
                          - ACTIVE
                          - INACTIVE
                          - SUSPENDED
                          - DEACTIVATED
                          description: Status of the token.
                      required:
                      - tokenReferenceId
                      - tokenRequestorId
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.253,\n    \"response_data\": {\n        \"token_details_mc\": [\n        {\n            \"token_unique_reference\": \"DWSPMC00000000010906a349d9ca4eb1a4d53e3c90a11d9c\",\n            \"expiration_date\": \"0327\",\n            \"current_status_code\": \"A\",\n            \"current_status_description\": \"Active\",\n            \"current_status_date_time\": \"2025-09-03T14:18:17-07:00\",\n            \"token_requestor_id\": \"50110030273\",\n            \"token_requestor_name\": \"Samsung Pay\",\n            \"token_type\": \"S\",\n            \"wallet_id\": \"453\"\n            }\n        ],\n    \"echo\": {\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": null,\n        \"transaction_id\": \"AYA5QR4ZBO2E674YBVCX\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n    \"system_timestamp\": \"2025-09-03 10:38:45\"\n}\n}\n"
            application/xml:
              examples:
                response:
                  value: "<root>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <processing_time>0.253</processing_time>\n  <response_data>\n    <token_details_mc>\n      <token_detail>\n        <token_unique_reference>DWSPMC00000000010906a349d9ca4eb1a4d53e3c90a11d9c</token_unique_reference>\n        <expiration_date>0327</expiration_date>\n        <current_status_code>A</current_status_code>\n        <current_status_description>Active</current_status_description>\n        <current_status_date_time>2025-09-03T14:18:17-07:00</current_status_date_time>\n        <token_requestor_id>50110030273</token_requestor_id>\n        <token_requestor_name>Samsung Pay</token_requestor_name>\n        <token_type>S</token_type>\n        <wallet_id>453</wallet_id>\n      </token_detail>\n    </token_details_mc>\n    <echo>\n      <provider_transaction_id></provider_transaction_id>\n      <provider_timestamp>null </provider_timestamp>\n      <transaction_id>AYA5QR4ZBO2E674YBVCX</transaction_id>\n    </echo>\n    <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n    <system_timestamp>2025-09-03 10:38:45</system_timestamp>\n  </response_data>\n</root>\n"
          description: ''
      operationId: post_getcardtokens
