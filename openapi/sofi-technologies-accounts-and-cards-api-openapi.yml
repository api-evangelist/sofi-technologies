        Create Virtual Account is similar to Create Account except that it accepts only virtual card product IDs for `prodId`. Consult the Creating an Account procedure for instructions on using this endpoint, and consult the Customer ID Verification guide for how to use this endpoint with the SoFi Tech Solutions legacy CIP solution.


        [block:callout]


        {

        "type": "info",

        "title": "Note",

        "body": "You must be PCI-compliant to use this endpoint. If you are not PCI compliant, use the Create Account endpoint and specify a virtual card product for `prodId`."

        }

        [/block]


        [block:callout]


        {

        "type": "info",

        "title": "Note",

        "body": "If this endpoint returns a status code that does not match a status code that is specific to this endpoint, it may be an enrollment status code. See Enrollment Statuses for more information."

        }

        [/block]'
      parameters: []
      tags:
      - Accounts and Cards
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>.. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                prodId:
                  type: integer
                  format: int32
                  minimum: 0
                  maximum: 100000000
                  description: 'A unique product identifier from SoFi Tech Solutions. If this ID is for a business product then `businessName` is **required**.

                    Pattern: Integer

                    Example: `501`'
                  example: 501
                id:
                  type:
                  - string
                  - 'null'
                  description: 'The value of the primary identifier that is specified in `idType`. Product settings determine whether this ID should be unique across the program or product. This parameter is **required** when using the SoFi Tech Solutions legacy <<glossary:CIP>> solution. The system converts all letters to lowercase.

                    Pattern: As specified in the **Layout** column of the <a href="ref:api-reference-customer-id-types" target="_blank">Customer ID Types</a> enumeration

                    Example: `"123456789"`'
                  example: '123456789'
                idType:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  minimum: 1
                  maximum: 15
                  description: 'Specifies the type of primary identifier in the `id` parameter. This parameter is **required** when `id` is populated. See the **ID** column in the <a href="ref:api-reference-customer-id-types" target="_blank">Customer ID Types</a> table for valid values.

                    Pattern: Integer

                    Example: `2`'
                  example: 2
                id2:
                  type:
                  - string
                  - 'null'
                  description: 'The value of the secondary identifier that is specified in `idType2`. The system converts all letters to lowercase.

                    Pattern: As specified in the **Layout** column of the <a href="ref:api-reference-customer-id-types" target="_blank">Customer ID Types</a> enumeration

                    Example: `"123456789012|ut|12/25/2020"`'
                  example: 123456789012|ut|12/25/2020
                idType2:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  minimum: 1
                  maximum: 15
                  description: 'Specifies the type of secondary identifier in the `id2` parameter. This parameter is **required** when `id2` is populated. See the **ID** column in the <a href="ref:api-reference-customer-id-types" target="_blank">Customer ID Types</a> table for valid values.

                    Pattern: Integer

                    Example: `1`'
                  example: 1
                locale:
                  type:
                  - string
                  - 'null'
                  enum:
                  - en_US
                  - es_US
                  - en_CA
                  - fr_CA
                  - es_MX
                  - en_MX
                  description: 'The account holder language and localization preference. If the account holder address is outside the U.S., pass a non `_US` value for this parameter to disable U.S. address validation.

                    Pattern: String

                    Example: `"en_US"`'
                  example: en_US
                firstName:
                  type:
                  - string
                  - 'null'
                  minimum: 1
                  maximum: 40
                  description: 'Account holder''s first name. <a href="ref:api-reference-special-characters" target="_blank">Special character support</a>.

                    Pattern: 1&ndash;40 characters: letters (`A-Z`, `a-z`), spaces, hyphens (`-`) and single quotes (`''`)

                    Example: `"Ed"`'
                  example: Ed
                middleName:
                  type:
                  - string
                  - 'null'
                  minimum: 1
                  maximum: 40
                  description: 'Account holder''s middle name. <a href="ref:api-reference-special-characters" target="_blank">Special character support</a>.

                    Pattern: 1&ndash;40 characters: letters (`A-Z`, `a-z`), spaces, hyphens (`-`) and single quotes (`''`)

                    Example: `"W"`'
                  example: W
                lastName:
                  type:
                  - string
                  - 'null'
                  minimum: 1
                  maximum: 40
                  description: 'Account holder''s last name. <a href="ref:api-reference-special-characters" target="_blank">Special character support</a>.

                    Pattern: 1&ndash;40 characters: letters (`A-Z`, `a-z`), spaces, hyphens (`-`) and single quotes (`''`)

                    Example: `"Harley"`'
                  example: Harley
                dateOfBirth:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: 'Account holder''s birth date. This date is compared with the DOB product parameter when there is a minimum age requirement on the account.

                    Pattern: YYYY-MM-DD

                    Example: `"1980-01-01"`'
                  example: '1980-01-01'
                address1:
                  type:
                  - string
                  - 'null'
                  description: 'Account holder''s first address line. Cannot be a P.O. box. <a href="ref:api-reference-address1-validation" target="_blank">Validation rules for `address1`</a>.

                    Pattern: 4&ndash;40 alphanumeric characters

                    Example: `"33 Maple Street"`'
                  example: 33 Maple Street
                address2:
                  type:
                  - string
                  - 'null'
                  description: "Account holder's second address line. \nPattern: Max 40 alphanumeric characters and <a href=\"ref:api-reference-special-characters#address-symbols\" target=\"_blank\">address symbols</a>\nExample: `\"#4B\"`"
                  example: '#4B'
                address3:
                  type:
                  - string
                  - 'null'
                  description: "Account holder's third address line. \nPattern: Max 30 alphanumeric characters and <a href=\"ref:api-reference-special-characters#address-symbols\" target=\"_blank\">address symbols</a>\nExample: `\"Carrera Central\"`"
                  example: Carrera Central
                address4:
                  type:
                  - string
                  - 'null'
                  description: "Account holder's fourth address line. \nPattern: Max 30 alphanumeric characters and <a href=\"ref:api-reference-special-characters#address-symbols\" target=\"_blank\">address symbols</a>\nExample: `\"Barrio El Alhambra\"`"
                  example: Barrio El Alhambra
                address5:
                  type:
                  - string
                  - 'null'
                  description: "Account holder's fifth address line. \nPattern: Max 30 alphanumeric characters and <a href=\"ref:api-reference-special-characters#address-symbols\" target=\"_blank\">address symbols</a>\nExample: `\"Piso 3\"`"
                  example: Piso 3
                city:
                  type:
                  - string
                  - 'null'
                  description: 'Account holder''s city.

                    Pattern: Max 30 characters: letters, spaces, hyphen and period

                    Example: `"Salt Lake City"`'
                  example: Salt Lake City
                state:
                  type:
                  - string
                  - 'null'
                  description: "Account holder's state or province. \nPattern: String\nExample: `\"UT\"`"
                  example: UT
                postalCode:
                  type:
                  - string
                  - 'null'
                  minimum: 4
                  maximum: 10
                  pattern: ^[a-zA-Z0-9\-\ ]*$
                  description: 'Account holder''s postal code (ZIP code).

                    Pattern: `12345`, `12345-1234`, or `K1A-1A1`

                    Example: `"84121"`'
                  example: '84121'
                countryCode:
                  type:
                  - string
                  - 'null'
                  pattern: ^\d{3}$
                  description: 'Account holder''s country. Three-digit UN M49 code, such as `840` for USA, `124` for Canada, `484` for Mexico, `170` for Colombia.

                    Pattern: 3-digit number

                    Example: `"840"`'
                  example: '840'
                primaryPhone:
                  type:
                  - string
                  - 'null'
                  pattern: ^([0-9]+)$
                  description: 'Account holder''s primary phone number.

                    Pattern: Validation according to the value in `mobilePhoneCountryCode`.

                    Example: `"8013656060"`'
                  example: '8013656060'
                otherPhone:
                  type:
                  - string
                  - 'null'
                  pattern: ^([0-9]+)$
                  description: 'Account holder''s secondary phone number.

                    Pattern: Validation according to the value in `mobilePhoneCountryCode`.

                    Example: `"8013656060"`'
                  example: '8013656060'
                mobilePhone:
                  type:
                  - string
                  - 'null'
                  pattern: ^([0-9]+)$
                  description: 'Account holder''s mobile phone number.

                    Pattern: Validation according to the value in `mobilePhoneCountryCode`.

                    Example: `"8013656060"`'
                  example: '8013656060'
                mobileCarrierId:
                  type:
                  - string
                  - 'null'
                  description: 'Account holder''s mobile carrier. Configurable list.

                    Pattern: Configurable list

                    Example: `"8"`'
                  example: '8'
                email:
                  type:
                  - string
                  - 'null'
                  format: email
                  minLength: 3
                  maxLength: 63
                  description: 'Account holder''s email

                    Pattern: Email address, 3&ndash;63 characters

                    Example: `"user@fakedomain.com"`'
                  example: user@fakedomain.com
                webUid:
                  type:
                  - string
                  - 'null'
                  minimum: 4
                  maximum: 30
                  pattern: ^[a-zA-Z0-9]+(?:[_-][a-zA-Z0-9]+)*$
                  description: 'Account holder''s username for the website hosted by SoFi Tech Solutions. Must be unique across the program.

                    Pattern: Alphanumeric, with first character a letter; case insensitive

                    Example: `"eharley"`'
                  example: eharley
                webPwd:
                  type:
                  - string
                  - 'null'
                  description: 'Account holder''s password for the website hosted by SoFi Tech Solutions.

                    Pattern: Min 8 characters: must include upper-case character, lower-case character, and a number

                    Example: `"4j9KH3kkdh"`'
                  example: 4j9KH3kkdh
                secretQuestion:
                  type:
                  - string
                  - 'null'
                  maximum: 50
                  pattern: ^[A-Za-z0-9_\'\s\?]*$
                  description: 'Account holder''s secret question for the website hosted by SoFi Tech Solutions.

                    Pattern: Max 50 characters: letters, spaces, `?`

                    Example: `"What was the name of your first pet?"`'
                  example: What was the name of your first pet?
                secretAnswer:
                  type:
                  - string
                  - 'null'
                  maximum: 50
                  description: 'Account holder''s answer to `secretQuestion`.

                    Pattern: Max 50 characters: letters, spaces, `?`

                    Example: `"Larry"`'
                  example: Larry
                loadAmount:
                  type:
                  - number
                  - 'null'
                  format: float
                  minimum: 0.01
                  maximum: 999999999999.99
                  description: 'Currency amount passed as a whole or decimal amount. Initial load amount on a card must be within product load limits or be the designated amount for an instant-issue card.

                    Pattern: Positive integer or decimal number

                    Example: `100.00`, `100`  or `100.73`'
                  example: 25.5
                loadType:
                  type:
                  - string
                  - 'null'
                  maximum: 2
                  pattern: ^[a-zA-Z0-9]*$
                  description: 'Transaction type for the `loadAmount`. Use values from your list of load types from SoFi Tech Solutions. If no `loadType` is specified, the default type `RL` is used.

                    Pattern: 2 characters

                    Example: `"RL"`'
                  example: RL
                externalAccountId:
                  type:
                  - string
                  - 'null'
                  maximum: 30
                  pattern: ^[a-zA-Z0-9\-]*$
                  description: 'Identifier supplied by the provider, which is not related to the system. This ID is stored in the system in association with this account and can be provided in the <<glossary:RDF>>s.

                    Pattern: Max 30 alphanumeric characters. Lowercase only.

                    Example: `"553b45sbs"`'
                  example: 553b45sbs
                primaryAccount:
                  type:
                  - string
                  - 'null'
                  pattern: ^$|^([0-9]{12}|[0-9]{16})$
                  description: '<<glossary:PAN>> or <<glossary:PRN>> of the primary account to associate this account with. Populate this parameter only when creating a secondary account.

                    Pattern: PAN or PRN

                    Example: `"123456789012"`'
                  example: 074103447228
                sharedBalance:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  enum:
                  - 0
                  - 1
                  description: 'Specifies whether the secondary account will share the balance of the primary account. This parameter is **required** when `primaryAccount` is populated. Do not set this parameter to `1` when `primaryAccount` is not populated.

                    * `0` &mdash; Do not share the balance

                    * `1` &mdash; Share the balance


                    Pattern: Integers

                    Example: `1`'
                  example: 1
                userData:
                  type:
                  - string
                  - 'null'
                  maximum: 50
                  pattern: ^[a-zA-Z0-9 ]*$
                  description: 'Data supplied by the provider, from sources external to the system. This data will be stored in the system in association with this account. The most common use of this parameter is to track affiliate-marketing traffic. The data in this field can be added to an <<glossary:RDF>>.

                    Pattern: Max 50 alphanumeric characters and spaces

                    Example: `"a4434gg44"`'
                  example: a4434gg44
                verifyOnly:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  enum:
                  - 0
                  - 1
                  description: 'Pass `1` to test the validity of the parameter data without committing the information to the system.

                    Pattern: Integer

                    Example: `1`'
                  example: 1
                loadFromAccountNo:
                  type:
                  - string
                  - 'null'
                  pattern: ^$|^([0-9]{12}|[0-9]{16})$
                  description: 'To load funds into the account at the time of account creation, specify the <<glossary:PAN>> or <<glossary:PRN>> of the source account for the funds. This account must be in the same program as the account being created.

                    Pattern: PAN or PRN

                    Example: `"074103447228"`'
                  example: 074103447228
                sweepDate:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: 'The last date that a daily sweep should be performed. This parameter is valid only if account sweeping is configured for the product.

                    Pattern: YYYY-MM-DD

                    Example: `"2016-01-01"`'
                  example: '2016-01-01'
                creditLimit:
                  type:
                  - number
                  - 'null'
                  minimum: 0
                  description: 'Credit limit for card based spending control (currently only available for credit processing).

                    Pattern: Monetary amount greater than 0.

                    Example: `500.25`'
                  example: 500.25
                singleUse:
                  type:
                  - string
                  - 'null'
                  enum:
                  - Y
                  - N
                  description: 'Spending control parameter that flags card for one purchasing transaction (currently only available for credit processing).

                    Pattern: String

                    Example: `"Y"`'
                  example: Y
                businessName:
                  type:
                  - string
                  - 'null'
                  description: 'Account holder''s business name. This field is **required** if `prodId` is a business product.

                    Pattern: 2-150 characters. See the <a href="ref:api-reference-special-characters#businessname-parameter" target="_blank">supported character set</a>.

                    Example: `"Ed%26Ted"`'
                  example: Ed
                mobilePhoneCountryCode:
                  type:
                  - string
                  - 'null'
                  minimum: 2
                  maximum: 4
                  pattern: ^\+[0-9]*$
                  description: "Account holder's mobile phone country code.\nPattern: A plus sign followed by 1–3 digits. See <a href=\"ref:api-reference-phone-validation\" target=\"_blank\">Phone Validation</a> for valid values. \nExample: `\"+1\"`"
                  example: '+1'
              required:
              - prodId
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    type: array
                    description: A structure for the response data. It can be empty but usually will contain information.
                    items:
                      type: object
                      properties:
                        pmt_ref_no:
                          type: string
                          description: <a href="doc:about-accounts#prn" target="_blank">Payment reference number</a>.
