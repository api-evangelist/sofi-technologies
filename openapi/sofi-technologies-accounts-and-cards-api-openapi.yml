                          - 'null'
                          description: Date when the card expires
                        card_security_code:
                          type:
                          - string
                          - 'null'
                          description: The card verification value (CVV2)
                        cip:
                          type:
                          - array
                          - 'null'
                          description: List of cardholder identification process (CIP) objects
                          items:
                            type: object
                            properties:
                              status:
                                type: string
                                description: Status of the CIP process
                              model_results:
                                type:
                                - array
                                - 'null'
                                description: List of model objects
                                items:
                                  type: object
                                  properties:
                                    model_name:
                                      type:
                                      - string
                                      - 'null'
                                      description: The model name
                                    model_version:
                                      type:
                                      - integer
                                      - 'null'
                                      format: int32
                                      description: Version number for the model used
                                    code:
                                      type:
                                      - string
                                      - 'null'
                                      description: In a model run, lists the pass number
                                    text:
                                      type:
                                      - string
                                      - 'null'
                                      description: Plain text description of the code value
                                  required:
                                  - code
                                  - model_name
                                  - model_version
                                  - text
                              date_time:
                                type: string
                                format: date-time
                                description: The date and time CIP was run
                              first_name:
                                type:
                                - string
                                - 'null'
                                description: Account holder's first name
                              middle_name:
                                type:
                                - string
                                - 'null'
                                description: Account holder's middle name
                              last_name:
                                type:
                                - string
                                - 'null'
                                description: Account holder's last name
                              address_1:
                                type:
                                - string
                                - 'null'
                                description: First line of the account holder's address
                              address_2:
                                type:
                                - string
                                - 'null'
                                description: Second line of the account holder's address
                              city:
                                type:
                                - string
                                - 'null'
                                description: Account holder's city
                              state:
                                type:
                                - string
                                - 'null'
                                description: Account holder's state
                              primary_phone:
                                type:
                                - string
                                - 'null'
                                description: Account holder's primary phone number
                              other_phone:
                                type:
                                - string
                                - 'null'
                                description: Account holder's other phone number
                            required:
                            - date_time
                            - model_results
                            - status
                        billing_cycle_day:
                          type:
                          - integer
                          - 'null'
                          format: int32
                          description: The day of the month the billing cycle starts for the account
                      required:
                      - billing_cycle_day
                      - card_id
                      - card_number
                      - card_security_code
                      - cip
                      - expiry_date
                      - galileo_account_number
                      - pmt_ref_no
                      - product_id
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.916,\n    \"response_data\": [\n        {\n            \"pmt_ref_no\": \"001109456010\",\n            \"product_id\": \"1665\",\n            \"galileo_account_number\": \"462881\",\n            \"cip\": [\n                {\n                    \"status\": \"Pass\",\n                    \"model_results\": [\n                        {\n                            \"model_name\": \"BancorpPIDC\",\n                            \"model_version\": \"3\",\n                            \"code\": \"Pass A\",\n                            \"text\": \"Pass A\"\n                        }\n                    ],\n                    \"date_time\": \"2025-07-13 10:37:52\"\n                }\n            ],\n            \"card_id\": \"850238\",\n            \"card_number\": \"4870930116312056\",\n            \"expiry_date\": \"2025-07-13\",\n            \"card_security_code\": \"123\"\n        }\n    ],\n    \"echo\": {\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": null,\n        \"transaction_id\": \"RSNU68AN366U7I1UT8JQ\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n    \"system_timestamp\": \"2025-07-13 10:37:52\"\n}"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" ?>\n<response>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <processing_time>0.717</processing_time>\n  <response_data>\n    <new_account>\n      <pmt_ref_no>001109458792</pmt_ref_no>\n      <product_id>1665</product_id>\n      <galileo_account_number>463167</galileo_account_number>\n      <cip>\n        <aps>\n          <status>Pass</status>\n          <model_results>\n            <model>\n              <model_name>BancorpPIDC</model_name>\n              <model_version>3</model_version>\n              <code>Pass A</code>\n              <text>Pass A</text>\n            </model>\n          </model_results>\n          <date_time>2025-07-13 12:32:54</date_time>\n        </aps>\n      </cip>\n      <card_id>850527</card_id>\n      <card_number>4870930116314946</card_number>\n      <expiry_date>2025-07-13</expiry_date>\n      <card_security_code>123</card_security_code>\n    </new_account>\n  </response_data>\n  <echo>\n    <provider_transaction_id/>\n    <provider_timestamp/>\n    <transaction_id>UWMMMN71QNNIXE64U4TG</transaction_id>\n  </echo>\n  <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n  <system_timestamp>2025-07-13 12:32:54</system_timestamp>\n</response>"
          description: ''
