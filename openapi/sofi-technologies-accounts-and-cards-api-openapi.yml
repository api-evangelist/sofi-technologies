  /addCard:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      summary: Add Card
      description: 'Use the Add Card endpoint to add a new card (> and >) to an existing >. Cards that are created with this endpoint are active upon creation, and the account status is updated to the second position of XAACT. SoFi Tech Solutions recommends that you have only one active card per PRN. As needed, ensure that any previous card has been marked lost, stolen, canceled, or any status but `N`.


        Do not use this endpoint to create multiple spending cards that share a central balance. For that use case, SoFi Tech Solutions recommends Real-Time Funding or Corporate Credit for large numbers of cards, or for small numbers of cards you can create one primary and multiple secondary accounts that share a balance.


        Use this endpoint in scenarios such as these:

        - Replacing a virtual card that is lost, stolen, or expired

        - Adding another virtual card to a PRN

        - Replacing an instant-issue card at a storefront (for card programs with a retail integration)

        - Replacing a personalized card'
      parameters: []
      tags:
      - Accounts and Cards
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>.. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                accountNo:
                  type: string
                  pattern: ^$|^([0-9]{12}|[0-9]{16})$
                  description: 'The <<glossary:PRN>> or <<glossary:PAN>> of the account. Do not use the <<glossary:CAD>>.

                    Pattern: PAN or PRN

                    Example: `"074103447228"`'
                  example: 074103447228
                prodId:
                  type: integer
                  format: int32
                  minimum: 1
                  description: 'Product ID of the card in `accountNo`.

                    Pattern: Integer

                    Example: `"501"`'
                  example: '501'
                newAccountNo:
