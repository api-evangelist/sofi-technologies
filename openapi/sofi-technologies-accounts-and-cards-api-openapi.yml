                        - 'null'
                        description: The customer's `externalCustomerId`. Returned only when the lookup resolves to a single customer, as when the request is made with `customerId`. Omitted for lookups that may span multiple customers.
                    required:
                    - accounts
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.24,\n    \"response_data\": {\n        \"accounts\": [\n            {\n                \"prn\": \"001109456341\",\n                \"prod_id\": \"88\",\n                \"app_date\": \"2025-07-13 10:38:57\",\n                \"status\": \"V\",\n                \"active_flag\": \"N\",\n                \"balance\": 10,\n                \"closure_date\": null,\n                \"galileo_account_number\": \"462956\"\n            }\n        ]\n    },\n    \"echo\": {\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": null,\n        \"transaction_id\": \"HKHFA2P57UHZH2I7HIIW\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n    \"system_timestamp\": \"2025-07-13 10:38:58\"\n}"
            application/xml:
