                    Pattern: 1&ndash;40 characters: letters (`A-Z`, `a-z`), spaces, hyphens (`-`) and single quotes (`''`)

                    Example: `"W"`'
                  example: W
                lastName:
                  type:
                  - string
                  - 'null'
                  minimum: 1
                  maximum: 40
                  description: 'Account holder''s last name. <a href="ref:api-reference-special-characters" target="_blank">Special character support</a>.

                    Pattern: 1&ndash;40 characters: letters (`A-Z`, `a-z`), spaces, hyphens (`-`) and single quotes (`''`)

