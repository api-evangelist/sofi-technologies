        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>.. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 123e4567-e89b-12d3-a456-426614174000
                accountNo:
                  type: string
                  maximum: 18
                  pattern: ^$|^([0-9]+)$
                  description: 'The <<glossary:PRN>>, <<glossary:PAN>> or <<glossary:CAD>> of the account. For card-specific endpoints such as this one, the CAD is preferred. Do not use the PRN if more than one card has ever been associated with this account.

                    Pattern: PAN, PRN, or CAD

                    Example: `"999103447228"`'
                  example: 074103447228
                tokenUniqueReference:
                  type:
                  - string
                  - 'null'
                  minLength: 48
                  maxLength: 48
                  description: "A unique reference assigned to a token and used to identify the token for the duration of its lifetime. Also called the TUR. \nPattern: 48-char alphanumeric\nExample: `\"DWSPMC00000000010906a349d9ca4eb1a4d53e3c90a11d9c\"`"
                  example: DWSPMC00000000010906a349d9ca4eb1a4d53e3c90a11d9c
                operation:
                  type: string
                  enum:
                  - DELETE
                  - SUSPEND
                  - RESUME
                  - ACTIVATE
                  description: 'Operation to perform.

                    Pattern: String

                    Example:`"SUSPEND"`'
                  example: SUSPEND
                reasonCode:
                  type:
                  - string
                  - 'null'
                  description: "The reason for `operation`. See <a href=\"ref:api-reference-manage-card-token-values\" target=\"_blank\">Manage Card Token Values</a> for valid values.\nPattern: String \nExample: `\"STOLEN\"`"
                  example: STOLEN
                deleteFromConsumerApp:
                  type:
                  - boolean
                  - 'null'
                  description: "If `operation: DELETE`, specify whether to delete the token from the cardholder device only  or from both the device and the <<glossary:MDES>> platform: \n- `true` &mdash; Delete the token from the cardholder device only.\n- `false` &mdash; Delete the token from both the device and the MDES platform. \n\nPattern: String\nExample: `true`"
                  example: 'true'
                agentId:
                  type:
                  - string
                  - 'null'
                  description: 'The ID of the agent performing the token management operation. Used to track who made the change in notes.

                    Pattern: String

                    Example: `"agent123"`'
                  example: agent123
                userId:
                  type:
                  - string
                  - 'null'
                  description: 'The ID of the user performing the token management operation. Used to track who made the change in notes.

                    Pattern: String

                    Example: `"user456"`'
                  example: user456
              required:
              - accountNo
              - operation
              - transactionId
              - apiLogin
              - apiTransKey
              - providerId
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
                properties:
                  token_unique_reference:
                    type: string
                    minLength: 48
                    maxLength: 48
                    description: A unique reference assigned to a token and used to identify the token for the duration of its lifetime.
                    example: DWSPMC00000000010906a349d9ca4eb1a4d53e3c90a11d9c
              examples:
                response:
                  value: "{\n    \"status_code\": 0,\n    \"status\": \"Success\",\n    \"processing_time\": 0.253,\n    \"response_data\": {\n        \"token_unique_reference\": \"DWSPMC00000000010906a349d9ca4eb1a4d53e3c90a11d9c\"\n    },\n    \"echo\": {\n        \"provider_transaction_id\": \"\",\n        \"provider_timestamp\": null,\n        \"transaction_id\": \"AYA5QR4ZBO2E674YBVCX\"\n    },\n    \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n    \"system_timestamp\": \"2025-09-03 10:38:45\"\n}"
            application/xml:
              examples:
                response:
                  value: "<root>\n  <status_code>0</status_code>\n  <status>Success</status>\n  <processing_time>0.253</processing_time>\n  <response_data>\n    <token_unique_reference>DWSPMC00000000010906a349d9ca4eb1a4d53e3c90a11d9c</token_unique_reference>\n  </response_data>\n  <echo>\n    <provider_transaction_id></provider_transaction_id>\n    <provider_timestamp>null</provider_timestamp>\n    <transaction_id>AYA5QR4ZBO2E674YBVCX</transaction_id>\n  </echo>\n  <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n  <system_timestamp>2025-09-03 10:38:45</system_timestamp>\n</root>"
          description: ''
      operationId: post_managecardtoken
  /replaceLostStolenCard:
    parameters:
    - $ref: '#/components/parameters/ResponseContentTypeHeaderParam'
    post:
      parameters: []
      description: Use the Replace Lost/Stolen Card endpoint to report a card as lost or stolen and to request a replacement card. This endpoint is valid only for physical cards and Digital First cards. The response from this endpoint includes the new >, new >, and new > for the replacement card. You must be PCI-compliant to receive the full PAN; otherwise, you will receive a masked PAN.
      summary: Replace Lost/Stolen Card
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                providerId:
                  type: integer
                  description: 'Your unique provider identifier from SoFi Tech Solutions.

                    Pattern: 10 digits or less

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
                  minLength: 1
                  maxLength: 60
                  description: 'Supply a globally unique ID to identify this endpoint request ("transaction"). Might be used for <a href="ref:idempotency#endpoints-that-use-transactionid-for-idempotency" target="_blank">idempotency</a>. A UUID is preferred.

                    Pattern: Maximum 60 characters

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 9845dk-39fdk3fj3-4483483478
                apiLogin:
                  type: string
                  description: 'Web service username, as provided by SoFi Tech Solutions.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by SoFi Tech Solutions.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                accountNo:
                  type: string
                  minLength: 1
                  pattern: ^([0-9]{12}|[0-9]{16}|[0-9]{1,10})$
                  description: 'The <<glossary:PRN>>, <<glossary:PAN>> or <<glossary:CAD>> of the account.

                    Pattern: PAN, PRN, or CAD

                    Example: `"999103447228"`'
                  example: '999103447228'
                bypassRepFee:
                  type:
                  - string
                  - 'null'
                  default: N
                  enum:
                  - Y
                  - N
                  - ''
                  description: "Pass `Y` to bypass the card replacement fee (REP).\n Pattern: `Y` or `N`\nExample: `\"Y\"`"
                  example: Y
                cardStatus:
                  type: string
                  enum:
                  - L
                  - S
                  minLength: 1
                  description: "Specifies whether the card is being marked as lost (`L`) or stolen (`S`). Default: `L`. \nPattern: `L` or `S`\nExample: `L`"
                  example: L
                cardNumberLastFour:
                  type:
                  - string
                  - 'null'
                  pattern: ^$|[0-9]{4}$
                  description: 'If multiple cards are associated with this account, use this value to ensure that the correct card is selected.

                    Pattern: 4 digits

                    Example: `"0789"`'
                  example: 0789
              required:
              - accountNo
              - cardStatus
              - apiLogin
              - apiTransKey
              - providerId
      tags:
      - Accounts and Cards
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type:
                    - integer
                    - 'null'
                    description: The response status code. May return a string for some statuses.
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processing_time:
                    type:
                    - number
                    - 'null'
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transaction_id:
                        type:
                        - string
                        - 'null'
                        description: An ID that represents an API transaction
                      provider_timestamp:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Store a related timestamp for reporting and troubleshooting purposes
                      provider_transaction_id:
                        type:
                        - string
                        - 'null'
                        description: Secondary transaction identifier (generated by a provider)
                    required:
                    - provider_timestamp
                    - provider_transaction_id
                    - transaction_id
                  system_timestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A system-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  response_data:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      card_number:
                        type: string
                        description: The full PAN if you are PCI compliant or the masked PAN if you are not
                      emboss_uuid:
                        type:
                        - string
                        - 'null'
                        description: UUID for an emboss record that has been sent to the embosser. When this field is present outside the `embossed_cards` object, it contains the most recent emboss UUID.
                      expiry_date:
                        type:
                        - string
                        - 'null'
                        description: The expiry date (MMDDYYYY) of the card
                      card_security_code:
                        type:
                        - string
                        - 'null'
                        description: The card verification value (CVV) or card verification code (CVC)
                      status:
                        type: string
                        description: The status of this replacement card
                      card_id:
                        type: string
                        description: The CAD for the card. Use this value instead of the PAN if you are not PCI compliant
                      external_card_id:
                        type:
                        - string
                        - 'null'
                        description: External card identifier
                      pmt_ref_no:
                        type: string
                        description: The payment reference number (PRN) of the card account
                    required:
                    - card_id
                    - card_number
                    - card_security_code
                    - expiry_date
                    - external_card_id
                    - pmt_ref_no
                    - status
                required:
                - echo
                - processing_time
                - response_data
                - rtoken
                - status
                - status_code
                - system_timestamp
              examples:
                response:
                  value: "{\n  \"status_code\": 0,\n  \"status\": \"Success\",\n  \"processing_time\": 0.298,\n  \"transaction_id\": \"UUID\",\n  \"response_data\": {   \n    \"card_number\": \"487093XXXXXX2307\",\n    \"emboss_uuid\": \"a81bc81b-dfad-4e5d-abff-90865d1e13b1\",\n    \"expiry_date\": \"08262027\",\n    \"card_security_code\": \"123\",\n    \"status\": \"N\",\n    \"card_id\": \"648428\",\n    \"external_card_id\": null,\n    \"pmt_ref_no\": \"999104890593\" },\n  \"echo\": {\n\"provider_transaction_id\": \"\",\n\"provider_timestamp\": null,\n\"transaction_id\": \"629d890a-d773-4615-9bc4-bbe12effcf94\"\n  },\n  \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n  \"system_timestamp\": \"2025-08-13 10:36:54\"\n}\n"
            application/xml:
              examples:
                response:
                  value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<root>\n   <echo>\n      <provider_timestamp null=\"true\" />\n      <provider_transaction_id />\n      <transaction_id>629d890a-d773-4615-9bc4-bbe12effcf94</transaction_id>\n   </echo>\n   <processing_time>0.298</processing_time>\n   <response_data>\n      <card_id>648428</card_id>\n      <card_number>487093XXXXXX2307</card_number>\n      <card_security_code>123</card_security_code>\n      <emboss_uuid>a81bc81b-dfad-4e5d-abff-90865d1e13b1</emboss_uuid>\n      <expiry_date>08262027</expiry_date>\n      <external_card_id null=\"true\" />\n      <pmt_ref_no>999104890593</pmt_ref_no>\n      <status>N</status>\n   </response_data>\n   <rtoken>8cc16de0-5eda-4e2a-968e-3b08fce6f778</rtoken>\n   <status>Success</status>\n   <status_code>0</status_code>\n   <system_timestamp>2025-08-13 10:36:54</system_timestamp>\n   <transaction_id>UUID</transaction_id>\n</root>"
      operationId: post_replaceloststolencard
