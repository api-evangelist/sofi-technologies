  /getQuestionnaire:
    post:
      summary: Get Questionnaire
      description: '> 👍 Availability

        >

        > No new clients will be set up with Dispute API 2.0. Legacy clients will eventually be migrated to Dispute API 3.0.


        Use the Get Questionnaire endpoint to retrieve the follow-up questions for a dispute. The questions are based on the answer submitted by Add Case Reasons.


        This endpoint is part of a conversational API—a series of endpoint calls that must be made in a certain order. For instructions see the Creating an API 2.0 Dispute guide.


        - **Previous endpoint:** Add Transactions

        - **Next endpoint:**

        - **Required**. Add Questionnaire

        - _Optional_. Get Other Accounts

        - _Optional_. Get Similar Transactions

        - _Optional_. Get Credit Transactions'
