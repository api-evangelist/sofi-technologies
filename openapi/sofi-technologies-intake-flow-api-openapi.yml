ctDateOverridden\",\n\t\t\t\t\t\t\t\"format\": \"Internal\",\n\t\t\t\t\t\t\t\"displayText\": \"The contact date assigned to the claim is 8/21/23. Would you like to override this date? Note: Changing the date may have regulatory impacts.\",\n\t\t\t\t\t\t\t\"dataType\": \"String\",\n\t\t\t\t\t\t\t\"selectedAnswer\": \"false\"\n\t\t\t\t\t\t}],\n\t\t\t\t\t\t\"type\": \"Questionnaire\",\n\t\t\t\t\t\t\"identifier\": \"ContactDateOverride\",\n\t\t\t\t\t\t\"displayText\": \"\",\n\t\t\t\t\t\t\"dataType\": \"String\"\n\t\t\t\t\t}],\n\t\t\t\t\t\"type\": \"Questionnaire\",\n\t\t\t\t\t\"identifier\": \"FCRAClaimDetails\",\n\t\t\t\t\t\"displayText\": \"\",\n\t\t\t\t\t\"dataType\": \"String\"\n\t\t\t\t}],\n\t\t\t\t\"type\": \"Questionnaire\",\n\t\t\t\t\"identifier\": \"ManualPCWithhold\",\n\t\t\t\t\"displayText\": \"\",\n\t\t\t\t\"dataType\": \"String\"\n\t\t\t}],\n\t\t\t\"type\": \"Questionnaire\",\n\t\t\t\"identifier\": \"Decree587Declared\",\n\t\t\t\"displayText\": \"\",\n\t\t\t\"dataType\": \"String\"\n\t\t}],\n\t\t\"identifier\": \"SummaryQuestions\"\n\t},\n\t\"transactionDetails\": {\n\t\t\"pendingSummaryHeader\": \"You are disputing the following pending transaction(s):\",\n\t\t\"selectedPendingTransactionList\": [{\n\t\t\t\"debitCredit\": \"Debit\",\n\t\t\t\"authorizationStatus\": \"Pending\",\n\t\t\t\"transactionType\": \"ATMWD\",\n\t\t\t\"description\": \"LOPEZ LLC #9556, NORTH JOHN, DE\",\n\t\t\t\"amount\": \"439.78\",\n\t\t\t\"cardNumberEndingIn\": \"5898\",\n\t\t\t\"amountInfo\": {\n\t\t\t\t\"exponent\": 2,\n\t\t\t\t\"iSOCodeNumeric\": \"840\",\n\t\t\t\t\"amount\": 439.78,\n\t\t\t\t\"iSOCurrencyName\": \"US Dollar\",\n\t\t\t\t\"iSOCodeAlpha\": \"USD\"\n\t\t\t},\n\t\t\t\"date\": \"20210303\",\n\t\t\t\"transactionId\": \"P643|162983403900|4813|M|AUW\"\n\t\t}]\n    }\n\t},\n\t\"echo\": {\n\t\t\"transactionId\": \"9845dk-39fdk3fj3-4483483478\"\n\t},\n\t\"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n\t\"systemTimestamp\": \"2020-07-13 10:38:13\"\n}"
