openapi: 3.2.0
info:
  title: Dispute API 2.0 Intake Flow API
  version: '1.0'
servers:
- url: dispute-api-{corename}.{env}.gpsrv.com/
tags:
- name: Intake Flow
paths:
  /submitCase:
    post:
      summary: Submit Case
      description: '> 👍 Availability

        >

        > No new clients will be set up with Dispute API 2.0. Legacy clients will eventually be migrated to Dispute API 3.0.


        Use the Submit Case endpoint to finalize a dispute case when the account holder presses a "submit" button on your user interface.


        This endpoint is part of a conversational API—a series of endpoint calls that must be made in a certain order. For instructions see the Creating an API 2.0 Dispute guide.


        - **Previous endpoint:** Get Case Summary

        - **Next endpoint:** _Optional_. Get Case Confirmation'
      parameters: []
      tags:
      - Intake Flow
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Provider''s web service username, as provided by Galileo for the requesting IP address.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by Galileo for the requesting IP address.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                providerId:
                  type: integer
                  format: int32
                  description: 'Galileo-issued unique provider identifier.

                    Pattern: Max 10 digits

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'A provider-generated ID that is unique to each API call. A UUID is preferred. Do not reuse this identifier for multiple API calls.

                    Pattern: 60 characters or less

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 9845dk-39fdk3fj3-4483483478
                caseId:
                  type: string
                  pattern: ^$|^([0-9]{11}[A-Z]{1})$
                  description: 'Case identifier as returned by <a href="ref:dispute_post_createcase" target="_blank">Create Case</a>.

                    Pattern: Max 11 digits with a letter

                    Example: "`22021000017C`"'
                  example: 22021000017C
                questionnaire:
                  type: string
                  description: 'Array of `identifier`/`answerValue` pairs from the questionnaire returned by <a href="ref:dispute_post_getcasesummary" target="_blank">Get Case Summary</a>. Populate this field with answers about updating the contact date. Do not permit the account holder to update the contact date. Answers about contact information should be passed in `correspondenceDetails`.

                    Pattern: JSON array

                    Example: ` [{"identifier": "<string>", "answerValue": "<string>"}, {"identifier": "<string>", "answerValue": "<string>"}]`'
                  example: " [\n                                {\n                                    \"identifier\": \"OverrideContactDate\",\n                                    \"answerValue\": \"8/18/23\"\n                                },\n                                {\n                                    \"identifier\": \"IsContactDateOverridden\",\n                                    \"answerValue\": \"True\"\n                                },\n                                {\n                                    \"identifier\": \"ContactDateOverrideReason\",\n                                    \"answerValue\": \"Application error\"\n                                }\n                            ]"
                correspondenceDetails:
                  type: string
                  description: 'Populate this field to change contact information just for this case. This value updates the contact information for this case only, not the account holder''s existing record. See <a href="ref:api-reference-correspondencedetails-subfields" target="_blank">`correspondenceDetails` Subfields</a> for valid values.

                    Pattern: JSON array

                    Example: `''{''selectedChannel'': ''Email'', ''emailAddress'': ''test@example.com''}''`'
                  example: "\n            {\n                \"selectedChannel\":\"Mail\",\n                \"address\": {\n                    \"line1\":\"123 Crimson St\",\n                    \"line2\":\"Apt B6\",\n                    \"line3\":\"ATTN: Supervisor\",\n                    \"city\":\"Seattle\",\n                    \"state\":\"WA\",\n                    \"zip\":\"98109-0032\",\n                    \"country\":\"USA\"\n                }\n            }\n            "
              required:
              - apiLogin
              - apiTransKey
              - caseId
              - providerId
              - transactionId
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processingTime:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transactionId:
                        type:
                        - string
                        - 'null'
                        description: The `transactionId` that was passed in the API request
                    required:
                    - transactionId
                  systemTimestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A Galileo-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  responseData:
                    description: A structure for the response data. This endpoint does not return response data, so it will always be empty.
                    type: object
                    properties: {}
                required:
                - echo
                - processingTime
                - responseData
                - rtoken
                - status
                - statusCode
                - systemTimestamp
              examples:
                response:
                  value: "{\n  \"statusCode\": 0,\n  \"status\": \"Success\",\n  \"processingTime\": 0.081,\n  \"responseData\": {},\n  \"echo\": {\n    \"transactionId\": \"9845dk-39fdk3fj3-4483483478\"\n  },\n  \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n  \"systemTimestamp\": \"2020-07-13 10:38:13\"\n}\n"
      operationId: dispute_post_submitcase
  /createCase:
    post:
      summary: Create Case
      description: '> 👍 Availability

        >

        > No new clients will be set up with Dispute API 2.0. Legacy clients will eventually be migrated to Dispute API 3.0.


        Use the Create Case endpoint to initiate a dispute claim. A single claim may contain multiple disputed transactions. Call this endpoint when the account holder initiates a claim by clicking a "dispute a transaction" control on your interface.


        This endpoint returns a case number (`caseId`) that you pass with all subsequent endpoint calls that are related to this dispute.


        This endpoint is part of a conversational API—a series of endpoint calls that must be made in a certain order. For instructions see the Creating an API 2.0 Dispute guide.


        - **Next endpoint:** Get Case Reasons'
      parameters: []
      tags:
      - Intake Flow
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Provider''s web service username, as provided by Galileo for the requesting IP address.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by Galileo for the requesting IP address.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                providerId:
                  type: integer
                  format: int32
                  description: 'Galileo-issued unique provider identifier.

                    Pattern: Max 10 digits

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'A provider-generated ID that is unique to each API call. A UUID is preferred. Do not reuse this identifier for multiple API calls.

                    Pattern: 60 characters or less

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 9845dk-39fdk3fj3-4483483478
                accountNo:
                  type: string
                  pattern: ^$|^([0-9]{12}|[0-9]{16})$
                  description: 'The <<glossary:PRN>> or <<glossary:PAN>> of the account. If more than one card is associated with the PRN, use the PAN.

                    Pattern: PAN or PRN

                    Example: `"074103447228"`'
                  example: 074103447228
              required:
              - accountNo
              - apiLogin
              - apiTransKey
              - providerId
              - transactionId
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processingTime:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transactionId:
                        type:
                        - string
                        - 'null'
                        description: The `transactionId` that was passed in the API request
                    required:
                    - transactionId
                  systemTimestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A Galileo-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  responseData:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      caseId:
                        type: string
                        description: The case identifier that you will use in all subsequent calls for the dispute that you initiated with this call. This number is unique across Galileo.
                    required:
                    - caseId
                required:
                - echo
                - processingTime
                - responseData
                - rtoken
                - status
                - statusCode
                - systemTimestamp
              examples:
                response:
                  value: "{\n  \"statusCode\": 0,\n  \"status\": \"Success\",\n  \"processingTime\": 0.081,\n  \"responseData\": {\n     \"caseId\":\"12345678\"\n  },\n  \"echo\": {\n    \"transactionId\": \"9845dk-39fdk3fj3-4483483478\"\n  },\n  \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n  \"systemTimestamp\": \"2020-07-13 10:38:13\"\n}\n"
      operationId: dispute_post_createcase
  /getCaseReasons:
    post:
      summary: Get Case Reasons
      description: '> 👍 Availability

        >

        > No new clients will be set up with Dispute API 2.0. Legacy clients will eventually be migrated to Dispute API 3.0.


        Use the Get Case Reasons endpoint to retrieve the case reasons, which are questions and answers that you display to the account holder during the creation of a dispute case. The answers to these questions classify the type of dispute and provide a reason for the dispute. The case reasons are radio buttons so that the account holder can select only one option.


        This endpoint is part of a conversational API—a series of endpoint calls that must be made in a certain order. For instructions see the Creating an API 2.0 Dispute guide.


        - **Previous endpoint:** Create Case

        - **Next endpoint:** Add Case Reasons'
      parameters: []
      tags:
      - Intake Flow
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Provider''s web service username, as provided by Galileo for the requesting IP address.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by Galileo for the requesting IP address.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                providerId:
                  type: integer
                  format: int32
                  description: 'Galileo-issued unique provider identifier.

                    Pattern: Max 10 digits

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'A provider-generated ID that is unique to each API call. A UUID is preferred. Do not reuse this identifier for multiple API calls.

                    Pattern: 60 characters or less

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 9845dk-39fdk3fj3-4483483478
                caseId:
                  type: string
                  pattern: ^$|^([0-9]{11}[A-Z]{1})$
                  description: 'Case identifier as returned by <a href="ref:dispute_post_createcase" target="_blank">Create Case</a>.

                    Pattern: Max 11 digits with a letter

                    Example: "`22021000017C`"'
                  example: 22021000017C
              required:
              - apiLogin
              - apiTransKey
              - caseId
              - providerId
              - transactionId
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processingTime:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transactionId:
                        type:
                        - string
                        - 'null'
                        description: The `transactionId` that was passed in the API request
                    required:
                    - transactionId
                  systemTimestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A Galileo-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  responseData:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      questionList:
                        type: object
                        properties:
                          questionList:
                            type: array
                            description: List of questions to present
                            items:
                              type: object
                              properties:
                                identifier:
                                  type: string
                                  description: Tag for the question
                                format:
                                  type: string
                                  enum:
                                  - Caption
                                  - Default
                                  - Internal
                                  - Notification
                                  - Warning
                                  description: Metadata describing the question format. It can be used to optionally provide different visual treatment
                                dataType:
                                  type: string
                                  description: Data type for the question
                                answerList:
                                  type: array
                                  description: List of answers for a question
                                  items:
                                    type: object
                                    properties:
                                      identifier:
                                        type: string
                                        description: Tag for the answer
                                      questionList:
                                        type: array
                                        description: List of questions to present
                                        items:
                                          type: object
                                          properties: {}
                                      displayText:
                                        type: string
                                        description: Text to display of the question or answer
                                    required:
                                    - displayText
                                    - identifier
                                isOptional:
                                  type: boolean
                                  description: Is this question an optional?
                                selectedAnswer:
                                  type: string
                                  description: The selected answer to this question. This could be a default for an initially loaded questionnaire or a persisted previous answer.
                                type:
                                  type: string
                                  enum:
                                  - YesNo
                                  - Date
                                  - DateTime
                                  - Text
                                  - TextMulti
                                  - Dropdown
                                  - AutoComplete
                                  - RadioButtons
                                  - Checkboxes
                                  - MultiSelect
                                  - Decimal
                                  - Integer
                                  - Currency
                                  - RichText
                                  - Nothing
                                  - Section
                                  - Questionnaire
                                  description: Type of question
                                apiDocumentationList:
                                  type: array
                                  description: This is returned for questions of type Section. It contains the implementation details to provide the answer to the questions.
                                  items:
                                    type: object
                                    properties:
                                      implementationNotes:
                                        type: string
                                        description: Description of the connector.
                                      method:
                                        type: string
                                        description: Method for REST connector (always 'post').
                                      endpoint:
                                        type: string
                                        description: REST connector endpoint suffix.
                                    required:
                                    - endpoint
                                    - implementationNotes
                                displayText:
                                  type: string
                                  description: Text of the question to display
                              required:
                              - answerList
                              - dataType
                              - displayText
                              - identifier
                              - type
                        required:
                        - questionList
                required:
                - echo
                - processingTime
                - responseData
                - rtoken
                - status
                - statusCode
                - systemTimestamp
              examples:
                response:
                  value: "{\n  \"statusCode\": 0,\n  \"status\": \"Success\",\n  \"processingTime\": 24.609,\n  \"responseData\": {\n    \"questionList\": [\n      {\n        \"type\": \"RadioButtons\",\n        \"identifier\": \"ClaimReasonType\",\n        \"displayText\": \"Which of the following would you like to report?\",\n        \"dataType\": \"String\",\n        \"answerList\": [\n          {\n            \"questionList\": [\n              {\n                \"type\": \"RadioButtons\",\n                \"identifier\": \"ClaimReason\",\n                \"displayText\": \"Which of the following best describes the reason for your dispute?\",\n                \"dataType\": \"String\",\n                \"answerList\": [\n                  {\n                    \"identifier\": \"MerchantDuplicate\",\n                    \"displayText\": \"I was charged more than once.\"\n                  },\n                  {\n                    \"identifier\": \"MerchantNotProvided\",\n                    \"displayText\": \"I haven't received merchandise or a service I purchased.\"\n                  },\n                  {\n                    \"identifier\": \"MerchantCreditNotIssued\",\n                    \"displayText\": \"I cancelled or returned the merchandise or service and have not received the expected credit.\"\n                  },\n                  {\n                    \"identifier\": \"MerchantRecurring\",\n                    \"displayText\": \"I have an issue with a recurring transaction on my account.\"\n                  },\n                  {\n                    \"identifier\": \"MerchandiseServiceIssue\",\n                    \"displayText\": \"I am dissatisfied with the merchandise or a service I received.\"\n                  },\n                  {\n                    \"identifier\": \"ChargedCreditedIncorrect\",\n                    \"displayText\": \"I was charged or credited incorrectly.\"\n                  }\n                ]\n              }\n            ],\n            \"identifier\": \"NonFraud\",\n            \"displayText\": \"I made this purchase, but there is a problem and I need to dispute it.\"\n          },\n          {\n            \"questionList\": [\n              {\n                \"type\": \"RadioButtons\",\n                \"identifier\": \"ClaimReason\",\n                \"displayText\": \"Which of the following best describes the reason for your dispute?\",\n                \"dataType\": \"String\",\n                \"answerList\": [\n                  {\n                    \"identifier\": \"CardLost\",\n                    \"displayText\": \"I lost my card.\"\n                  },\n                  {\n                    \"identifier\": \"CardStolen\",\n                    \"displayText\": \"My card was stolen.\"\n                  },\n                  {\n                    \"identifier\": \"CardNotReceived\",\n                    \"displayText\": \"I did not receive my card.\"\n                  },\n                  {\n                    \"identifier\": \"CardSecure\",\n                    \"displayText\": \"I didn't make the purchase, but I still have my card.\"\n                  }\n                ]\n              }\n            ],\n            \"identifier\": \"Fraud\",\n            \"displayText\": \"I did not authorize this transaction. I suspect fraud.\"\n          },\n          {\n            \"questionList\": [\n              {\n                \"type\": \"RadioButtons\",\n                \"identifier\": \"ClaimReason\",\n                \"displayText\": \"Tell us about the reason behind the dispute.\",\n                \"dataType\": \"String\",\n                \"answerList\": [\n                  {\n                    \"identifier\": \"ATMPar\",\n                    \"displayText\": \"I did not receive cash or received partial cash at an ATM.\"\n                  }\n                ]\n              }\n            ],\n            \"identifier\": \"NonFraudATM\",\n            \"displayText\": \"I had an issue while using my card at an ATM.\"\n          },\n          {\n            \"identifier\": \"AuthChargeback\",\n            \"displayText\": \"There is an authorization issue.\"\n          }\n        ]\n      }\n    ]\n  },\n  \"echo\": {\n    \"transactionId\": \"fa93a690-0b4a-4039-8437-fac9ffc1cbaa\"\n  },\n  \"systemTimestamp\": \"2022-04-14 14:52:55\",\n  \"rtoken\": \"3f6fa179-c510-4214-b96b-8f0a03d0912c\"\n}\n"
      operationId: dispute_post_getcasereasons
  /addCaseReasons:
    post:
      summary: Add Case Reasons
      description: '> 👍 Availability

        >

        > No new clients will be set up with Dispute API 2.0. Legacy clients will eventually be migrated to Dispute API 3.0.


        Use the Add Case Reasons endpoint to submit the account holder''s answers to the case-reason questions while creating a dispute claim.


        This endpoint is part of a conversational API—a series of endpoint calls that must be made in a certain order. For instructions see the Creating an API 2.0 Dispute guide.


        - **Previous endpoint:** Get Case Reasons

        - **Next endpoint:** Get Transactions'
      parameters: []
      tags:
      - Intake Flow
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Provider''s web service username, as provided by Galileo for the requesting IP address.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by Galileo for the requesting IP address.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                providerId:
                  type: integer
                  format: int32
                  description: 'Galileo-issued unique provider identifier.

                    Pattern: Max 10 digits

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'A provider-generated ID that is unique to each API call. A UUID is preferred. Do not reuse this identifier for multiple API calls.

                    Pattern: 60 characters or less

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 9845dk-39fdk3fj3-4483483478
                caseId:
                  type: string
                  pattern: ^$|^([0-9]{11}[A-Z]{1})$
                  description: 'Case identifier as returned by <a href="ref:dispute_post_createcase" target="_blank">Create Case</a>.

                    Pattern: Max 11 digits with a letter

                    Example: "`22021000017C`"'
                  example: 22021000017C
                questionnaire:
                  type: string
                  description: 'Array of `identifier`/`answerValue` pairs.

                    Pattern: JSON array

                    Example: `[{"identifier": "<text>", "answerValue": "<text>"}]`'
                  example: "[\n                            {\n                                \"Identifier\": \"ClaimTransType\",\n                                \"AnswerValue\": \"true\"\n                            },\n                            {\n                                \"Identifier\": \"ClaimReasonType\",\n                                \"AnswerValue\": \"Fraud\"\n                            },\n                            {\n                                \"Identifier\": \"ClaimReason\",\n                                \"AnswerValue\": \"CardSecure\"\n                            }\n                        ]"
              required:
              - apiLogin
              - apiTransKey
              - caseId
              - providerId
              - transactionId
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processingTime:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transactionId:
                        type:
                        - string
                        - 'null'
                        description: The `transactionId` that was passed in the API request
                    required:
                    - transactionId
                  systemTimestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A Galileo-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  responseData:
                    description: A structure for the response data. This endpoint does not return response data, so it will always be empty.
                    type: object
                    properties: {}
                required:
                - echo
                - processingTime
                - responseData
                - rtoken
                - status
                - statusCode
                - systemTimestamp
              examples:
                response:
                  value: "{\n  \"statusCode\": 0,\n  \"status\": \"Success\",\n  \"processingTime\": 0.081,\n  \"responseData\": {},\n  \"echo\": {\n    \"transactionId\": \"9845dk-39fdk3fj3-4483483478\"\n  },\n  \"rtoken\": \"8cc16de0-5eda-4e2a-968e-3b08fce6f778\",\n  \"systemTimestamp\": \"2020-07-13 10:38:13\"\n}\n"
      operationId: dispute_post_addcasereasons
  /getTransactions:
    post:
      summary: Get Transactions
      description: '> 👍 Availability

        >

        > No new clients will be set up with Dispute API 2.0. Legacy clients will eventually be migrated to Dispute API 3.0.


        Use the Get Transactions endpoint to retrieve the account holder transactions that are eligible to be disputed. You can filter the results by start date, end date, amount, and merchant name.


        This endpoint is part of a conversational API—a series of endpoint calls that must be made in a certain order. For instructions see the Creating an API 2.0 Dispute guide.


        - **Previous endpoint:** Add Case Reasons

        - **Next endpoint:** Add Transactions'
      parameters: []
      tags:
      - Intake Flow
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Provider''s web service username, as provided by Galileo for the requesting IP address.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by Galileo for the requesting IP address.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                providerId:
                  type: integer
                  format: int32
                  description: 'Galileo-issued unique provider identifier.

                    Pattern: Max 10 digits

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
