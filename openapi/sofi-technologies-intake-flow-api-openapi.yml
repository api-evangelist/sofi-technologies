                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A Galileo-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  responseData:
                    description: A structure for the response data. This endpoint does not return response data, so it will always be empty.
                    type: object
                    properties: {}
                required:
                - echo
                - processingTime
                - responseData
                - rtoken
                - status
                - statusCode
                - systemTimestamp
              examples:
                response:
                  value: "{\n\t\"statusCode\": 0,\n\t \"status\": \"Success\",\n\t \"processingTime\": 2.453,\n\t \"responseData\": {},\n\t \"echo\": {\"transactionId\": \"6986e14f-6151-45a4-b451-7212d4ed791a\"},\n \"systemTimestamp\": \"2023-05-17 15:22:57\", \n\"rtoken\": \"18eda716-bf42-4d6e-8357-95ada375adc7\"\n}"
      operationId: dispute_post_addsimilartransactions
  /getCreditTransactions:
    post:
      summary: Get Credit Transactions
      description: '> 👍 Availability

        >

        > No new clients will be set up with Dispute API 2.0. Legacy clients will eventually be migrated to Dispute API 3.0.


        Use the Get Credit Transactions endpoint to retrieve transactions that credit the customer account. Call this endpoint when the account holder answers **Yes** to the question "Were you issued a partial credit?" (`IssuedPartialCredit`).


        This endpoint is part of a conversational API—a series of endpoint calls that must be made in a certain order. For instructions see the Creating an API 2.0 Dispute guide.


        - **Previous endpoint:** Get Questionnaire

        - **Next endpoint:** Add Similar Transactions'
      parameters: []
      tags:
      - Intake Flow
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Provider''s web service username, as provided by Galileo for the requesting IP address.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by Galileo for the requesting IP address.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                providerId:
                  type: integer
                  format: int32
                  description: 'Galileo-issued unique provider identifier.

                    Pattern: Max 10 digits

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'A provider-generated ID that is unique to each API call. A UUID is preferred. Do not reuse this identifier for multiple API calls.

                    Pattern: 60 characters or less

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 9845dk-39fdk3fj3-4483483478
                caseId:
                  type: string
                  pattern: ^$|^([0-9]{11}[A-Z]{1})$
                  description: 'Case identifier as returned by <a href="ref:dispute_post_createcase" target="_blank">Create Case</a>.

                    Pattern: Max 11 digits with a letter

                    Example: "`22021000017C`"'
                  example: 22021000017C
                otherAccountNo:
                  type: string
                  pattern: ^$|^([0-9]{12}|[0-9]{16})$
                  description: 'The `accountNumber` of the other account, as returned by <a href="ref:dispute_post_getotheraccounts" target="_blank">Get Other Accounts</a>. **Required** if the account holder needs to add transactions that are on a different account than the current account.

                    Pattern: PRN

                    Example: `"074103447228"`'
                  example: 074103447228
                startDate:
                  type: string
                  format: date
                  description: 'The starting date for the transactions to return.

                    Pattern: YYYY-MM-DD

                    Example: `"2023-11-01"`'
                  example: '2023-11-01'
                endDate:
                  type: string
                  format: date
                  description: 'The ending date of the transactions to return.

                    Pattern: YYYY-MM-DD

                    Example: `"2023-11-30"`'
                  example: '2023-11-30'
                amount:
                  type: number
                  format: float
                  minimum: 0.01
                  maximum: 999999999999.99
                  description: 'Amount of the transaction to return.

                    Pattern: Positive integer or decimal number

                    Example: `100.00`, `100`, or `100.73`'
                  example: 25.5
                merchantName:
                  type: string
                  description: 'Name of the merchant that performed the transaction.

                    Pattern: string

                    Example: `"DoorDash"`'
                  example: DoorDash
              required:
              - apiLogin
              - apiTransKey
              - caseId
              - providerId
              - transactionId
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code
                  status:
                    type:
                    - string
                    - 'null'
                    description: The condition of a process or response
                  processingTime:
                    type:
                    - number
                    - 'null'
                    format: float
                    description: The time elapsed in processing the transaction
                  echo:
                    description: A structure that contains transaction ID information
                    type:
                    - object
                    - 'null'
                    properties:
                      transactionId:
                        type:
                        - string
                        - 'null'
                        description: The `transactionId` that was passed in the API request
                    required:
                    - transactionId
                  systemTimestamp:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: A system generated timestamp
                  rtoken:
                    type:
                    - string
                    - 'null'
                    description: A Galileo-generated ID used for tracking
                  errors:
                    type: array
                    description: A list of errors generated while the request was processed
                    items:
                      type: string
                  responseData:
                    description: A structure for the response data. It can be empty but usually will contain information.
                    type:
                    - object
                    - 'null'
                    properties:
                      transactionList:
                        type: array
                        description: List of transactions
                        items:
                          type: object
                          properties:
                            selectMode:
                              type: string
                              description: 'The selection mode for the dispute: `Multi` &mdash; Multiple transactions can be selected for this claim type. `Single` &mdash; Only one transaction can be selected for this claim type.'
                            amount:
                              type: string
                              description: Amount of the transaction
                            transactionDateTime:
                              type: string
                              description: 'The date-time when the transaction was authorized. Format: yyyyMMdd`T`HHmmss.SSS z'
                            cardNumberEndingIn:
                              type: string
                              description: Last four digits of the PAN
                            authorizationStatus:
                              type: string
                              description: Whether the transaction is `Posted` or `Pending`
                            amountInfo:
                              description: Description of the currency of `amount`
                              type: object
                              properties:
                                isoCurrencyName:
                                  type: string
                                  description: Currency name.
                                amount:
                                  type: string
                                  description: Amount of the transaction in this currency.
                                isoCodeAlpha:
                                  type: string
                                  description: ISO 4217 alphabetic currency code.
                                isoCodeNumeric:
                                  type: string
                                  description: ISO 4217 numeric currency code.
                                exponent:
                                  type: string
                                  description: Number of places after the decimal that the currency uses.
                            transactionType:
                              type: string
                              description: Type of transaction. See <a href="doc:creating-a-dispute#transaction-entries" target="_blank">Transaction entries</a> in *Creating a Dispute* for definitions.
                            description:
                              type: string
                              description: Description of the transaction
                            debitCredit:
                              type: string
                              description: Whether the transaction debits or credits the account
                            date:
                              type: string
                              description: 'Date of the transaction: YYYYMMDD'
                            postingDateTime:
                              type: string
                              description: 'The date-time when the transaction was posted (settled). Format: yyyyMMdd`T`HHmmss.SSS z'
                            transactionId:
                              type: string
                              description: Identifier provided by the disputes engine for the transaction
                          required:
                          - amount
                          - authorizationStatus
                          - cardNumberEndingIn
                          - date
                          - debitCredit
                          - description
                          - postingDateTime
                          - selectMode
                          - transactionDateTime
                          - transactionId
                          - transactionType
                required:
                - echo
                - processingTime
                - responseData
                - rtoken
                - status
                - statusCode
                - systemTimestamp
              examples:
                response:
                  value: "{\n\t\"statusCode\": 0,\n\t \"status\": \"Success\",\n\t \"processingTime\": 1.209,\n\t \"responseData\": {\n\t    \"transactionList\": [\n       {\n       \"transactionAmount\": \"439.780000000\",\n       \"cardLastFourDigits\": \"5898\",\n       \"disputedAmount\": \"439.780000000\",\n       \"description\": \"LOPEZ LLC #9556, NORTH JOHN, DE\",\n       \"extDisputeId\": \"23091300088D\",\n       \"postingDate\": \"1970-01-01\",\n       \"disputeStatus\": \"Pending-TempMatching\",\n       \"currentStage\": \"Enhance\",\n       \"lastCommitDate\": \"2023-09-13T22:15:54.954Z\",\n       \"transactionId\": \"P643|162983403900|4813|M|AUW\"\n       },\n       {\n       \"transactionAmount\": \"57.960000000\",\n       \"cardLastFourDigits\": \"5898\",\n       \"disputedAmount\": \"57.960000000\",\n       \"description\": \"OLSON INC #8253, STEVENBOROUG, CT\",\n       \"extDisputeId\": \"23091300089D\",\n       \"postingDate\": \"2021-03-02\",\n       \"disputeStatus\": \"New\",\n       \"currentStage\": \"Enhance\",\n       \"lastCommitDate\": \"2023-09-13T22:16:27.705Z\",\n       \"postingDateTime\": \"2021-03-02T00:00:00.000Z\",\n       \"transactionId\": \"P643|162983403900|4803|M\"\n       }\n   \t ]\t\n\t},\n\t\"echo\": {\"transactionId\": \"ccc6bcfd-588a-4beb-8e4f-13d109e097c0\"}, \n\t\"systemTimestamp\": \"2023-05-17 15:45:29\", \n\t\"rtoken\": \"d4effa49-8c29-46f2-8d27-60c113f7d6f5\"\n}"
      operationId: dispute_post_getcredittransactions
