  /addQuestionnaire:
    post:
      summary: Add Questionnaire
      description: '> 👍 Availability

        >

        > No new clients will be set up with Dispute API 2.0. Legacy clients will eventually be migrated to Dispute API 3.0.


        Use the Add Questionnaire endpoint to submit the account-holder answers to questions presented by Get Questionnaire.


        This endpoint is part of a conversational API—a series of endpoint calls that must be made in a certain order. For instructions see the Creating an API 2.0 Dispute guide.


        - **Previous endpoint:** Get Questionnaire

        - **Next endpoint:** _Optional_. Get Doc Requirements'
      parameters: []
      tags:
      - Intake Flow
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                apiLogin:
                  type: string
                  description: 'Provider''s web service username, as provided by Galileo for the requesting IP address.

                    Pattern: Max 50 characters

                    Example: `"AbC123-9999"`'
                  example: AbC123-9999
                apiTransKey:
                  type: string
                  description: 'Web service password, as provided by Galileo for the requesting IP address.

                    Pattern: Max 15 characters

                    Example: `"4sb62fh6w4h7w34g"`'
                  example: 4sb62fh6w4h7w34g
                providerId:
                  type: integer
                  format: int32
                  description: 'Galileo-issued unique provider identifier.

                    Pattern: Max 10 digits

                    Example: `9999`'
                  example: 9999
                transactionId:
                  type: string
                  minimum: 1
                  maximum: 60
                  description: 'A provider-generated ID that is unique to each API call. A UUID is preferred. Do not reuse this identifier for multiple API calls.

                    Pattern: 60 characters or less

                    Example: `"9845dk-39fdk3fj3-4483483478"`'
                  example: 9845dk-39fdk3fj3-4483483478
                caseId:
                  type: string
                  pattern: ^$|^([0-9]{11}[A-Z]{1})$
                  description: 'Case identifier as returned by <a href="ref:dispute_post_createcase" target="_blank">Create Case</a>.

                    Pattern: Max 11 digits with a letter

                    Example: "`22021000017C`"'
                  example: 22021000017C
                questionnaire:
                  type: string
                  description: "Array of `identifier`/`answerValue` pairs. For `List` data types, consult <a href=\"doc:creating-a-dispute#adding-list-answers\" target=\"_blank\">these instructions</a>.  \nPattern: JSON array\nExample: ` [{\"identifier\": \"<string>\", \"answerValue\": \"<string>\"}, {\"identifier\": \"<string>\", \"answerValue\": \"<string>\"}]`"
                  example: " [\n                            {\n                                \"identifier\": \"BothTransactionsOnSameAcctNumberInd\",\n                                \"answerValue\": \"No\"\n                            },\n                            {\n                                \"identifier\": \"IssuerOrCardholderOtherAcctWithDiffMCCardInd\",\n                                \"answerValue\": \"Yes\"\n                            },\n                            {\n                                \"identifier\": \"TrxOtherAccount\",\n                                \"answerValue\": \"Selected\"\n                            },\n                            {\n                                \"identifier\": \"IsDisputeRegardingAirlineTicketsInd\",\n                                \"answerValue\": \"No\"\n                            },\n                            {\n                                \"identifier\": \"WasResolveAttempted\",\n                                \"answerValue\": \"Yes\"\n                            },\n                            {\n                                \"identifier\": \"ResolveWithMerchantExplanation\",\n                                \"answerValue\": \"I walked up to the guy and asked him but he said no.\"\n                            },\n                            {\n                                \"identifier\": \"AddlInfo\",\n                                \"answerValue\": \"No\"\n                            }\n                        ]"
              required:
              - apiLogin
              - apiTransKey
              - caseId
              - providerId
              - questionnaire
              - transactionId
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type:
                    - integer
                    - 'null'
                    format: int32
                    description: The response status code
                  status:
                    type:
                    - string
                    - 'null'
