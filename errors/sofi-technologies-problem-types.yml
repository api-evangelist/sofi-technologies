format: proprietary
format_note: Not RFC 9457. SoFi Tech Solutions returns a flat application envelope with the outcome in
  a numeric status_code field and a human string in status; when the code is an error, an errors[] list
  carries the detail. HTTP status is usually 200 even on a business failure, so an agent that branches
  on HTTP status alone will read every rejection as a success. Content type is application/json or application/xml,
  selected by the response-content-type request header.
envelope:
  code_field: status_code
  message_field: status
  detail_field: errors
  detail_note: errors[] normally sits beside response_data; in a few endpoints it is nested INSIDE response_data
    as {"errors":{"error":"..."}} - both shapes are documented and both occur in production.
  correlation_fields:
  - rtoken
  - echo.transaction_id
  - echo.provider_transaction_id
code_scheme:
  global: bare integers, negative for system failures, 0 for success
  endpoint_specific: '{3-digit-prefix}-xx or {4-digit-prefix}-xx, documented in each operation description'
  note: Endpoint-specific codes are not enumerated in one place; they live in the 167 Program API operation
    descriptions and are carried verbatim in openapi/sofi-technologies-program-api-openapi.json.
description: The catalogue of status codes common to most SoFi Tech Solutions Program API endpoints, read
  from the provider's own Global Response Statuses enumeration, plus the Cloudflare edge codes the platform
  documents because its API web services sit behind Cloudflare.
