format: proprietary
format_note: Not RFC 9457. SoFi Tech Solutions returns a flat application envelope with the outcome in
  a numeric status_code field and a human string in status; when the code is an error, an errors[] list
  carries the detail. HTTP status is usually 200 even on a business failure, so an agent that branches
  on HTTP status alone will read every rejection as a success. Content type is application/json or application/xml,
  selected by the response-content-type request header.
envelope:
  code_field: status_code
  message_field: status
  detail_field: errors
  detail_note: errors[] normally sits beside response_data; in a few endpoints it is nested INSIDE response_data
    as {"errors":{"error":"..."}} - both shapes are documented and both occur in production.
  correlation_fields:
  - rtoken
  - echo.transaction_id
  - echo.provider_transaction_id
code_scheme:
  global: bare integers, negative for system failures, 0 for success
  endpoint_specific: '{3-digit-prefix}-xx or {4-digit-prefix}-xx, documented in each operation description'
  note: Endpoint-specific codes are not enumerated in one place; they live in the 167 Program API operation
    descriptions and are carried verbatim in openapi/sofi-technologies-program-api-openapi.json.
description: The catalogue of status codes common to most SoFi Tech Solutions Program API endpoints, read
  from the provider's own Global Response Statuses enumeration, plus the Cloudflare edge codes the platform
  documents because its API web services sit behind Cloudflare.
transport_codes:
- code: 200
  title: OK - Request was successful.
  layer: cloudflare-edge
- code: 301
  title: Moved Permanently - The target resource has been assigned a new permanent URI and any future
    references to this resource ought to use one of the enclosed URIs.
  layer: cloudflare-edge
- code: 400
  title: 'Bad Request - The web client did not send a correct request to the server. This is a web client
    error: malformed request syntax, invalid request, message framing, or deceptive request routing'
  layer: cloudflare-edge
- code: 403
  title: Forbidden - If you're seeing a 403 error without Cloudflare branding, this is always returned
    directly from the origin web server, not Cloudflare, and is generally related to permission rules
    on t
  layer: cloudflare-edge
- code: 404
  title: Not Found - Origin server was unable or unwilling to find the resource requested. This usually
    means the host server could not find the resource.
  layer: cloudflare-edge
- code: 499
  title: Client Close Request - nginx-specific response code to indicate when the connection has been
    closed by the web client while the server is still processing its request, making the server unable
    to
  layer: cloudflare-edge
- code: 500
  title: Internal Server Error - Error 500 generally indicates an issue with the origin web server.
  layer: cloudflare-edge
- code: 502
  title: Bad Gateway - Cloudflare is unable to establish contact with the origin web server.
  layer: cloudflare-edge
- code: 503
  title: Service Unavailable - The server cannot handle the request (because it is overloaded or down
    for maintenance). Generally, this is a temporary state.
  layer: cloudflare-edge
- code: 504
  title: Gateway Timeout - Cloudflare is unable to establish contact with the origin web server.
  layer: cloudflare-edge
- code: 520
  title: Web server returns an unknown error -  The origin server returns an empty, unknown, or unexpected
    response to Cloudflare.
  layer: cloudflare-edge
- code: 521
  title: Web server is down - The origin server refused connections from Cloudflare. Security solutions
    at the origin may be blocking legitimate connections from certain Cloudflare IP addresses.
  layer: cloudflare-edge
- code: 524
  title: A timeout occurred - Cloudflare was able to complete a TCP connection to the origin server but
    did not receive a timely HTTP response. In the event that a TCP session is interrupted by AWS-firewal
  layer: cloudflare-edge
- code: 530
  title: This error is returned along with a 1xxx error (https://developers.cloudflare.com/support/troubleshooting/cloudflare-errors/troubleshooting-cloudflare-1xxx-errors).
  layer: cloudflare-edge
derived_from_spec:
  note: The harvested OpenAPI definitions declare only a default response per operation; they carry no
    4xx/5xx response objects to derive from. Everything above came from the documentation, not from the
    specs.
  specs_checked: 11
