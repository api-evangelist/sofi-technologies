    closed by the web client while the server is still processing its request, making the server unable
    to
  layer: cloudflare-edge
- code: 500
  title: Internal Server Error - Error 500 generally indicates an issue with the origin web server.
  layer: cloudflare-edge
- code: 502
  title: Bad Gateway - Cloudflare is unable to establish contact with the origin web server.
  layer: cloudflare-edge
- code: 503
  title: Service Unavailable - The server cannot handle the request (because it is overloaded or down
    for maintenance). Generally, this is a temporary state.
  layer: cloudflare-edge
- code: 504
  title: Gateway Timeout - Cloudflare is unable to establish contact with the origin web server.
  layer: cloudflare-edge
- code: 520
  title: Web server returns an unknown error -  The origin server returns an empty, unknown, or unexpected
    response to Cloudflare.
  layer: cloudflare-edge
- code: 521
  title: Web server is down - The origin server refused connections from Cloudflare. Security solutions
    at the origin may be blocking legitimate connections from certain Cloudflare IP addresses.
  layer: cloudflare-edge
- code: 524
  title: A timeout occurred - Cloudflare was able to complete a TCP connection to the origin server but
    did not receive a timely HTTP response. In the event that a TCP session is interrupted by AWS-firewal
  layer: cloudflare-edge
- code: 530
  title: This error is returned along with a 1xxx error (https://developers.cloudflare.com/support/troubleshooting/cloudflare-errors/troubleshooting-cloudflare-1xxx-errors).
